# Secondary CI for the GitLab copy. Aura's CI is GitHub Actions on github.com/chetto1983/Aura
# again since 2026-10-21 (.github/workflows), which also publishes images and the
# create-aura npm package. This file runs `make quality`, ruff and the appliance's shell suites.

# Only a pipeline started from GitLab's web UI runs, and it runs every job. Every push reaches
# GitLab as origin's second push URL, and the project has no runner online: the pipeline of
# 258cee0 sat pending on 2026-10-21, as every push's would.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"

# Every job runs on the project's own runner, registered with this tag: the free tier's 400
# instance-runner minutes a month would not last a week of pushes.
default:
  tags: [aura-ci]

quality:
  image: golang:1.27.3-bookworm
  timeout: 60m
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.cache/golangci-lint
  cache:
    key:
      files: [go.sum]
    paths: [.go/pkg/mod, .go/bin, .cache]
  before_script:
    # internal/documents/filecard shells out to pdftotext, as in ci.yml's unit-test job.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends poppler-utils
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
    - go install golang.org/x/tools/cmd/deadcode@v0.48.0
    - go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
  script:
    - make quality

# ruff over the Python Aura runs: the ingest sidecar and the gate scripts. ruff.toml pins the
# version, so the install below must name the same one or ruff refuses to run.
python-lint:
  image: python:3.12-slim-bookworm
  script:
    - pip install --quiet ruff==0.17.1
    - bash scripts/ruff.sh check .

# The updater, its consent channel and image homes, the publisher and the
# installer: what an appliance runs as root, driven against stubs, as ci.yml does.
appliance-shell:
  image: golang:1.27.3-bookworm
  timeout: 15m
  before_script:
    # install_lib_test.sh merges the compose overlays with `docker compose config`, which
    # needs the CLI and its plugin but no daemon, from Docker's apt repository.
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
    - echo "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable" >/etc/apt/sources.list.d/docker.list
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends docker-ce-cli docker-compose-plugin
  script:
    - bash scripts/aura_image_update_test.sh
    - bash scripts/aura_update_consent_test.sh
    - bash scripts/aura_image_home_test.sh
    - bash scripts/cloudflare_update_test.sh
    - bash scripts/publish_images_test.sh
    - bash scripts/install_lib_test.sh
    - bash scripts/install_config_test.sh
    - bash scripts/install_preflight_test.sh
    - bash scripts/appliance_posture_test.sh
    - bash scripts/payload_manifest_gate.sh
