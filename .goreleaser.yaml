# goreleaser v2 - https://goreleaser.com
# Validate locally:  goreleaser check  &&  goreleaser build --snapshot --clean
# A real release fires from the `Release` workflow on a pushed `v*` tag.
version: 2

project_name: aura

before:
  hooks:
    - go mod tidy

builds:
  - id: aura
    main: ./cmd/aura
    binary: aura
    # Static, cross-compilable binaries: the runtime deps (pgx, the HTTP clients)
    # are pure Go, so CGO is off (CGO is only needed for the -race test tier).
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Stamped into cmd/aura/version.go and surfaced by `aura version`.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: aura
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# Publish CycloneDX/SPDX-compatible Syft inventories for both consumer
# archives and the source archive. The release workflow installs a SHA-pinned
# Syft binary before invoking GoReleaser.
sboms:
  - id: archive
    artifacts: archive
  - id: source
    artifacts: source

dockers_v2:
  - id: aura-image
    ids:
      - aura
    dockerfile: docker/aura/Dockerfile
    images:
      - ghcr.io/chetto1983/aura
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      # GitHub Actions layer cache so the ~45-60min cold image build is reused
      # across releases (the runner env is exposed by ghaction-github-runtime).
      - "--cache-from=type=gha"
      - "--cache-to=type=gha,mode=max"
    # The Dockerfile builds from source and copies docker/aura/aura-garage-bootstrap.sh
    # into the image (2026-08-30, v1.0.2-rc1 first cut: the context lacked docker/aura
    # and buildx failed with "not found" after 10 minutes of building).
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
      - web
      - docker/aura
    labels:
      org.opencontainers.image.title: Aura
      org.opencontainers.image.source: https://github.com/chetto1983/Aura
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
      - "^ci:"
      - "merge conflict"

release:
  github:
    owner: chetto1983
    name: Aura
  draft: false
  prerelease: auto
