# goreleaser v2 - https://goreleaser.com
# Validate locally:  goreleaser check  &&  goreleaser build --snapshot --clean
# A real release fires from the `Release` workflow on a pushed `v*` tag.
version: 2

project_name: aura

before:
  hooks:
    - go mod tidy

builds:
  - id: aura
    main: ./cmd/aura
    binary: aura
    # Static, cross-compilable binaries: the runtime deps (pgx, the HTTP clients)
    # are pure Go, so CGO is off (CGO is only needed for the -race test tier).
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Stamped into cmd/aura/version.go and surfaced by `aura version`.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: aura
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# Publish CycloneDX/SPDX-compatible Syft inventories for both consumer
# archives and the source archive. The release workflow installs a SHA-pinned
# Syft binary before invoking GoReleaser.
sboms:
  - id: archive
    artifacts: archive
  - id: source
    artifacts: source

dockers_v2:
  - id: aura-image
    ids:
      - aura
    dockerfile: docker/aura/Dockerfile
    images:
      - ghcr.io/chetto1983/aura
    tags:
      - "{{ .Tag }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # Same stamp publish-aura-edge.yml passes: `aura version` inside the image names
    # its commit instead of "unknown".
    build_args:
      VCS_REF: "{{ .FullCommit }}"
    flags:
      # GitHub Actions layer cache so the ~45-60min cold image build is reused
      # across releases (the runner env is exposed by ghaction-github-runtime).
      - "--cache-from=type=gha"
      - "--cache-to=type=gha,mode=max"
    # The context is a temporary directory holding only these paths, while
    # publish-aura-edge.yml builds the same Dockerfile from the whole checkout, so a
    # missing one fails only the tagged release: docker/aura on v1.0.2-rc1 (2026-08-30),
    # the payload stage's scripts/payload_manifest.txt and its files on v1.1.0
    # (2026-10-08). TestReleaseImageContextHoldsEverythingTheDockerfileReads checks the
    # list against the Dockerfile's COPY sources and the payload manifest.
    extra_files:
      - go.mod
      - go.sum
      - cmd
      - internal
      - web
      - docker/aura
      - docker/arcadedb
      - docker/garage
      - caddy
      - compose.yaml
      - compose.cpu.yaml
      - compose.vulkan.yaml
      - deploy
      - observability
      - scripts
      - searxng
    labels:
      org.opencontainers.image.title: Aura
      org.opencontainers.image.source: https://github.com/chetto1983/Aura
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# The release text is the tag's CHANGELOG.md section (scripts/release_notes.py, passed
# by release.yml as --release-notes), not a generated commit list.
changelog:
  disable: true

release:
  github:
    owner: chetto1983
    name: Aura
  draft: false
  prerelease: auto
