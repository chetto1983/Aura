version: "2"

# Tabula-rasa baseline: enable the well-tested core linters; architecture-boundary
# rules (depguard) land in the slice that introduces multi-layer imports
# (Slice 0.9 — Agent runtime). Adding linters here without a slice-level rationale
# is forbidden per CLAUDE.md §No god-class refactor-on-touch discipline.

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
    - revive
    - dupl
    # modernize: the Go 1.21+ simplifications (min/max, slices/maps helpers,
    # range-over-int, strings.Cut, any). The IDE surfaced these all along while CI
    # stayed silent, so the two disagreed about what "clean" means — enabling it
    # here makes the gate the single answer.
    - modernize

  settings:
    gosec:
      # G404 = math/rand; restore if used. G115 (integer overflow) is noisy on
      # int32 pool fields with safe sources; quiet it for now.
      excludes:
        - G115

    dupl:
      # Token threshold. Production code is clean well below this; 100 catches a
      # real copy-pasted block without flagging idiomatic CLI error-exit helpers
      # or short constructors. Test table-boilerplate is excluded via rules below.
      threshold: 100

    revive:
      rules:
        - name: exported
          arguments:
            - "disableStutteringCheck"

  exclusions:
    paths:
      - "internal/db/sqlc"        # sqlc-generated code is golden; we don't lint it
      - "third_party"             # vendored / generated trees
      - "web/node_modules"        # local frontend dependencies can contain Go examples
      - ".planning"               # spike harnesses / planning artifacts, not production code
    rules:
      # Spec() and Execute() are the two methods of the Tool interface (see
      # internal/agent/tools/spec.go). The interface documents the contract; a
      # per-implementation "Spec returns the spec" comment on each of ~30 tools is
      # the exact noise CLAUDE.md §No-comments-unless-why-is-non-obvious forbids,
      # and Go does not require doc comments on interface implementations. Every
      # OTHER exported symbol in the package is still checked — that is where
      # revive found the real gaps (the approvals API, the registry, TrustLevel).
      - path: internal/agent/tools
        text: 'exported method \w+\.(Spec|Execute) should have comment'
        linters:
          - revive
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - dupl        # table-driven test cases are intentionally repetitive
      - path: _test\.go
        # SA5011 (possible nil deref) fires after `if x == nil { t.Fatal(...) }` because the
        # go1.26-built staticcheck does not model testing.T.Fatal as no-return. A genuine nil
        # in a test panics loudly on its own, so this is a known false positive in test code
        # only — production nil-deref detection stays on.
        text: SA5011
        linters:
          - staticcheck

# Formatting is a gate, not a suggestion: enforce gofmt in CI (the lefthook
# pre-commit also runs `gofmt -w`). Run `golangci-lint fmt` to auto-fix.
formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - "internal/db/sqlc"
      - "internal/llm/client.go"
      - "third_party"
      - "web/node_modules"
      - ".planning"
