name: Publish Craft web apps

# The five Craft apps compiled from Rust cost about 35 minutes cold (pdfcraft 498 s, wordcraft
# 388 s, deckcraft 419 s, photocraft 469 s, filmcraft 295 s on 2026-10-21). They change only
# when their inputs do, so they are built here, once per input hash, and the aura image copies
# them by digest. After a run, pin the printed reference in docker/aura/Dockerfile.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "docker/craft-web/**"
      - "docker/aura-craft-web/**"
      - "scripts/craft_web_inputs.sh"
      - ".github/workflows/publish-craft-web.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-craft-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    # A cold cache compiles all five apps; a cap below that would never let the cache warm.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Hash the inputs
        id: inputs
        run: echo "tag=$(bash scripts/craft_web_inputs.sh)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/aura-craft-web/Dockerfile
          # The apps are WebAssembly and build once on the runner's platform; both entries
          # carry the same files, so an aura build on either architecture finds its manifest.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aura-craft-web:${{ steps.inputs.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # aura-edge holds these layers from when the aura image compiled them itself, so the
          # first run here reads them instead of compiling.
          cache-from: |
            type=gha,scope=craft-web
            type=gha,scope=aura-edge
          cache-to: type=gha,mode=max,scope=craft-web

      - name: Print the reference to pin
        env:
          REF: ghcr.io/${{ github.repository_owner }}/aura-craft-web:${{ steps.inputs.outputs.tag }}@${{ steps.build.outputs.digest }}
        run: |
          echo "COPY --from=$REF /apps /usr/share/aura/apps"
          echo "Pin in docker/aura/Dockerfile: \`$REF\`" >> "$GITHUB_STEP_SUMMARY"
