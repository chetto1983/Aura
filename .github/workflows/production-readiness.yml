name: Production Readiness

on:
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  readiness:
    name: Production readiness bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Locate successful exact-SHA CI run
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(
            gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$GITHUB_SHA" -f status=success -F per_page=20 \
              --jq '.workflow_runs | sort_by(.created_at) | last | .id'
          )"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact-SHA CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          mkdir -p /tmp/aura-ci-evidence artifacts/production-readiness
          for artifact in \
            audit-closure capability-eval production-load-chaos disaster-recovery \
            owned-surface-coverage docker-integration-coverage agent-memory-eval \
            critical-mutation
          do
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir "/tmp/aura-ci-evidence/$artifact"
          done
          for report in \
            audit-closure-report.json capability-eval.json load-report.json \
            chaos-report.json dr-report.json observability-report.json \
            coverage-report.json docker-coverage-report.json \
            agent-memory-eval-report.json mutation-report.json
          do
            mapfile -t matches < <(find /tmp/aura-ci-evidence -type f -name "$report")
            test "${#matches[@]}" -eq 1
            cp "${matches[0]}" "artifacts/production-readiness/$report"
          done

      - name: Exact-SHA CodeQL check inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            -F per_page=100 > /tmp/aura-check-runs.json

      - name: Exact-candidate security evidence
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          PATH="$(go env GOPATH)/bin:$PATH" PYTHONPATH=scripts \
            python3 scripts/security_evidence.py \
              --check-runs-json /tmp/aura-check-runs.json

      - name: Fail-closed eleven-report release gate
        run: |
          PYTHONPATH=scripts python3 scripts/release_readiness_gate.py \
            --evidence-dir artifacts/production-readiness \
            --candidate "$GITHUB_SHA" \
            --output artifacts/production-readiness/release-readiness-report.json

      - name: Upload immutable readiness bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-readiness-${{ github.sha }}
          path: artifacts/production-readiness/
          if-no-files-found: error
          retention-days: 30

