name: Retire Aura appliance images

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE_ALL_AURA_IMAGES to delete every version of the GHCR aura package
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  retire:
    name: Delete and verify GHCR Aura versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require exact destructive confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "DELETE_ALL_AURA_IMAGES" ]]; then
            echo "confirmation phrase mismatch" >&2
            exit 1
          fi

      - name: Delete only the Aura appliance package versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="/users/${GITHUB_REPOSITORY_OWNER}/packages/container/aura/versions"

          list_versions() {
            if gh api --paginate --slurp \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$endpoint?per_page=100" > /tmp/aura-version-pages.json \
              2> /tmp/aura-package-error.txt; then
              jq '[.[][]]' /tmp/aura-version-pages.json
              return
            fi
            if grep -q "HTTP 404" /tmp/aura-package-error.txt; then
              echo '[]'
              return
            fi
            cat /tmp/aura-package-error.txt >&2
            return 1
          }

          list_versions > /tmp/aura-versions-before.json
          jq -r '.[] | "retiring version id=\(.id) digest=\(.name) tags=\(.metadata.container.tags | join(","))"' \
            /tmp/aura-versions-before.json

          jq -r '.[].id' /tmp/aura-versions-before.json | while read -r version_id; do
            gh api --method DELETE \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$endpoint/$version_id"
          done

          list_versions > /tmp/aura-versions-after.json
          jq -e 'length == 0' /tmp/aura-versions-after.json
          echo "All remote Aura appliance image versions are absent."
