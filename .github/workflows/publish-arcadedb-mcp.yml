name: Publish ArcadeDB MCP

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "cmd/arcadedb-mcp/**"
      - "internal/**"
      - "docker/arcadedb-mcp/Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/publish-arcadedb-mcp.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-arcadedb-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/arcadedb-mcp/Dockerfile
          platforms: linux/amd64
          push: true
          # The per-SHA tag stays the pinning channel compose defaults to; `edge`
          # is the moving tag deploy/aura-image-update.sh tracks on appliances.
          tags: |
            ghcr.io/${{ github.repository_owner }}/aura-arcadedb-mcp:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aura-arcadedb-mcp:edge
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=arcadedb-mcp
          cache-to: type=gha,mode=max,scope=arcadedb-mcp
