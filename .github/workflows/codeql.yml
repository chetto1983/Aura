name: CodeQL

# Free on this PUBLIC repo (CodeQL code-scanning requires GitHub Advanced
# Security only on private repos). Complements gosec + govulncheck (Go backend)
# and the eslint/jscpd/knip web gates (TS cockpit) with interprocedural
# data-flow / taint analysis.
#
# Two languages are scanned via the matrix below:
#   - go                    — the backend, built with autobuild.
#   - javascript-typescript — the React/TS cockpit in web/src, build-mode none
#                             (CodeQL extracts the sources directly, no build).
# Scope for the frontend leg is set in .github/codeql/codeql-config.yml.

on:
  push:
    branches: [ "master", "main", "tabula-rasa" ]
  pull_request:
    branches: [ "master", "main", "tabula-rasa" ]
  schedule:
    # Weekly, Monday 03:27 UTC — catches advisories in code that hasn't changed.
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to the Security tab
      actions: read
      contents: read
    strategy:
      fail-fast: false   # one language failing must not cancel the other's scan
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # build-mode: autobuild builds Go implicitly between init and analyze;
      # build-mode: none needs no build step (the JS/TS sources are extracted
      # as-is). Only the unused `manual` mode would require an explicit step.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:${{ matrix.language }}"
