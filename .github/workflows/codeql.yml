name: CodeQL

# Free on this PUBLIC repo (CodeQL code-scanning requires GitHub Advanced
# Security only on private repos). Complements gosec + govulncheck (Go backend)
# and the eslint/jscpd/knip web gates (TS cockpit) with interprocedural
# data-flow / taint analysis.
#
# Two languages are scanned via the matrix below:
#   - go                    — the backend, built with autobuild.
#   - javascript-typescript — the React/TS cockpit in web/src, build-mode none
#                             (CodeQL extracts the sources directly, no build).
# Scope for the frontend leg is set in .github/codeql/codeql-config.yml.

# Prose-only changes run nothing (see ci.yml); the weekly schedule still scans everything.
on:
  push:
    branches: [ "master", "main", "tabula-rasa" ]
    paths: &code-paths
      - "**"
      - "!prd.md"
      - "!docs/**/*.md"
      - "docs/deployment/**"
  pull_request:
    branches: [ "master", "main", "tabula-rasa" ]
    paths: *code-paths
  schedule:
    # Weekly, Monday 03:27 UTC — catches advisories in code that hasn't changed.
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to the Security tab
      actions: read
      contents: read
    strategy:
      fail-fast: false   # one language failing must not cancel the other's scan
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # build-mode: autobuild builds Go implicitly between init and analyze;
      # build-mode: none needs no build step (the JS/TS sources are extracted
      # as-is). Only the unused `manual` mode would require an explicit step.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-sarif

      # The Security tab needs a security-events token to read; the same SARIF as an
      # artifact is readable with plain actions access (agents triaging the alerts).
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-sarif/*.sarif
          if-no-files-found: error
          retention-days: 30
