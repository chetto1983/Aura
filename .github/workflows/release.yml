name: Release

# Fires on a pushed semver tag (e.g. v0.1.0). goreleaser builds cross-platform
# binaries + checksums, builds the multi-arch (amd64+arm64) appliance image with
# GitHub Actions layer caching, publishes it to ghcr.io, and cuts a GitHub
# Release. Free on this public repo (unlimited Actions minutes).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the release + upload assets
  packages: write   # push the multi-arch image to ghcr.io

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser needs full history for the changelog

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true   # module + build cache

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4   # linux/arm64 emulation

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Actions cache to buildx
        # Exports ACTIONS_CACHE_URL + ACTIONS_RUNTIME_TOKEN so goreleaser's raw
        # `docker buildx build --cache-to=type=gha` works (build-push-action does
        # this implicitly; goreleaser calls buildx directly so we set it here).
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
