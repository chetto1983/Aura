name: Release

# Fires on a pushed semver tag (e.g. v0.1.0). goreleaser builds cross-platform
# binaries + checksums, builds the multi-arch (amd64+arm64) appliance image with
# GitHub Actions layer caching, publishes it to ghcr.io, and cuts a GitHub
# Release. Free on this public repo (unlimited Actions minutes).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the release + upload assets
  packages: write   # push the multi-arch image to ghcr.io
  checks: read      # require the exact-candidate production-readiness check

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # goreleaser needs full history for the changelog

      - name: Require exact-candidate production readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            -F per_page=100 > /tmp/aura-check-runs.json
          python3 scripts/release_check_run_gate.py /tmp/aura-check-runs.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true   # module + build cache

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4; linux/arm64 emulation

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Expose GitHub Actions cache to buildx
        # Exports ACTIONS_CACHE_URL + ACTIONS_RUNTIME_TOKEN so goreleaser's raw
        # `docker buildx build --cache-to=type=gha` works (build-push-action does
        # this implicitly; goreleaser calls buildx directly so we set it here).
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft for release SBOMs
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
