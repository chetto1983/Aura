name: Release

# Fires on a pushed semver tag (e.g. v0.1.0). Builds cross-platform binaries +
# checksums via goreleaser and publishes a GitHub Release. Free on this public
# repo (unlimited Actions minutes).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # create the release + upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # goreleaser needs full history for the changelog

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
