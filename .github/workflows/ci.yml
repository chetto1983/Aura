name: CI

on:
  push:
    branches: [ "master", "main", "tabula-rasa" ]
  pull_request:
    branches: [ "master", "main", "tabula-rasa" ]

permissions:
  contents: read

# Cancel in-flight runs of the same ref when a new push lands (saves runner minutes
# on rapid pushes; in-flight runs on other refs are untouched).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build + vet + lint + file-size cap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: File-size cap (600 LOC)
        run: bash scripts/check-file-size.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  unit-test:
    name: Unit tests (race detector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        run: go test -race -count=1 ./...

  integration-test:
    name: Integration tests (db_integration tag)
    runs-on: ubuntu-latest
    # Postgres is brought up via `docker compose` (not a GitHub service container)
    # so scripts/restore_drill.sh — which runs all pg ops through
    # `docker compose exec postgres` — works against the same instance the Go
    # tests use. The compose file reads POSTGRES_* + NEO4J_PASSWORD from the env
    # block below for interpolation (the whole file is parsed even for one service).
    env:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: aura
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      # Composed role DSNs the db_integration suite reads directly (envOrSkip).
      # Without these the tagged tests SKIP and the job goes falsely green — the
      # fail-loud guard in db_test.go now turns that skip into a failure under CI.
      AURA_DB_URL: postgres://aura_app:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      AURA_DB_MIGRATE_URL: postgres://aura_migrate:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      # Slice 0.7: compose.yaml now has a neo4j service with ${NEO4J_PASSWORD:?}
      # fail-fast. Any `docker compose` invocation (restore_drill.sh uses
      # `docker compose exec postgres`) parses the whole file, so the var must be
      # present even for the Postgres-only db job. Production fail-fast is intact.
      NEO4J_PASSWORD: ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Postgres (docker compose)
        run: make db-up

      - name: Run db_integration suite with race
        run: go test -tags db_integration -race -count=1 ./internal/db/...

      - name: aura db migrate (smoke, idempotency)
        run: |
          go run ./cmd/aura db migrate
          go run ./cmd/aura db migrate
          go run ./cmd/aura db status
          go run ./cmd/aura db ping

      - name: Restore drill (<90s assertion)
        run: |
          export PGPASSWORD=${POSTGRES_PASSWORD}
          bash scripts/restore_drill.sh

  sqlc-golden:
    name: sqlc generate is in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Regenerate + diff
        run: |
          sqlc generate
          git diff --exit-code internal/db/sqlc/
