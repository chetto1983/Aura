name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Go test + Phase 2 guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Depguard architecture boundary
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --enable-only=depguard --new-from-rev=HEAD~1 ./...

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Phase 2 regression guards
        shell: pwsh
        run: |
          ./scripts/test-heuristic-removal.ps1

      - name: Run Go tests with race detector
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        # `npm install` instead of `npm ci` so the build tolerates the
        # cross-platform lock drift between Windows dev (no @emnapi/* Linux
        # WASM bindings) and Linux CI. Switch back to `npm ci` once the
        # lock is regenerated on Linux (e.g. via docker run node:22 npm i).
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        working-directory: web
        run: npm run build
