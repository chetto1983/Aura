name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Go test + Phase 2 guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Depguard architecture boundary
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --enable-only=depguard --new-from-rev=HEAD~1 ./...

      - name: File-size linter (600-LOC cap)
        run: bash scripts/check-file-size.sh .file-size-baseline.txt

      - name: Go vet
        run: go vet ./...

      - name: Lint regression delta vs baseline
        continue-on-error: true
        run: |
          # v2.12.2 syntax: --output.text.* keys (v1's --out-format was removed in v2).
          # With print-issued-lines=false, each finding is exactly one line
          # (path:line:col: rule: message); the run appends 2 summary lines
          # ("N issues:" + "* errcheck: N"). On the seed commit:
          #   50 errcheck findings + 2 summary lines = 52 - matches BASELINE.
          # Counter is wc -l, same shape as the deadcode job's wc -l < /tmp/dc-findings.txt.
          # Cross-phase coupling: when Phase 4 / CLEAN-51 enables staticcheck
          # explicitly in .golangci.yml, this runtime count rises and BASELINE
          # below MUST be bumped in the same CLEAN-51 commit.
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run \
            --output.text.path=stdout \
            --output.text.print-issued-lines=false \
            --output.text.print-linter-name=false \
            --output.text.colors=false \
            ./... 2>/dev/null | tee /tmp/lint-current.txt || true
          BASELINE=52
          CURRENT=$(wc -l < /tmp/lint-current.txt | tr -d ' ')
          echo "golangci-lint: $CURRENT findings (baseline: $BASELINE, delta: $((CURRENT - BASELINE)))"

      - name: Install dupl
        run: go install github.com/mibk/dupl@latest

      - name: Dupl regression warning (dupl -t 60)
        continue-on-error: true
        run: |
          dupl -t 60 ./cmd ./internal 2>&1 | tee /tmp/dupl-current.txt || true
          BASELINE=103
          CURRENT=$(grep -oE 'Found total [0-9]+' /tmp/dupl-current.txt | grep -oE '[0-9]+' | head -1)
          CURRENT=${CURRENT:-0}
          echo "dupl: $CURRENT clone groups (baseline: $BASELINE, delta: $((CURRENT - BASELINE)))"

      - name: Go build
        run: go build ./...

      - name: Phase 2 regression guards
        shell: pwsh
        run: |
          ./scripts/test-heuristic-removal.ps1

      - name: Run Go tests with race detector
        run: go test -race -count=1 ./...

  deadcode:
    name: Dead code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest

      - name: Run deadcode analysis
        run: |
          # Whole-program analysis across commands plus internal package tests.
          # This keeps command-only/debug entrypoints and test-covered package
          # contracts from being misclassified as dead in Aura's multi-command repo.
          deadcode -test ./cmd/... ./internal/... 2>/dev/null | grep -v '_test\.go' | tee /tmp/dc-findings.txt || true
          BASELINE=$(python3 -c "import json; d=json.load(open('docs/deadcode-baseline-2026-05-22.json')); print(len(d))")
          NEW=$(wc -l < /tmp/dc-findings.txt | tr -d ' ')
          if [ "$NEW" -gt "$BASELINE" ]; then
            echo "deadcode: $NEW unreachable production functions (baseline: $BASELINE):"
            cat /tmp/dc-findings.txt
            exit 1
          fi
          echo "deadcode: OK ($NEW findings, baseline: $BASELINE)"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        # `npm install` instead of `npm ci` so the build tolerates the
        # cross-platform lock drift between Windows dev (no @emnapi/* Linux
        # WASM bindings) and Linux CI. Switch back to `npm ci` once the
        # lock is regenerated on Linux (e.g. via docker run node:22 npm i).
        run: npm install --no-audit --no-fund

      - name: Build dashboard
        working-directory: web
        run: npm run build
