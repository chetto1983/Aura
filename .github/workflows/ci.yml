name: CI

on:
  push:
    branches: [ "master", "main", "tabula-rasa" ]
  pull_request:
    branches: [ "master", "main", "tabula-rasa" ]

permissions:
  contents: read

# Cancel in-flight runs of the same ref when a new push lands (saves runner minutes
# on rapid pushes; in-flight runs on other refs are untouched).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build + vet + lint + deadcode + file-size cap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: File-size cap (600 LOC)
        run: bash scripts/check-file-size.sh

      - name: AG-UI boundary gate (D-17, SC2)
        run: bash scripts/agui_boundary_check.sh

      - name: deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          "$(go env GOPATH)/bin/deadcode" -test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  unit-test:
    name: Unit tests (race detector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        run: go test -race -count=1 ./...

  cache-invariant:
    name: KV-cache prefix invariant gate (Postgres-free)
    runs-on: ubuntu-latest
    # Phase 6 amendment #16: from this phase onward every merge crosses this gate.
    # It drives the hidden `aura cache-audit` 20-turn replay (in-memory fakes, NO
    # DB) and fails on any messages[0] drift. Deliberately Postgres-free so it runs
    # without the docker stack. It gates ONLY the byte-identity invariant — NOT a
    # cache-hit percentage (PRD OQ4: hit-rate is provider-dependent + flaky).
    env:
      CI: "true"  # arms the in-script no-skip-as-green guards
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: AG-UI SDK pin gate (pseudo-version literal, SC4)
        # The AG-UI SDK has no subdir tags, so it resolves only to a pseudo-version
        # forever (amendment #56). Grep the LITERAL, never the 40-hex SHA — `require
        # <path> <sha40>` is invalid go.mod syntax, so a SHA grep matches 0 times
        # (Pitfall 3). Exactly 1 match is the immutable-pin invariant.
        run: '[ "$(grep -cF ''v0.0.0-20260514093510-e9e910b230b9'' go.mod)" = "1" ]'

      - name: cache invariant gate
        run: bash scripts/cache_invariant_audit.sh

      - name: cache invariant gate (negative)
        # Continuously proves the gate is NOT silently green: a mutated messages[0]
        # MUST make the gate exit 1 with `mutated` (SC#5, Pitfall #3).
        run: bash scripts/cache_invariant_negative_test.sh

  vulncheck:
    name: Supply-chain vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  integration-test:
    name: Integration tests (db_integration tag)
    runs-on: ubuntu-latest
    # Postgres is brought up via `docker compose` (not a GitHub service container)
    # so scripts/restore_drill.sh — which runs all pg ops through
    # `docker compose exec postgres` — works against the same instance the Go
    # tests use. The compose file reads POSTGRES_* + NEO4J_PASSWORD from the env
    # block below for interpolation (the whole file is parsed even for one service).
    env:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: aura
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      # Arms the no-skip-as-green guards in db_test.go + the cron store_test.go envOrSkip:
      # a missing DSN under CI t.Fatals (a skipped integration tier fails, never passes
      # green). The DSNs below are always present, so the tiers actually RUN.
      CI: "true"
      # Composed role DSNs the db_integration suite reads directly (envOrSkip).
      # Without these the tagged tests SKIP and the job goes falsely green — the
      # fail-loud guard in db_test.go now turns that skip into a failure under CI.
      AURA_DB_URL: postgres://aura_app:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      AURA_DB_MIGRATE_URL: postgres://aura_migrate:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      # Slice 0.7: compose.yaml now has a neo4j service with ${NEO4J_PASSWORD:?}
      # fail-fast. Any `docker compose` invocation (restore_drill.sh uses
      # `docker compose exec postgres`) parses the whole file, so the var must be
      # present even for the Postgres-only db job. Production fail-fast is intact.
      NEO4J_PASSWORD: ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Postgres (docker compose)
        run: make db-up

      - name: Run db_integration suite with race
        # Phase 10: the scheduler (internal/cron) db_integration tier rides this same
        # job env (AURA_DB_URL/AURA_DB_MIGRATE_URL already exported; CI=true arms the
        # no-skip-as-green guard so a missing DSN fails rather than skips). The cron
        # store/claim/recover/dispatch integration tests apply migration 0009 themselves
        # (migratedPool → EnsureRoles + Migrate), so no extra migrate step is needed.
        # Phase 12: the AG-UI gateway (internal/agui) db_integration tier (SC1 SSE
        # round-trip + SC3 GET snapshot + the 404 chokepoint) rides the SAME job env —
        # its migratedPool applies the Phase-4 migrations itself and its envOrSkip
        # t.Fatals under CI=true when the DSN is unset (no-skip-as-green, T-12-14).
        # -p 1 is MANDATORY (same rule as scripts/coverage_gate.sh): the packages share
        # ONE Postgres and each runs EnsureRoles+Migrate; parallel package binaries
        # deadlock on pg_advisory_lock once >2 integration packages exist.
        run: go test -tags db_integration -race -count=1 -p 1 ./internal/db/... ./internal/cron/... ./internal/agui/...

      - name: aura db migrate (smoke, idempotency)
        run: |
          go run ./cmd/aura db migrate
          go run ./cmd/aura db migrate
          go run ./cmd/aura db status
          go run ./cmd/aura db ping

      - name: AG-UI gateway live smoke (FakeClient/degraded leg)
        # Phase 12 SC1/SC3 LIVE wire gate: builds aura, seeds a conversation, starts
        # `aura serve`, then curls POST /agent/run (asserts RUN_STARTED…terminal frame)
        # + GET /threads/<id>/messages (asserts MESSAGES_SNAPSHOT ≥1 msg) + the 404
        # chokepoint against the REAL daemon. No real OPENROUTER_API_KEY in CI, so the
        # script runs its DEGRADED leg: a dummy non-empty key lets the daemon boot
        # (config.Load fail-fasts on an EMPTY key), the agent turn 401s at OpenRouter,
        # and the terminal frame is RUN_ERROR — RUN_STARTED + a terminal frame still
        # prove the SSE pump + translator + daemon mount end-to-end. The REASONING_*
        # assertion is gated behind the live key (operator Gate-3 only). CI=true +
        # POSTGRES_PASSWORD/AURA_DB_URL are exported in the job env, so the smoke's
        # no-skip-as-green guard fires (exit 2) if the DB env is ever dropped (T-12-14).
        # The conversation is seeded via `docker exec aura-postgres psql` against the
        # compose Postgres `make db-up` brought up.
        env:
          OPENROUTER_API_KEY: ci-degraded-no-network
        run: bash scripts/agui_smoke.sh

      - name: Restore drill (<90s assertion)
        run: |
          export PGPASSWORD=${POSTGRES_PASSWORD}
          bash scripts/restore_drill.sh

      - name: Scheduler chaos (SC#2, CI-ADVISORY — non-blocking, D-05)
        # The chaos script is the OPERATOR-GATING record (D-05): here it runs as a
        # non-blocking advisory signal (continue-on-error) so a flaky 3-worker/60s
        # partition on a shared runner never reds the build, while still exercising the
        # survivor-pickup + no-duplicate invariant in CI. The migrations are already
        # applied (db_integration migratedPool + `aura db migrate` above). A faster
        # partition window keeps the advisory step inside the job budget; the operator
        # run uses the full 60s.
        continue-on-error: true
        env:
          CHAOS_PARTITION_SEC: "20"
          CHAOS_SETTLE_SEC: "30"
          AURA_SCHEDULER_TICK_SECONDS: "3"
        run: bash scripts/scheduler_chaos.sh

  sqlc-golden:
    name: sqlc generate is in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Regenerate + diff
        run: |
          sqlc generate
          git diff --exit-code internal/db/sqlc/

  web-integration-test:
    name: Web tools (SSRF smoke + web_integration tier, live SearXNG)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Slice 5 (Phase 7). SearXNG is published on runner loopback only, matching
    # the local product install shape. SEARXNG_URL is exported so the
    # web_integration envOrSkip helper t.Fatal's under $CI when it is unset; a
    # skipped tier fails the job, never passes it green (CLAUDE.md no-skip-as-green).
    # The SSRF block smoke (SC#3) needs no backend (the gate fires before any dial),
    # so it runs on the host with CI armed.
    env:
      CI: "true"  # arms the no-skip-as-green guards in ssrf_smoke.sh + envOrSkip
      NEO4J_PASSWORD: ci-test-password       # compose.yaml parses the whole file
      POSTGRES_PASSWORD: ci-test-password    # (fail-fast vars present for `compose`)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: SSRF block smoke (SC#3, no backend needed)
        run: bash scripts/ssrf_smoke.sh

      - name: Bring up SearXNG (loopback only)
        run: docker compose up -d searxng

      - name: Wait for SearXNG healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' aura-searxng 2>/dev/null || echo starting)"
            echo "searxng health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "SearXNG did not become healthy" >&2
          docker logs aura-searxng --tail 50 || true
          exit 1

      - name: Live web_integration tier (runner loopback SearXNG)
        # Run the tagged tests from the runner host against the loopback-published
        # SearXNG endpoint. SEARXNG_URL is the only backend (no public fallback,
        # D-05/D-44).
        env:
          SEARXNG_URL: http://127.0.0.1:18080/search
        run: go test -race -count=1 -tags web_integration ./internal/web/

      - name: Tear down
        if: always()
        run: docker compose down

  knowledge-integration-test:
    name: Knowledge integration + smoke (neo4j + sidecar)
    runs-on: ubuntu-latest
    timeout-minutes: 25  # guards against a hung model/plugin download
    env:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: aura
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      AURA_DB_URL: postgres://aura_app:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      AURA_DB_MIGRATE_URL: postgres://aura_migrate:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-test-password
      AURA_NEO4J_BOLT_URL: bolt://127.0.0.1:7687
      AURA_NEO4J_DATABASE: neo4j
      AURA_MCP_NEO4J_CYPHER_BIN: mcp-neo4j-cypher
      AURA_MCP_NEO4J_CONNECT_TIMEOUT_SEC: "10"
      AURA_EMBED_BASE_URL: http://127.0.0.1:8081
      AURA_EMBED_DIMENSIONS: "768"
      # recall@5 = 5/5 is the hard, hardware-independent correctness gate. p95 is
      # latency-sensitive: a shared runner with a cold HNSW index cannot meet the
      # operator's 30ms SC#5 budget (measured 57ms cold vs 1-8ms warm), so it is
      # bounded generously here — it reports without flaking CI. The strict 30ms
      # default still gates on the operator's known hardware.
      AURA_SMOKE_P95_MS: "2000"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mcp-neo4j-cypher (LLM graph interface, spawned by the client)
        run: |
          pipx install mcp-neo4j-cypher==0.6.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bring up stack + migrate (postgres + neo4j + embed sidecar)
        run: make neo4j-migrate

      - name: Knowledge integration suite with race
        run: go test -race -count=1 -tags 'db_integration neo4j_integration' ./internal/knowledge/...

      - name: Italian retrieval smoke (recall@5 hard gate, p95 reported)
        run: make smoke

      - name: Coverage gate (owned surface >= 85%, CLAUDE.md floor)
        # Reuses the stack + composed DSNs + mcp-neo4j-cypher already wired in this
        # job. NO-SKIP-AS-GREEN: the tagged tiers t.Fatal under $CI when env is
        # unset, so a skipped tier fails the gate rather than passing it green.
        run: bash scripts/coverage_gate.sh

  multimodal-integration-test:
    name: Multimodal sidecars (multimodal_integration tier, live STT/OCR/TTS)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # guards against a hung sidecar model download
    # Phase 13 (Slice 9c, UX-04). The three 9c CPU sidecars (aura-stt/aura-tts/
    # aura-ocr-vl) are brought up via `docker compose`; the multimodal_integration
    # tier round-trips them (TTS→STT audio loop + OCR vision). The base URLs below
    # are exported so the sidecarEnvOrSkip helper t.Fatal's under $CI when one is
    # unset — a skipped tier FAILS the job, never passes it green (no-skip-as-green,
    # CLAUDE.md / VALIDATION). aura-ocr-vl is the local-vision leg (AURA_VISION_CLOUD
    # stays false in CI). POSTGRES_PASSWORD/NEO4J_PASSWORD are present so the whole
    # compose file parses (the fail-fast vars) even though this job starts only the
    # sidecars.
    env:
      CI: "true"  # arms the sidecarEnvOrSkip no-skip-as-green guards
      POSTGRES_PASSWORD: ci-test-password
      NEO4J_PASSWORD: ci-test-password
      # The loopback-published sidecar endpoints the tier reads (compose maps each
      # service to 127.0.0.1; the /v1 suffix matches the OpenAI-compat base).
      STT_BASE_URL: http://127.0.0.1:9000/v1
      MULTIMODAL_BASE_URL: http://127.0.0.1:8082/v1
      MULTIMODAL_MODEL: glm-ocr
      TTS_BASE_URL: http://127.0.0.1:8880/v1
      TTS_VOICE: if_sara
      TTS_FORMAT: opus
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile the multimodal_integration tier (always — no-skip-as-green floor)
        # The tier ALWAYS compiles in CI (the cheap, always-green floor that proves the
        # tagged file never rots). The live round-trip below runs only when the sidecars
        # are reachable; the compile gate runs unconditionally.
        run: go vet -tags multimodal_integration ./internal/channels/telegram/

      - name: Bring up the 9c sidecars (aura-stt + aura-tts + aura-ocr-vl)
        run: docker compose up -d aura-stt aura-tts aura-ocr-vl

      - name: Wait for the sidecars healthy
        run: |
          for svc in aura-stt aura-tts aura-ocr-vl; do
            ok=""
            for i in $(seq 1 60); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$svc" 2>/dev/null || echo starting)"
              echo "$svc health: $status"
              [ "$status" = "healthy" ] && ok=1 && break
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "$svc did not become healthy" >&2
              docker logs "$svc" --tail 60 || true
              exit 1
            fi
          done

      - name: Live multimodal_integration tier (TTS->STT loop + OCR vision)
        run: go test -race -count=1 -tags multimodal_integration ./internal/channels/telegram/

      - name: Tear down
        if: always()
        run: docker compose down

  telegram-integration-test:
    name: Telegram live Bot-API (telegram_integration tier, operator-token-gated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Phase 13 (Slice 9b, UX-02). The live Bot-API tier sends a photo/document/voice
    # to the OPERATOR's own chat and asserts on the Send RESPONSE (msg.Photo/Document/
    # Voice non-nil) — ground truth = the response, never the poll stream (spike
    # 017/019). It needs the operator's bot token + chat id, which live in repo
    # secrets and are ABSENT on fork PRs — so this job is optional by nature. The
    # compile-check ALWAYS runs (the always-green floor); the live send runs ONLY when
    # the secret is present (the `if` guard). When it runs, CI=true + the exported env
    # arm liveEnvOrSkip's no-skip-as-green t.Fatal (a missing var under CI fails, never
    # skips green).
    env:
      CI: "true"  # arms the liveEnvOrSkip no-skip-as-green guards
      # Map the secrets to job env at the job level (the secrets context is not
      # usable in a step-level `if`). HAS_BOT_TOKEN gates the live step; the actual
      # token/chat are passed only to the gated step's env.
      HAS_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile the telegram_integration tier (always — no-skip-as-green floor)
        run: go vet -tags telegram_integration ./internal/channels/telegram/

      - name: Live telegram_integration tier (operator bot, response-asserted)
        # Runs ONLY when the operator token secret is configured (absent on fork PRs).
        # The token/chat are exported INSIDE the gated step so liveEnvOrSkip sees them
        # and runs the live send; without the secret the step is skipped (not falsely
        # green — the compile floor above always ran).
        if: ${{ env.HAS_BOT_TOKEN == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AURA_E2E_CHAT_ID: ${{ secrets.AURA_E2E_CHAT_ID }}
        run: go test -race -count=1 -tags telegram_integration ./internal/channels/telegram/
