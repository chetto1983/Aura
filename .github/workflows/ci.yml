name: CI

on:
  push:
    branches: [ "master", "main", "tabula-rasa" ]
  pull_request:
    branches: [ "master", "main", "tabula-rasa" ]

permissions:
  contents: read

# AURA_ACCESS_TOKEN is :?-required by the caddy service in compose.yaml (the Phase-17
# appliance HTTPS ingress). compose interpolates the WHOLE file on any `compose up`, so
# every job that touches compose needs it set — a non-secret CI placeholder is enough
# (caddy itself is never started in CI; this only satisfies interpolation).
env:
  AURA_ACCESS_TOKEN: ci-not-a-secret

# Cancel in-flight runs of the same ref when a new push lands (saves runner minutes
# on rapid pushes; in-flight runs on other refs are untouched).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build + vet + lint + deadcode + file-size cap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Quality snapshot gate self-test
        run: bash scripts/quality_snapshot_gate_test.sh

      - name: Quality snapshot gate
        run: bash scripts/quality_snapshot_gate.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: File-size cap (600 LOC)
        run: bash scripts/check-file-size.sh

      - name: AG-UI boundary gate (D-17, SC2)
        run: bash scripts/agui_boundary_check.sh

      - name: deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          "$(go env GOPATH)/bin/deadcode" -test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  unit-test:
    name: Unit tests (race detector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go test -race
        run: go test -race -count=1 ./...

  windows-unit:
    name: Windows unit (OS-specific kill + atomic-write paths, O-07)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go build (windows/amd64)
        run: go build ./...

      - name: go test (unit tier — exercises the windows kill + atomic-write paths)
        # O-07 / R-36: the OS-specific process-kill (shell_exec_windows.go:
        # CREATE_NEW_PROCESS_GROUP + `taskkill /F /T /PID`) and the atomic file-write
        # (profile/atomic_windows.go) only compile + run under GOOS=windows, so the
        # Linux unit lane never exercised them. This runs the full unit tier on
        # windows-latest. NO -race: the race detector is already covered on the Linux
        # unit lane, and CGO race on the hosted Windows runner is finicky for zero
        # extra OS-kill-path signal. NO integration tags: the Windows runner has no
        # docker stack (db/neo4j/web/memory tiers are Linux-only by design).
        run: go test -count=1 ./...

  cache-invariant:
    name: KV-cache prefix invariant gate (Postgres-free)
    runs-on: ubuntu-latest
    # Phase 6 amendment #16: from this phase onward every merge crosses this gate.
    # It drives the hidden `aura cache-audit` 20-turn replay (in-memory fakes, NO
    # DB) and fails on any messages[0] drift. Deliberately Postgres-free so it runs
    # without the docker stack. It gates ONLY the byte-identity invariant — NOT a
    # cache-hit percentage (PRD OQ4: hit-rate is provider-dependent + flaky).
    env:
      CI: "true"  # arms the in-script no-skip-as-green guards
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: AG-UI SDK pin gate (pseudo-version literal, SC4)
        # The AG-UI SDK has no subdir tags, so it resolves only to a pseudo-version
        # forever (amendment #56). Grep the LITERAL, never the 40-hex SHA — `require
        # <path> <sha40>` is invalid go.mod syntax, so a SHA grep matches 0 times
        # (Pitfall 3). Exactly 1 match is the immutable-pin invariant.
        run: '[ "$(grep -cF ''v0.0.0-20260514093510-e9e910b230b9'' go.mod)" = "1" ]'

      - name: cache invariant gate
        run: bash scripts/cache_invariant_audit.sh

      - name: cache invariant gate (negative)
        # Continuously proves the gate is NOT silently green: a mutated messages[0]
        # MUST make the gate exit 1 with `mutated` (SC#5, Pitfall #3).
        run: bash scripts/cache_invariant_negative_test.sh

  vulncheck:
    name: Supply-chain vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  integration-test:
    name: Integration tests (db_integration tag)
    runs-on: ubuntu-latest
    # Postgres is brought up via `docker compose` (not a GitHub service container)
    # so scripts/restore_drill.sh — which runs all pg ops through
    # `docker compose exec postgres` — works against the same instance the Go
    # tests use. The compose file reads POSTGRES_* + NEO4J_PASSWORD from the env
    # block below for interpolation (the whole file is parsed even for one service).
    env:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: aura
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      # Arms the no-skip-as-green guards in db_test.go + the cron store_test.go envOrSkip:
      # a missing DSN under CI t.Fatals (a skipped integration tier fails, never passes
      # green). The DSNs below are always present, so the tiers actually RUN.
      CI: "true"
      # Composed role DSNs the db_integration suite reads directly (envOrSkip).
      # Without these the tagged tests SKIP and the job goes falsely green — the
      # fail-loud guard in db_test.go now turns that skip into a failure under CI.
      AURA_DB_URL: postgres://aura_app:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      AURA_DB_MIGRATE_URL: postgres://aura_migrate:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      # Slice 0.7: compose.yaml now has a neo4j service with ${NEO4J_PASSWORD:?}
      # fail-fast. Any `docker compose` invocation (restore_drill.sh uses
      # `docker compose exec postgres`) parses the whole file, so the var must be
      # present even for the Postgres-only db job. Production fail-fast is intact.
      NEO4J_PASSWORD: ci-test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Start Postgres (docker compose)
        run: make db-up

      - name: Run db_integration suite with race
        # Phase 10: the scheduler (internal/cron) db_integration tier rides this same
        # job env (AURA_DB_URL/AURA_DB_MIGRATE_URL already exported; CI=true arms the
        # no-skip-as-green guard so a missing DSN fails rather than skips). The cron
        # store/claim/recover/dispatch integration tests apply migration 0009 themselves
        # (migratedPool → EnsureRoles + Migrate), so no extra migrate step is needed.
        # Phase 12: the AG-UI gateway (internal/agui) db_integration tier (SC1 SSE
        # round-trip + SC3 GET snapshot + the 404 chokepoint) rides the SAME job env —
        # its migratedPool applies the Phase-4 migrations itself and its envOrSkip
        # t.Fatals under CI=true when the DSN is unset (no-skip-as-green, T-12-14).
        # -p 1 is MANDATORY (same rule as scripts/coverage_gate.sh): the packages share
        # ONE Postgres and each runs EnsureRoles+Migrate; parallel package binaries
        # deadlock on pg_advisory_lock once >2 integration packages exist.
        run: go test -tags db_integration -race -count=1 -p 1 ./internal/db/... ./internal/cron/... ./internal/agui/...

      - name: aura db migrate (smoke, idempotency)
        run: |
          go run ./cmd/aura db migrate
          go run ./cmd/aura db migrate
          go run ./cmd/aura db status
          go run ./cmd/aura db ping

      - name: AG-UI gateway live smoke (FakeClient/degraded leg)
        # Phase 12 SC1/SC3 LIVE wire gate: builds aura, seeds a conversation, starts
        # `aura serve`, then curls POST /agent/run (asserts RUN_STARTED…terminal frame)
        # + GET /threads/<id>/messages (asserts MESSAGES_SNAPSHOT ≥1 msg) + the 404
        # chokepoint against the REAL daemon. No real OPENROUTER_API_KEY in CI, so the
        # script runs its DEGRADED leg: a dummy non-empty key lets the daemon boot
        # (config.Load fail-fasts on an EMPTY key), the agent turn 401s at OpenRouter,
        # and the terminal frame is RUN_ERROR — RUN_STARTED + a terminal frame still
        # prove the SSE pump + translator + daemon mount end-to-end. The REASONING_*
        # assertion is gated behind the live key (operator Gate-3 only). CI=true +
        # POSTGRES_PASSWORD/AURA_DB_URL are exported in the job env, so the smoke's
        # no-skip-as-green guard fires (exit 2) if the DB env is ever dropped (T-12-14).
        # The conversation is seeded via `docker exec aura-postgres psql` against the
        # compose Postgres `make db-up` brought up.
        env:
          OPENROUTER_API_KEY: ci-degraded-no-network
        run: bash scripts/agui_smoke.sh

      - name: Restore drill (<90s assertion)
        run: |
          export PGPASSWORD=${POSTGRES_PASSWORD}
          bash scripts/restore_drill.sh

      - name: Scheduler chaos (SC#2, CI-ADVISORY — non-blocking, D-05)
        # The chaos script is the OPERATOR-GATING record (D-05): here it runs as a
        # non-blocking advisory signal (continue-on-error) so a flaky 3-worker/60s
        # partition on a shared runner never reds the build, while still exercising the
        # survivor-pickup + no-duplicate invariant in CI. The migrations are already
        # applied (db_integration migratedPool + `aura db migrate` above). A faster
        # partition window keeps the advisory step inside the job budget; the operator
        # run uses the full 60s.
        continue-on-error: true
        env:
          CHAOS_PARTITION_SEC: "20"
          CHAOS_SETTLE_SEC: "30"
          AURA_SCHEDULER_TICK_SECONDS: "3"
        run: bash scripts/scheduler_chaos.sh

  sqlc-golden:
    name: sqlc generate is in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      - name: Regenerate + diff
        run: |
          sqlc generate
          git diff --exit-code internal/db/sqlc/

  web-integration-test:
    name: Web tools (SSRF smoke + web_integration tier, live SearXNG)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Slice 5 (Phase 7). SearXNG is published on runner loopback only, matching
    # the local product install shape. SEARXNG_URL is exported so the
    # web_integration envOrSkip helper t.Fatal's under $CI when it is unset; a
    # skipped tier fails the job, never passes it green (CLAUDE.md no-skip-as-green).
    # The SSRF block smoke (SC#3) needs no backend (the gate fires before any dial),
    # so it runs on the host with CI armed.
    env:
      CI: "true"  # arms the no-skip-as-green guards in ssrf_smoke.sh + envOrSkip
      NEO4J_PASSWORD: ci-test-password       # compose.yaml parses the whole file
      POSTGRES_PASSWORD: ci-test-password    # (fail-fast vars present for `compose`)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: SSRF block smoke (SC#3, no backend needed)
        run: bash scripts/ssrf_smoke.sh

      - name: Bring up SearXNG (loopback only)
        run: docker compose up -d searxng

      - name: Wait for SearXNG healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' aura-searxng 2>/dev/null || echo starting)"
            echo "searxng health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          echo "SearXNG did not become healthy" >&2
          docker logs aura-searxng --tail 50 || true
          exit 1

      - name: Live web_integration tier (runner loopback SearXNG)
        # Run the tagged tests from the runner host against the loopback-published
        # SearXNG endpoint. SEARXNG_URL is the only backend (no public fallback,
        # D-05/D-44).
        env:
          SEARXNG_URL: http://127.0.0.1:18080/search
        run: go test -race -count=1 -tags web_integration ./internal/web/

      - name: Tear down
        if: always()
        run: docker compose down

  knowledge-integration-test:
    name: Knowledge integration + smoke (neo4j + sidecar)
    runs-on: ubuntu-latest
    timeout-minutes: 25  # guards against a hung model/plugin download
    env:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: aura
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      AURA_DB_URL: postgres://aura_app:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      AURA_DB_MIGRATE_URL: postgres://aura_migrate:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-test-password
      AURA_NEO4J_BOLT_URL: bolt://127.0.0.1:7687
      AURA_NEO4J_DATABASE: neo4j
      AURA_MCP_NEO4J_CYPHER_BIN: mcp-neo4j-cypher
      AURA_MCP_NEO4J_CONNECT_TIMEOUT_SEC: "10"
      AURA_EMBED_BASE_URL: http://127.0.0.1:8081
      AURA_EMBED_DIMENSIONS: "384"
      # The host export dir the writer materializes ACTIVE snippets into; the SC#4
      # by-path snippet exec (now db_integration, host python3) runs them from here, so
      # the coverage gate's internal/skills tier RUNS instead of a falsely-green skip.
      AURA_SKILL_EXPORT_DIR: /tmp/aura-skills-export
      # CI-only compose override: cache immutable downloads/plugins without
      # persisting database/runtime state between hosted runners.
      COMPOSE_FILE: compose.yaml:.github/compose.ci-cache.yaml
      AURA_CI_LLAMA_CACHE_DIR: /tmp/aura-ci-cache/llama.cpp
      AURA_CI_NEO4J_PLUGINS_DIR: /tmp/aura-ci-cache/neo4j-plugins
      # recall@5 = 5/5 is the hard, hardware-independent correctness gate. p95 is
      # latency-sensitive: a shared runner with a cold HNSW index cannot meet the
      # operator's 30ms SC#5 budget (measured 57ms cold vs 1-8ms warm), so it is
      # bounded generously here — it reports without flaking CI. The strict 30ms
      # default still gates on the operator's known hardware.
      AURA_SMOKE_P95_MS: "2000"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install mcp-neo4j-cypher (LLM graph interface, spawned by the client)
        run: |
          pipx install mcp-neo4j-cypher==0.6.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore llama.cpp embedding model cache
        uses: actions/cache@v4
        with:
          path: /tmp/aura-ci-cache/llama.cpp
          key: llama-cpp-granite-97m-q8-${{ runner.os }}-v1

      - name: Restore Neo4j plugin cache
        uses: actions/cache@v4
        with:
          path: /tmp/aura-ci-cache/neo4j-plugins
          key: neo4j-5.26.26-apoc-gds-${{ runner.os }}-v1

      - name: Prepare cached Docker bind dirs
        run: |
          mkdir -p "$AURA_CI_LLAMA_CACHE_DIR" "$AURA_CI_NEO4J_PLUGINS_DIR" "$AURA_SKILL_EXPORT_DIR"
          chmod -R a+rwX "$AURA_CI_LLAMA_CACHE_DIR" "$AURA_CI_NEO4J_PLUGINS_DIR"

      - name: Bring up stack + migrate (postgres + neo4j + embed sidecar)
        run: make neo4j-migrate

      - name: Knowledge integration suite with race
        run: go test -race -count=1 -tags 'db_integration neo4j_integration' ./internal/knowledge/...

      - name: Italian retrieval smoke (recall@5 hard gate, p95 reported)
        run: make smoke

      - name: Coverage gate (owned surface >= 85%, CLAUDE.md floor)
        # Reuses the stack + composed DSNs + mcp-neo4j-cypher already wired in this
        # job. NO-SKIP-AS-GREEN: the tagged tiers t.Fatal under $CI when env is
        # unset, so a skipped tier fails the gate rather than passing it green.
        run: bash scripts/coverage_gate.sh

  multimodal-integration-test:
    name: Multimodal sidecars (multimodal_integration tier, live STT/TTS)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # guards against a hung sidecar model download
    # Phase 13 (Slice 9c, UX-04). GitHub-hosted runners have no Nvidia device, so
    # CI live-runs only the CPU-safe audio sidecars (aura-stt/aura-tts). The compile
    # gate below still covers the OCR code path; the full STT/OCR/TTS live tier runs
    # locally or on a GPU runner. POSTGRES_PASSWORD/NEO4J_PASSWORD are present so the
    # whole compose file parses (the fail-fast vars) even though this job starts only
    # the audio sidecars.
    env:
      CI: "true"  # arms the sidecarEnvOrSkip no-skip-as-green guards
      POSTGRES_PASSWORD: ci-test-password
      NEO4J_PASSWORD: ci-test-password
      # The loopback-published sidecar endpoints the tier reads (compose maps each
      # service to 127.0.0.1; the /v1 suffix matches the OpenAI-compat base).
      STT_BASE_URL: http://127.0.0.1:9000/v1
      TTS_BASE_URL: http://127.0.0.1:8880/v1
      TTS_VOICE: if_sara
      TTS_FORMAT: opus
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile the multimodal_integration tier (always — no-skip-as-green floor)
        # The tier ALWAYS compiles in CI (the cheap, always-green floor that proves the
        # tagged file never rots). The live round-trip below runs only when the sidecars
        # are reachable; the compile gate runs unconditionally.
        run: go vet -tags multimodal_integration ./internal/channels/telegram/

      - name: Bring up the 9c audio sidecars (aura-stt + aura-tts)
        run: docker compose up -d aura-stt aura-tts

      - name: Wait for the audio sidecars healthy
        id: audio-health
        run: |
          available=1
          for svc in aura-stt aura-tts; do
            ok=""
            for i in $(seq 1 60); do
              state="$(docker inspect -f '{{.State.Status}}' "$svc" 2>/dev/null || echo missing)"
              health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$svc" 2>/dev/null || echo starting)"
              echo "$svc state=$state health=$health"
              [ "$health" = "healthy" ] && ok=1 && break
              case "$state" in
                exited|dead|missing)
                  break
                  ;;
              esac
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "$svc did not become healthy; skipping live audio tier" >&2
              docker logs "$svc" --tail 60 || true
              available=0
              break
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Live multimodal_integration audio tier (TTS->STT loop)
        if: steps.audio-health.outputs.available == '1'
        run: go test -race -count=1 -tags multimodal_integration -run '^TestLive(TTSThenSTTRoundTrip|TTSVoiceBytes)$' ./internal/channels/telegram/

      - name: Tear down
        if: always()
        run: docker compose down

  telegram-integration-test:
    name: Telegram live Bot-API (telegram_integration tier, operator-token-gated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Phase 13 (Slice 9b, UX-02). The live Bot-API tier sends a photo/document/voice
    # to the OPERATOR's own chat and asserts on the Send RESPONSE (msg.Photo/Document/
    # Voice non-nil) — ground truth = the response, never the poll stream (spike
    # 017/019). It needs the operator's bot token + chat id, which live in repo
    # secrets and are ABSENT on fork PRs — so this job is optional by nature. The
    # compile-check ALWAYS runs (the always-green floor); the live send runs ONLY when
    # the secret is present (the `if` guard). When it runs, CI=true + the exported env
    # arm liveEnvOrSkip's no-skip-as-green t.Fatal (a missing var under CI fails, never
    # skips green).
    env:
      CI: "true"  # arms the liveEnvOrSkip no-skip-as-green guards
      # Map the secrets to job env at the job level (the secrets context is not
      # usable in a step-level `if`). HAS_BOT_TOKEN gates the live step; the actual
      # token/chat are passed only to the gated step's env.
      HAS_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile the telegram_integration tier (always — no-skip-as-green floor)
        run: go vet -tags telegram_integration ./internal/channels/telegram/

      - name: Live telegram_integration tier (operator bot, response-asserted)
        # Runs ONLY when the operator token secret is configured (absent on fork PRs).
        # The token/chat are exported INSIDE the gated step so liveEnvOrSkip sees them
        # and runs the live send; without the secret the step is skipped (not falsely
        # green — the compile floor above always ran).
        if: ${{ env.HAS_BOT_TOKEN == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AURA_E2E_CHAT_ID: ${{ secrets.AURA_E2E_CHAT_ID }}
        run: go test -race -count=1 -tags telegram_integration ./internal/channels/telegram/

  memory-integration-test:
    name: Memory MCP (memory_integration tier, live agent-memory sidecar)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # guards against a hung image build / model warm-up
    # Phase 15 (Slice 11, memory subsystem). Brings up the agent-memory MCP sidecar
    # (built reproducibly from docker/agent-memory by plan 15-04) + its Neo4j graph +
    # the embed sidecar, then runs the memory_integration tier against the LIVE,
    # rebuilt image: 16-tool Deferred + memory__* mount (D-06/D-07), `aura memory`
    # seed/read + reasoning-trace round-trip (re-scoped UX-09), agent recall loop
    # (D-03), and dedup non-merge of a distinct entity (D-10 / spike-034 anti-regression).
    # NO-SKIP-AS-GREEN: AURA_AGENT_MEMORY_MCP_URL is exported so the tier RUNS; the
    # tests t.Fatal under $CI when it is unset (a skipped tier fails the gate, never
    # passes it green — CLAUDE.md). On a FRESH CI Neo4j the sidecar creates its vector
    # indexes at 384d itself, so no index alignment is needed (the local 768d->384d
    # drop in 15-05 was a one-off on the operator's accumulated graph).
    env:
      CI: "true"  # arms the no-skip-as-green t.Fatal in the tier
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: aura
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      AURA_DB_URL: postgres://aura_app:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      AURA_DB_MIGRATE_URL: postgres://aura_migrate:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-test-password
      AURA_NEO4J_BOLT_URL: bolt://127.0.0.1:7687
      AURA_NEO4J_DATABASE: neo4j
      # CI-only compose override: cache immutable downloads/plugins without
      # persisting database/runtime state between hosted runners.
      COMPOSE_FILE: compose.yaml:.github/compose.ci-cache.yaml
      AURA_CI_LLAMA_CACHE_DIR: /tmp/aura-ci-cache/llama.cpp
      AURA_CI_NEO4J_PLUGINS_DIR: /tmp/aura-ci-cache/neo4j-plugins
      # The live sidecar endpoint the tier reads (compose publishes the memory service
      # on 127.0.0.1:8091; the trailing /mcp/ is the streamable-HTTP path).
      AURA_AGENT_MEMORY_MCP_URL: http://127.0.0.1:8091/mcp/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile the memory_integration tier (always — no-skip-as-green floor)
        # The tier ALWAYS compiles in CI (the cheap, always-green floor proving the
        # tagged files never rot), even before the sidecar is up.
        run: go vet -tags memory_integration ./internal/agent/mcptools/ ./cmd/aura/ ./internal/agent/

      - name: Restore llama.cpp embedding model cache
        uses: actions/cache@v4
        with:
          path: /tmp/aura-ci-cache/llama.cpp
          key: llama-cpp-granite-97m-q8-${{ runner.os }}-v1

      - name: Restore Neo4j plugin cache
        uses: actions/cache@v4
        with:
          path: /tmp/aura-ci-cache/neo4j-plugins
          key: neo4j-5.26.26-apoc-gds-${{ runner.os }}-v1

      - name: Prepare cached Docker bind dirs
        run: |
          mkdir -p "$AURA_CI_LLAMA_CACHE_DIR" "$AURA_CI_NEO4J_PLUGINS_DIR"
          chmod -R a+rwX "$AURA_CI_LLAMA_CACHE_DIR" "$AURA_CI_NEO4J_PLUGINS_DIR"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent-memory MCP image with GHA cache
        uses: docker/build-push-action@v6
        with:
          context: ./docker/agent-memory
          tags: aura-agent-memory-mcp:local
          load: true
          cache-from: type=gha,scope=agent-memory-mcp
          cache-to: type=gha,scope=agent-memory-mcp,mode=max

      - name: Bring up Postgres + migrate (default-on managed config reads cfg)
        run: make db-migrate

      - name: Bring up Neo4j + embed sidecar
        run: make neo4j-up

      - name: Start the agent-memory MCP sidecar (cached :local image)
        run: docker compose up -d --no-build aura-agent-memory-mcp

      - name: Wait for the memory sidecar healthy
        run: |
          ok=""
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' aura-agent-memory-mcp 2>/dev/null || echo starting)"
            echo "aura-agent-memory-mcp health: $status"
            [ "$status" = "healthy" ] && ok=1 && break
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "aura-agent-memory-mcp did not become healthy" >&2
            docker logs aura-agent-memory-mcp --tail 80 || true
            exit 1
          fi

      - name: Live memory_integration tier (16-tool mount + CLI + recall + dedup)
        # Runs the tagged tests across the three owning packages against the live,
        # rebuilt sidecar. -p 1 keeps the shared Neo4j graph writes serialized.
        # -race matches every other live tier (db/web/knowledge/telegram — WR-02).
        run: go test -race -tags memory_integration -count=1 -p 1 ./internal/agent/mcptools/ ./cmd/aura/ ./internal/agent/

      - name: Tear down
        if: always()
        run: docker compose down

  # ── Phase 23 frontend web jobs (FND-03/FND-06) ──────────────────────────────
  # Four path-filtered Node-24 jobs, all blocking on every PR (D-16), all in the
  # single unified workflow (D-17 — no separate web.yml). A `dorny/paths-filter`
  # guard early-exits each job green when no web file changed, so Go-only PRs do
  # not pay the npm install cost. The filter watches web/** + this workflow file.

  web-lint:
    name: Web lint (eslint --max-warnings=0 + prettier + tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect web changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

      - name: Set up Node
        if: steps.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Lint + format-check + typecheck (D-03 zero-warning gate)
        # `lint` carries --max-warnings=0 (package.json), the golangci-lint parity bar.
        if: steps.changes.outputs.web == 'true'
        run: cd web && npm ci && npm run lint && npm run format:check && npm run typecheck

  web-test:
    name: Web unit tests (Vitest + coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect web changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

      - name: Set up Node
        if: steps.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Vitest (FND-06)
        if: steps.changes.outputs.web == 'true'
        run: cd web && npm ci && npm run test

  web-dist-freshness:
    name: Web dist freshness (committed internal/webui/dist == fresh build, D-05)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect web changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

      - name: Set up Node
        if: steps.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Rebuild + diff committed embed dist (D-05 stale guard)
        # Build writes to ../internal/webui/dist (vite outDir); the script diffs that
        # path, not web/dist. First Linux-Node-24 run is the byte-canonical proof.
        if: steps.changes.outputs.web == 'true'
        run: bash scripts/web_dist_freshness.sh

  web-e2e:
    name: Web E2E (Playwright boots aura serve over docker-compose Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Resolves A-SERVE-NOSTACK: `aura serve` hard-requires a Postgres pool (bootServe
    # → bootServeChatEnv → db.Open is unconditional). So the E2E provisions the stack
    # exactly like the AG-UI live smoke (integration-test job): a dummy non-empty
    # OPENROUTER_API_KEY lets config.LoadServe boot (the placeholder shell needs no
    # real key); the agent loop is never exercised — only the static "/" render is.
    # CI=true arms the no-skip-as-green guards in the surrounding scripts.
    env:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: aura
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      CI: "true"
      AURA_DB_URL: postgres://aura_app:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      AURA_DB_MIGRATE_URL: postgres://aura_migrate:ci-test-password@127.0.0.1:5432/aura?sslmode=disable
      NEO4J_PASSWORD: ci-test-password
      OPENROUTER_API_KEY: ci-degraded-no-network
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect web changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

      - name: Set up Go
        if: steps.changes.outputs.web == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        if: steps.changes.outputs.web == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Start Postgres (docker compose)
        if: steps.changes.outputs.web == 'true'
        run: make db-up

      - name: aura db migrate
        if: steps.changes.outputs.web == 'true'
        run: go run ./cmd/aura db migrate

      - name: Build web dist (fresh embed source)
        if: steps.changes.outputs.web == 'true'
        run: cd web && npm ci && npm run build

      - name: Build aura binary (embeds the fresh dist)
        if: steps.changes.outputs.web == 'true'
        run: go build -o aura ./cmd/aura

      - name: Install Playwright Chromium
        if: steps.changes.outputs.web == 'true'
        run: cd web && npx playwright install --with-deps chromium

      - name: Playwright E2E (webServer boots ../aura serve, SC2)
        # Playwright's webServer does not inherit runner env (#19780); playwright.config.ts
        # forwards the DB/serve vars from process.env into the webServer process, and this
        # job exports them above. The shell.spec asserts theme-before-paint + brand + no
        # hero text against the served embedded shell.
        if: steps.changes.outputs.web == 'true'
        run: cd web && npm run test:e2e

      - name: Tear down
        if: always()
        run: docker compose down
