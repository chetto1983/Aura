name: Publish Aura edge image

# Every master push ships the appliance image to ghcr.io as the moving `edge`
# tag plus an immutable per-commit tag, mirroring publish-arcadedb-mcp's
# per-push channel. The semver release channel (release.yml) stays the gated
# path — readiness check on the exact SHA, multi-arch, SBOMs — while edge is
# amd64-only and deliberately NOT readiness-gated: it is the "latest changes"
# convenience channel for the appliance host, not a release.

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

# A newer push supersedes an in-flight edge build: only the latest image
# matters on this channel (unlike the MCP publisher, which keeps every build).
concurrency:
  group: publish-aura-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push edge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/aura/Dockerfile
          platforms: linux/amd64
          push: true
          # Same stamp compose.yaml passes locally: `aura version` inside the
          # image must name this commit, so the appliance's image-update timer
          # logs checkable provenance instead of trusting the moving tag.
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aura:edge
            ghcr.io/${{ github.repository_owner }}/aura:master-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aura-edge
          cache-to: type=gha,mode=max,scope=aura-edge

      # Every image built from this repo must be published here. Without a
      # published tag a fresh appliance install tries to `docker build` it and
      # dies on the missing build context (measured 2026-08-31: `lstat
      # /opt/aura/docker: no such file or directory` killed the first clean-host
      # E2E). Appliances pull — they never build — so the edge channel carries
      # all five: aura, caddy, ingest, and the two box images below.
      - name: Build and push caddy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/caddy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aura-caddy:edge
            ghcr.io/${{ github.repository_owner }}/aura-caddy:master-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aura-caddy-edge
          cache-to: type=gha,mode=max,scope=aura-caddy-edge

      - name: Build and push ingest
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/aura-ingest/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aura-ingest:edge
            ghcr.io/${{ github.repository_owner }}/aura-ingest:master-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aura-ingest-edge
          cache-to: type=gha,mode=max,scope=aura-ingest-edge

      # aura-sandbox and aura-egress are NOT compose services — the daemon
      # creates them per identity through usersandbox — which is exactly why
      # they were missed: nothing in compose, the Makefile or install.sh ever
      # named them, so the only build of aura-sandbox in the whole repo lived in
      # scripts/production_load_chaos.py and aura-egress's in one ci.yml job.
      # The effect on a fresh appliance is total: ensureImage cannot find the
      # image, Resolve fails, SandboxRouter.Route denies, and EVERY box-capable
      # tool (shell_exec, read_file, write_file, patch, search_files, send_file,
      # document_open) denies with it, while the sandbox readiness probe holds
      # the daemon unhealthy forever. Measured 2026-08-31 on a clean host:
      # `box image "aura-sandbox:latest" unavailable: No such image`.
      - name: Build and push the per-identity box image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/aura-sandbox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aura-sandbox:edge
            ghcr.io/${{ github.repository_owner }}/aura-sandbox:master-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aura-sandbox-edge
          cache-to: type=gha,mode=max,scope=aura-sandbox-edge

      # The egress sidecar rides beside every box (SBX-04). Its image default is
      # deliberately NON-empty in config, so the tenancy floor is on by default
      # and box creation is fail-closed without it: publishing the box image
      # without this one would still leave every tool denied.
      - name: Build and push the box egress sidecar image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/aura-egress/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aura-egress:edge
            ghcr.io/${{ github.repository_owner }}/aura-egress:master-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aura-egress-edge
          cache-to: type=gha,mode=max,scope=aura-egress-edge
