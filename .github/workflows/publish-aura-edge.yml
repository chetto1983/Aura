name: Publish Aura edge image

# Every master push ships the appliance image to ghcr.io as the moving `edge`
# tag plus an immutable per-commit tag, mirroring publish-arcadedb-mcp's
# per-push channel. The semver release channel (release.yml) stays the gated
# path — readiness check on the exact SHA, multi-arch, SBOMs — while edge is
# amd64-only and deliberately NOT readiness-gated: it is the "latest changes"
# convenience channel for the appliance host, not a release.

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

# A newer push supersedes an in-flight edge build: only the latest image
# matters on this channel (unlike the MCP publisher, which keeps every build).
concurrency:
  group: publish-aura-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push edge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/aura/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aura:edge
            ghcr.io/${{ github.repository_owner }}/aura:master-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aura-edge
          cache-to: type=gha,mode=max,scope=aura-edge
