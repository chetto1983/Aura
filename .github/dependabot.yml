version: 2
updates:
  # Go module dependencies.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # One PR per week for the low-risk bumps; majors stay individual.
      go-minor-patch:
        update-types:
          - minor
          - patch

  # Web UI npm dependencies (web/package-lock.json).
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The types track the Node runtime the images ship (NodeSource 24, docker/aura/Dockerfile);
      # a major here would type APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      vitest-toolchain:
        patterns:
          - vitest
          - "@vitest/*"
      stryker-toolchain:
        patterns:
          - "@stryker-mutator/*"
      typescript-lint:
        patterns:
          - typescript
          - oxlint-tsgolint
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI / CodeQL / release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
