version: 2
updates:
  # Go module dependencies.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # One PR per week for the low-risk bumps; majors stay individual.
      go-minor-patch:
        update-types:
          - minor
          - patch

  # Web UI npm dependencies (web/package-lock.json).
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The types track the Node runtime the images ship (NodeSource 24, docker/aura/Dockerfile);
      # a major here would type APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      vitest-toolchain:
        patterns:
          - vitest
          - "@vitest/*"
      stryker-toolchain:
        patterns:
          - "@stryker-mutator/*"
      typescript-lint:
        patterns:
          - typescript
          - oxlint-tsgolint
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI / CodeQL / release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # Third-party images in compose.yaml. Only aura-stt's GHCR copy for now: the mirror workflow
  # publishes a dated tag for each new hwdsl2/whisper-server:latest, and this proposes it. The
  # other images are pinned by hand (llama.cpp must move in four files at once).
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build(deps)"
    allow:
      - dependency-name: "chetto1983/aura-whisper-server"

  # Dockerfile base images. A digest-pinned FROM gets its digest refreshed when the tag moves,
  # before Docker Hub can collect the superseded manifest. dxflrs/garage is left out: the aura
  # image and compose.yaml must move it together (cmd/aura/container_artifacts_test.go).
  - package-ecosystem: docker
    directories:
      - "/docker/aura"
      - "/docker/aura-sandbox"
      - "/docker/aura-egress"
      - "/docker/aura-ingest"
      - "/docker/arcadedb-mcp"
      - "/docker/caddy"
      - "/docker/cloudflared"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "dxflrs/garage"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-base-images:
        patterns: ["*"]
