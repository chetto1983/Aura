version: 2
updates:
  # Go module dependencies.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # One PR per week for the low-risk bumps; majors stay individual.
      go-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions used by the CI / CodeQL / release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(ci)"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
