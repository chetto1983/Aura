# CI-only CPU posture and cache mounts. Keep runtime state volumes (Postgres /
# Neo4j / Aura data) out of this file: only immutable downloads/plugins are safe
# to persist between GitHub-hosted runners.
services:
  neo4j:
    volumes:
      - aura-neo4j:/data
      - ${AURA_CI_NEO4J_PLUGINS_DIR:?AURA_CI_NEO4J_PLUGINS_DIR required in CI}:/plugins

  aura-llama-embed:
    # compose.yaml deliberately reserves NVIDIA on the local GPU workstation.
    # Hosted runners have no NVIDIA runtime, so CI must select the CPU image and
    # remove the structural device reservation, just like compose.minipc.yaml.
    image: ${AURA_EMBED_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    deploy: !reset null
    volumes:
      - ${AURA_CI_LLAMA_CACHE_DIR:?AURA_CI_LLAMA_CACHE_DIR required in CI}/llama.cpp:/root/.cache/llama.cpp
      - ${AURA_CI_LLAMA_CACHE_DIR:?AURA_CI_LLAMA_CACHE_DIR required in CI}/huggingface:/root/.cache/huggingface

  aura-agent-memory-mcp:
    image: aura-agent-memory-mcp:local
    pull_policy: never
