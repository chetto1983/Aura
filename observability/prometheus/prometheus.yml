global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    stack: aura

rule_files:
  - /etc/prometheus/rules/aura-recording.yml
  - /etc/prometheus/rules/aura-alerts.yml

scrape_configs:
  - job_name: aura
    metrics_path: /metrics
    static_configs:
      - targets: [127.0.0.1:9464]

  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

