services:
  aura-secrets:
    image: alpine:3.21
    restart: "no"
    command: ["/bin/sh", "/scripts/init-secrets.sh"]
    volumes:
      - ./docker/secrets:/scripts:ro
      - ./data/secrets:/secrets

  aura:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura:local
    restart: unless-stopped
    env_file:
      - path: ./data/secrets/aura.env
        required: false
    environment:
      AURA_HEADLESS: "true"
      AURA_TIMEZONE: "${AURA_TIMEZONE:-Europe/Rome}"
      AURA_ENV_PATH: "/data/.env"
      HTTP_PORT: "0.0.0.0:8080"
      DB_PATH: "/data/aura.db"
      AURA_SQLITE_JOURNAL_MODE: "DELETE"
      LOG_DIR: "/data/logs"
      HOME: "/data"
      NPM_CONFIG_CACHE: "/data/.npm"
      WIKI_PATH: "/wiki"
      SKILLS_PATH: "/skills"
      SKILLS_INSTALL_PROJECT_DIR: "/skills"
      MCP_SERVERS_PATH: "/data/mcp.json"
      AURA_RUNTIME_WORKSPACE_PATH: "/workspace"
      PROMPT_OVERLAY_PATH: "/workspace"
      SANDBOX_ENABLED: "true"
      SANDBOX_RUNTIME_MODE: "container"
      SANDBOX_RUNTIME_URL: "http://pyodide:8787"
      WEB_SEARCH_PROVIDER: "searxng"
      SEARXNG_BASE_URL: "http://searxng:8080"
      GARAGE_S3_ENDPOINT: "http://garage:3900"
      GARAGE_S3_REGION: "garage"
      GARAGE_S3_BUCKET: "aura-artifacts"
      GARAGE_S3_ACCESS_KEY_FILE: "/data/secrets/garage_s3_access_key"
      GARAGE_S3_SECRET_KEY_FILE: "/data/secrets/garage_s3_secret_key"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "aura_memory_v1"
      QDRANT_API_KEY: ""
      SEARCH_BACKEND: "qdrant"
      AURA_PROMPT_VERSION: "aura-agent-v1"
      AURA_TOOL_PROFILE_MODE: "auto"
      AURA_SKILL_PREFLIGHT: "off"
      AURA_SKILL_ROUTING_MODE: "manifest"
      AURA_AGENT_LOOP_MAX_STEPS: "8"
      AURA_TERMINAL_TOOL_POLICY: "profile"
      AURA_DELEGATION_MODE: "fast"
      AURA_TRACE_RETENTION_DAYS: "30"
      AURA_WORKSPACE_TOOLS: "${AURA_WORKSPACE_TOOLS:-enabled}"
      AURA_WORKSPACE_ROOT: "/workspace"
      SUMMARIZER_MODE: "auto_low_risk"
      SUMMARIZER_TURN_INTERVAL: "2"
      SUMMARIZER_COOLDOWN_SECONDS: "0"
    ports:
      - "127.0.0.1:${AURA_HOST_PORT:-18080}:8080"
    volumes:
      - ./data:/data
      - .:/app
      - ./wiki:/wiki
      - ./skills:/skills
    depends_on:
      aura-secrets:
        condition: service_completed_successfully
      searxng:
        condition: service_started
      garage:
        condition: service_started
      qdrant:
        condition: service_started
      pyodide:
        condition: service_healthy

  pyodide:
    build:
      context: ./runtime/pyodide
      dockerfile: ../../docker/pyodide/Dockerfile
    image: aura-pyodide:local
    restart: unless-stopped
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
    expose:
      - "8787"

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./data/secrets/searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    depends_on:
      aura-secrets:
        condition: service_completed_successfully

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    env_file:
      - path: ./data/secrets/garage-default.env
        required: false
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./data/secrets/garage.toml:/etc/garage.toml:ro
      - ./garage:/var/lib/garage
    depends_on:
      aura-secrets:
        condition: service_completed_successfully

  garage-webui:
    image: khairul169/garage-webui:1.1.0
    restart: unless-stopped
    profiles: ["garage-ui"]
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    ports:
      - "127.0.0.1:3909:3909"
    volumes:
      - ./data/secrets/garage.toml:/etc/garage.toml:ro
    depends_on:
      aura-secrets:
        condition: service_completed_successfully
      garage:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["test"]
    working_dir: /src
    command: ["sh", "-c", "go test $(go list ./... | grep -v '/web/node_modules/') -count=1"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined

volumes:
  searxng-cache:
  qdrant-storage:
  go-mod-cache:
  go-build-cache:
