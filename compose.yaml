services:
  aura:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura:local
    restart: unless-stopped
    environment:
      AURA_HEADLESS: "true"
      AURA_ENV_PATH: "/data/.env"
      HTTP_PORT: "0.0.0.0:8080"
      DB_PATH: "/data/aura.db"
      LOG_DIR: "/data/logs"
      HOME: "/data"
      NPM_CONFIG_CACHE: "/data/.npm"
      WIKI_PATH: "/wiki"
      SKILLS_PATH: "/skills"
      SKILLS_INSTALL_PROJECT_DIR: "/skills"
      MCP_SERVERS_PATH: "/data/mcp.json"
      PROMPT_OVERLAY_PATH: "/data"
      SANDBOX_ENABLED: "true"
      SANDBOX_RUNTIME_MODE: "container"
      SANDBOX_RUNTIME_URL: "http://pyodide:8787"
      WEB_SEARCH_PROVIDER: "searxng"
      SEARXNG_BASE_URL: "http://searxng:8080"
      GARAGE_S3_ENDPOINT: "http://garage:3900"
      GARAGE_S3_REGION: "garage"
      GARAGE_S3_BUCKET: "aura-artifacts"
      GARAGE_S3_ACCESS_KEY: "aura-local-access"
      GARAGE_S3_SECRET_KEY: "aura-local-secret-change-me"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "aura_memory_v1"
      QDRANT_API_KEY: ""
      SEARCH_BACKEND: "chromem"
    ports:
      - "127.0.0.1:${AURA_HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - ./wiki:/wiki
      - ./skills:/skills
    depends_on:
      searxng:
        condition: service_started
      garage:
        condition: service_started
      qdrant:
        condition: service_started
      pyodide:
        condition: service_healthy

  pyodide:
    build:
      context: ./runtime/pyodide
      dockerfile: ../../docker/pyodide/Dockerfile
    image: aura-pyodide:local
    restart: unless-stopped
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
    expose:
      - "8787"

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "aura-local-access"
      GARAGE_DEFAULT_SECRET_KEY: "aura-local-secret-change-me"
      GARAGE_DEFAULT_BUCKET: "aura-artifacts"
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - ./garage:/var/lib/garage

  garage-webui:
    image: khairul169/garage-webui:1.1.0
    restart: unless-stopped
    profiles: ["garage-ui"]
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    ports:
      - "127.0.0.1:3909:3909"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
    depends_on:
      garage:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["test"]
    working_dir: /src
    command: ["sh", "-c", "go test $(go list ./... | grep -v '/web/node_modules/') -count=1"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined

volumes:
  searxng-cache:
  qdrant-storage:
  go-mod-cache:
  go-build-cache:
