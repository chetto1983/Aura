services:
  aura:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura:local
    restart: unless-stopped
    environment:
      AURA_HEADLESS: "true"
      AURA_ENV_PATH: "/data/.env"
      HTTP_PORT: "0.0.0.0:8080"
      DB_PATH: "/data/aura.db"
      LOG_DIR: "/data/logs"
      WIKI_PATH: "/wiki"
      SKILLS_PATH: "/skills"
      MCP_SERVERS_PATH: "/data/mcp.json"
      PROMPT_OVERLAY_PATH: "/data"
      SANDBOX_ENABLED: "false"
      WEB_SEARCH_PROVIDER: "searxng"
      SEARXNG_BASE_URL: "http://searxng:8080"
      GARAGE_S3_ENDPOINT: "http://garage:3900"
      GARAGE_S3_REGION: "garage"
      GARAGE_S3_BUCKET: "aura-artifacts"
      GARAGE_S3_ACCESS_KEY: "aura-local-access"
      GARAGE_S3_SECRET_KEY: "aura-local-secret-change-me"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./wiki:/wiki
      - ./skills:/skills
    depends_on:
      searxng:
        condition: service_started
      garage:
        condition: service_started

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: "aura-local-access"
      GARAGE_DEFAULT_SECRET_KEY: "aura-local-secret-change-me"
      GARAGE_DEFAULT_BUCKET: "aura-artifacts"
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - ./garage:/var/lib/garage

  garage-webui:
    image: khairul169/garage-webui:1.1.0
    restart: unless-stopped
    profiles: ["garage-ui"]
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    ports:
      - "127.0.0.1:3909:3909"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
    depends_on:
      garage:
        condition: service_started

volumes:
  searxng-cache:
