# Source: Docker Compose v5 + Postgres 17 docker hub + Neo4j 5.26 community docker
# docs + llama.cpp server docs (verified 2026-05-29).
# Aura Slice 0.5 lands postgres; Slice 0.7 appends neo4j + aura-llama-embed.
# Repo-root location per D-02 (NOT sandbox/compose.yaml; vestigial path superseded).
# All knobs come from .env (POSTGRES_*, NEO4J_*, AURA_EMBED_*); fail-fast if a
# required password is missing. All ports loopback-only (T-1.07-02/03).
name: aura

services:
  postgres:
    image: postgres:17.10-alpine3.23
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aura}
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aura-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ↓↓ Slice 0.7 — Neo4j Community + APOC + GDS ↓↓
  neo4j:
    image: neo4j:5.26.26-community
    container_name: aura-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD required in .env}
      # Healthcheck-only mirror: cypher-shell in the healthcheck needs the password
      # at runtime. NEO4J_AUTH is consumed by the entrypoint and not left in the
      # shell env, so expose the secret under a non-NEO4J_ name (Neo4j maps every
      # NEO4J_* var to a config key — this avoids an "unrecognized setting" warning).
      AURA_NEO4J_HC_PW: ${NEO4J_PASSWORD:?NEO4J_PASSWORD required in .env}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*,gds.*'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - aura-neo4j:/data
      - aura-neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$AURA_NEO4J_HC_PW\" --database neo4j 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s   # APOC + GDS auto-download takes time on first boot

  # ↓↓ Slice 0.7 — embeddinggemma-300m OpenAI-compat sidecar ↓↓
  aura-llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: aura-llama-embed
    restart: unless-stopped
    command:
      - --hf-repo
      - ggml-org/embeddinggemma-300M-GGUF
      - --hf-file
      - embeddinggemma-300M-Q8_0.gguf
      - --embeddings
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - -t
      - "4"                                    # mini-PC CPU budget cap (feedback_minipc_cpu_budget)
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - aura-llama-embed:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s                        # first-boot HF model download

  # Local sandbox-agent container. Aura talks to this over 127.0.0.1 only via
  # AURA_SANDBOX_AGENT_URL; the sandbox itself sits on a non-masquerading Docker
  # bridge so process code has no public internet egress. No Docker socket is mounted.
  # Built from rivetdev/sandbox-agent + python3 (docker/sandbox-agent/Dockerfile):
  # the base "-full" tag ships node but not python3, so sandbox_exec can use the
  # preloaded local aura-sandbox-agent:py3 image without an online pull.
  aura-sandbox-agent:
    build:
      context: ./docker/sandbox-agent
    image: aura-sandbox-agent:py3
    pull_policy: never
    container_name: aura-sandbox-agent
    restart: unless-stopped
    # Full-terminal home (amendment #50 / D-15c): the loopback exec endpoint runs
    # unauthenticated (--no-token). For a single trusted operator on their own box the
    # bearer was security theater; the real per-identity gate is capability_grants (1.7).
    command: ["server", "--no-token", "--no-telemetry", "--host", "0.0.0.0", "--port", "2468"]
    working_dir: /workspace
    ports:
      - "127.0.0.1:${AURA_SANDBOX_AGENT_PORT:-2468}:2468"
    volumes:
      - aura-sandbox-agent:/workspace
      # /skills bind mount, read-write (amendment #50 / D-15c inverts spike 005's ro):
      # the writer materializes ACTIVE snippet skills into AURA_SKILL_EXPORT_DIR and the
      # full-terminal home sees them at /skills, execed BY PATH (python3 /skills/<name>.py).
      - ${AURA_SKILL_EXPORT_DIR:-~/.aura/skills/export}:/skills
    networks:
      - aura-sandbox-local
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2468/v1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Local SearXNG backend. Aura talks to this over 127.0.0.1 only via
  # SEARXNG_URL. Unlike the code sandbox, SearXNG needs outbound egress to query
  # upstream engines; loopback publishing keeps the service local without cutting
  # off metasearch.
  searxng:
    image: searxng/searxng:2026.5.31-7159b8aed
    container_name: aura-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AURA_SEARXNG_PORT:-18080}:8080"
    volumes:
      # Read-only so a compromised container cannot rewrite its own config (D-04,
      # T-07-02). The entrypoint leaves an existing target untouched (it only
      # generates one when absent), so the checked-in file stays authoritative.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - aura-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  aura-postgres:
  aura-neo4j:
  aura-neo4j-plugins:
  aura-llama-embed:
  aura-sandbox-agent:

networks:
  aura-sandbox-local:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # Local SearXNG bridge: host-loopback published; default Docker NAT egress
  # remains enabled so metasearch can reach upstream engines.
  aura-web:
    driver: bridge
