services:
  aura-secrets:
    image: alpine:3.21
    restart: "no"
    command: ["/bin/sh", "/scripts/init-secrets.sh"]
    volumes:
      - ./docker/secrets:/scripts:ro
      - ./data/secrets:/secrets
      - ./data:/data
      - ./runtime-workspace:/workspace
      - aura-wiki:/workspace/wiki
      - aura-skills:/workspace/skills

  # aura-init-models — one-shot init container. Fetches large model artifacts
  # (embedding GGUFs today, OCR weights in Wave 2.9.5) before sidecars that
  # need them start. See docs/wave-2.10-install-bootstrap.md.
  #
  # Cache-hit (file present + SHA-256 matches) exits in ~1 s.
  # Fresh download of embeddinggemma-300m-Q4_0.gguf is 265 MB; ~30-60 s on a
  # typical residential link. Compose dependency keeps aura-llama-embed from
  # starting until this container exits 0.
  aura-init-models:
    build:
      context: .
      dockerfile: docker/init-models/Dockerfile
    image: aura-init-models:local
    restart: "no"
    environment:
      AURA_MODELS_DIR: "/models"
      # Operators with a private mirror or alternate quantization can override
      # these without rebuilding. SHA256 MUST be re-pinned alongside the URL.
      AURA_EMBEDDING_MODEL_URL: "${AURA_EMBEDDING_MODEL_URL:-}"
      AURA_EMBEDDING_MODEL_SHA256: "${AURA_EMBEDDING_MODEL_SHA256:-}"
      AURA_WHISPER_MODEL_URL: "${AURA_WHISPER_MODEL_URL:-}"
      AURA_WHISPER_MODEL_SHA256: "${AURA_WHISPER_MODEL_SHA256:-}"
      AURA_PIPER_VOICE_URL: "${AURA_PIPER_VOICE_URL:-}"
      AURA_PIPER_VOICE_SHA256: "${AURA_PIPER_VOICE_SHA256:-}"
      AURA_PIPER_VOICE_CFG_URL: "${AURA_PIPER_VOICE_CFG_URL:-}"
      AURA_PIPER_VOICE_CFG_SHA256: "${AURA_PIPER_VOICE_CFG_SHA256:-}"
    volumes:
      - ./data:/models   # shared with aura-llama-embed (rw here, ro there)

  aura:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura:local
    restart: unless-stopped
    environment:
      AURA_HEADLESS: "true"
      AURA_TIMEZONE: "${AURA_TIMEZONE:-Europe/Rome}"
      HTTP_PORT: "0.0.0.0:8080"
      DB_PATH: "/data/aura.db"
      AURA_SQLITE_JOURNAL_MODE: "DELETE"
      LOG_DIR: "/data/logs"
      HOME: "/data"
      NPM_CONFIG_CACHE: "/data/.npm"
      WIKI_PATH: "/workspace/wiki"
      SKILLS_PATH: "/workspace/skills"
      SKILLS_INSTALL_PROJECT_DIR: "/workspace/skills"
      MCP_SERVERS_PATH: "/workspace/mcp.json"
      AURA_RUNTIME_WORKSPACE_PATH: "/workspace"
      PROMPT_OVERLAY_PATH: "/workspace"
      SANDBOX_ENABLED: "true"
      WEB_SEARCH_PROVIDER: "searxng"
      SEARXNG_BASE_URL: "http://searxng:8080"
      GARAGE_S3_ENDPOINT: "http://garage:3900"
      GARAGE_S3_REGION: "garage"
      GARAGE_S3_BUCKET: "aura-artifacts"
      GARAGE_S3_ACCESS_KEY_FILE: "/data/secrets/garage_s3_access_key"
      GARAGE_S3_SECRET_KEY_FILE: "/data/secrets/garage_s3_secret_key"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "aura_memory_v1"
      QDRANT_API_KEY: ""
      EMBEDDING_BASE_URL: "http://aura-llama-embed:8080/v1"
      EMBEDDING_MODEL: "embeddinggemma"
      EMBEDDING_API_KEY: "no-key"
      EMBEDDING_OUTPUT_DIM: "256"
      MARKITDOWN_URL: "http://aura-markitdown:3001"
      MARKITDOWN_TIMEOUT_SEC: "120"
      WHISPER_BASE_URL: "http://aura-whisper:8082"
      TOOL_SEARCH_BACKEND: "${TOOL_SEARCH_BACKEND:-hybrid}"
      AURA_PROMPT_VERSION: "aura-agent-v1"
      AURA_SKILL_ROUTING_MODE: "manifest"
      AURA_AGENT_LOOP_MAX_STEPS: "50"
      AURA_TERMINAL_TOOL_POLICY: "on"
      AURA_DELEGATION_MODE: "fast"
      AURA_TRACE_RETENTION_DAYS: "30"
      AURA_WORKSPACE_TOOLS: "${AURA_WORKSPACE_TOOLS:-enabled}"
      AURA_WORKSPACE_ROOT: "/workspace"
      # 5-minute sandbox timeout (was 120s). Lets execute_shell finish deep
      # nmap scans (`-sV --script default` on /24 is ~3-5min) without dying
      # mid-way. The per-call LLM-requested timeout still caps at 600s in
      # internal/agent/tools/registry/exec.go.
      SANDBOX_TIMEOUT_SEC: "${SANDBOX_TIMEOUT_SEC:-300}"
    ports:
      # Bind to all interfaces so the dashboard is reachable from the LAN
      # (phone, other PCs on the same network). Override via AURA_HOST_BIND
      # in .env to lock back to 127.0.0.1 if needed.
      - "${AURA_HOST_BIND:-0.0.0.0}:${AURA_HOST_PORT:-18080}:8080"
    # NET_RAW + NET_ADMIN enable raw sockets for ICMP/SYN scans and
    # interface-level operations. Without these, nmap as the non-root `aura`
    # user (uid 10001) silently downgrades to TCP connect scans and rejects
    # `-O` (OS fingerprinting). The /usr/bin/nmap binary inherits these via
    # the file capabilities set in Dockerfile (`setcap cap_net_raw,cap_net_admin+eip`).
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./runtime-workspace:/workspace
      - ./data:/data
      - aura-wiki:/workspace/wiki
      - aura-skills:/workspace/skills
    depends_on:
      aura-secrets:
        condition: service_completed_successfully
      searxng:
        condition: service_started
      garage-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      aura-llama-embed:
        condition: service_started
      aura-markitdown:
        condition: service_started

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./data/secrets/searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    depends_on:
      aura-secrets:
        condition: service_completed_successfully

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    # `--default-bucket` was removed alongside the env_file in 913bb787 — it
    # only fires when GARAGE_DEFAULT_* env vars are present, which they no
    # longer are. The garage-init sidecar below provisions the key and bucket
    # explicitly via the CLI, so the daemon stays a vanilla single-node setup.
    command: /garage server --single-node
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./data/secrets/garage.toml:/etc/garage.toml:ro
      - ./garage:/var/lib/garage
    depends_on:
      aura-secrets:
        condition: service_completed_successfully

  # garage-init — one-shot sidecar that registers the S3 access key generated
  # by aura-secrets with the running garage daemon and grants it owner rights
  # on the aura-artifacts bucket. Idempotent: every step is guarded by an
  # `info` probe so re-runs after restarts are no-ops. See
  # docker/garage-init/Dockerfile.
  garage-init:
    build:
      context: ./docker/garage-init
      dockerfile: Dockerfile
    image: aura-garage-init:local
    restart: "no"
    volumes:
      - ./docker/garage-init:/scripts:ro
      - ./data/secrets:/secrets:ro
      - ./data/secrets/garage.toml:/etc/garage.toml:ro
      # garage CLI reads metadata_dir/node_key to identify itself on the
      # local single-node cluster. Read-only mount of the same state dir the
      # daemon owns is the documented pattern for CLI co-location.
      - ./garage:/var/lib/garage:ro
    depends_on:
      aura-secrets:
        condition: service_completed_successfully
      garage:
        condition: service_started

  garage-webui:
    image: khairul169/garage-webui:1.1.0
    restart: unless-stopped
    profiles: ["garage-ui"]
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    ports:
      - "127.0.0.1:3909:3909"
    volumes:
      - ./data/secrets/garage.toml:/etc/garage.toml:ro
    depends_on:
      aura-secrets:
        condition: service_completed_successfully
      garage:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

  # Local embedding server. Serves data/embeddinggemma-300m-Q4_0.gguf via
  # llama.cpp's OpenAI-compatible /v1/embeddings endpoint. Inside the docker
  # network: http://aura-llama-embed:8080/v1. Aura's EMBEDDING_BASE_URL
  # points here by default — this IS the embedding backend, no fallback.
  #
  # Image tag is parametrized via LLAMA_EMBED_IMAGE_TAG. Default is CPU
  # (server). For Aura's workload (single-query embeddings from chat +
  # small batch reindex) the GPU is the WRONG tool — see commit and the
  # memory note feedback_minipc_cpu_budget. On 2026-05-12 a CUDA probe
  # on this exact box (RTX A2000 Laptop GPU) measured 2000ms/query vs
  # 32ms on CPU because the per-request CPU↔GPU sync overhead dominates
  # the trivial compute. GPU is only worth it for sustained batch
  # throughput which Aura does not have.
  #
  # End-users / power users who actually have batch throughput can set
  # LLAMA_EMBED_IMAGE_TAG=server-cuda in .env to opt in; the deploy
  # resources block below is no-op for the CPU image and only kicks in
  # when an NVIDIA runtime is requested.
  aura-llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:${LLAMA_EMBED_IMAGE_TAG:-server}
    restart: unless-stopped
    command: >-
      -m /models/embeddinggemma-300m-Q4_0.gguf
      --embeddings --pooling mean
      --ctx-size 2048 --batch-size 2048 --ubatch-size 2048
      --threads 4 --parallel 2
      --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:${LLAMA_EMBED_HOST_PORT:-8081}:8080"
    volumes:
      - ./data:/models:ro
    depends_on:
      # Block startup until the model file is on disk + SHA-256 verified.
      # Wave 2.10 — eliminates the cold-start crash loop on a fresh install.
      aura-init-models:
        condition: service_completed_successfully

  # markitdown-mcp sidecar — replaces Aura's hand-rolled extractor zoo
  # (ExtractGo for text/md/json/csv + Python sandbox for xlsx/docx) with
  # Microsoft's markitdown via JSON-RPC 2.0 over Streamable HTTP.
  #
  # Wave 2.9 wire: Aura's internal/markitdown client POSTs convert_to_markdown
  # calls to /mcp with the source bytes encoded as a data:<mime>;base64,<...>
  # URI. The URL converter is reachable from inside the container but never
  # invoked directly by Aura — web_fetch always pulls bytes first so the SSRF
  # gate stays at Aura's boundary.
  #
  # Image and audio converters are intentionally left untouched here. Wave
  # 2.9 rejects KindImage uploads at the source layer; Wave 2.9.5 will wire
  # an OCRBackend selector that the markitdown image converter can call.
  aura-markitdown:
    build:
      context: ./docker/markitdown
      dockerfile: Dockerfile
    image: aura-markitdown:local
    restart: unless-stopped
    # ENTRYPOINT in docker/markitdown/Dockerfile is already "markitdown-mcp";
    # `command` only supplies args, not the binary.
    command: ["--http", "--host", "0.0.0.0", "--port", "3001"]
    environment:
      # Plugins disabled by default — only the converters in the upstream
      # markitdown core run. Re-enable via dashboard if a user installs a
      # custom plugin under ./docker/markitdown/plugins/.
      MARKITDOWN_ENABLE_PLUGINS: "False"
    ports:
      - "127.0.0.1:${MARKITDOWN_HOST_PORT:-3001}:3001"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # aura-whisper sidecar — long-lived whisper.cpp HTTP server for audio
  # transcription. Loads ggml-small.bin once at startup to amortize the
  # ~670 ms model-load cost (spike-measured 2026-05-19). Serves whisper-server's
  # native POST /inference (multipart audio_file) endpoint.
  #
  # Wave 2 Go client (US-MM-A02) speaks to WHISPER_BASE_URL set below.
  # aura does NOT depend_on aura-whisper — sidecar failure does not block boot
  # (graceful degradation, same pattern as qdrant).
  #
  # Model file (ggml-small.bin, 466 MB) is placed by aura-init-models into
  # ./data/ before this service starts.
  aura-whisper:
    build:
      context: ./docker/whisper
      dockerfile: Dockerfile
    image: aura-whisper:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data:/models:ro
    depends_on:
      aura-init-models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["test"]
    working_dir: /src
    command: ["sh", "-c", "go test $(go list ./... | grep -v '/web/node_modules/') -count=1"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined

volumes:
  searxng-cache:
  aura-wiki:
  aura-skills:
  qdrant-storage:
  go-mod-cache:
  go-build-cache:
