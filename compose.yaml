services:
  aura-secrets:
    image: alpine:3.21
    restart: "no"
    command: ["/bin/sh", "/scripts/init-secrets.sh"]
    volumes:
      - ./docker/secrets:/scripts:ro
      - ./data/secrets:/secrets
      - ./data:/data
      - ./runtime-workspace:/workspace
      - aura-wiki:/workspace/wiki
      - aura-skills:/workspace/skills

  aura:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura:local
    restart: unless-stopped
    env_file:
      - path: ./data/secrets/aura.env
        required: false
    environment:
      AURA_HEADLESS: "true"
      AURA_TIMEZONE: "${AURA_TIMEZONE:-Europe/Rome}"
      AURA_ENV_PATH: "/data/.env"
      HTTP_PORT: "0.0.0.0:8080"
      DB_PATH: "/data/aura.db"
      AURA_SQLITE_JOURNAL_MODE: "DELETE"
      LOG_DIR: "/data/logs"
      HOME: "/data"
      NPM_CONFIG_CACHE: "/data/.npm"
      WIKI_PATH: "/workspace/wiki"
      SKILLS_PATH: "/workspace/skills"
      SKILLS_INSTALL_PROJECT_DIR: "/workspace/skills"
      MCP_SERVERS_PATH: "/workspace/mcp.json"
      AURA_RUNTIME_WORKSPACE_PATH: "/workspace"
      PROMPT_OVERLAY_PATH: "/workspace"
      SANDBOX_ENABLED: "true"
      WEB_SEARCH_PROVIDER: "searxng"
      SEARXNG_BASE_URL: "http://searxng:8080"
      GARAGE_S3_ENDPOINT: "http://garage:3900"
      GARAGE_S3_REGION: "garage"
      GARAGE_S3_BUCKET: "aura-artifacts"
      GARAGE_S3_ACCESS_KEY_FILE: "/data/secrets/garage_s3_access_key"
      GARAGE_S3_SECRET_KEY_FILE: "/data/secrets/garage_s3_secret_key"
      QDRANT_URL: "http://qdrant:6333"
      QDRANT_COLLECTION: "aura_memory_v1"
      QDRANT_API_KEY: ""
      EMBEDDING_BASE_URL: "http://aura-llama-embed:8080/v1"
      EMBEDDING_MODEL: "embeddinggemma"
      EMBEDDING_API_KEY: "no-key"
      EMBEDDING_OUTPUT_DIM: "256"
      TOOL_SEARCH_BACKEND: "${TOOL_SEARCH_BACKEND:-hybrid}"
      AURA_PROMPT_VERSION: "aura-agent-v1"
      AURA_SKILL_ROUTING_MODE: "manifest"
      AURA_AGENT_LOOP_MAX_STEPS: "8"
      AURA_TERMINAL_TOOL_POLICY: "on"
      AURA_DELEGATION_MODE: "fast"
      AURA_TRACE_RETENTION_DAYS: "30"
      AURA_WORKSPACE_TOOLS: "${AURA_WORKSPACE_TOOLS:-enabled}"
      AURA_WORKSPACE_ROOT: "/workspace"
    ports:
      - "127.0.0.1:${AURA_HOST_PORT:-18080}:8080"
    volumes:
      - ./runtime-workspace:/workspace
      - ./data:/data
      - aura-wiki:/workspace/wiki
      - aura-skills:/workspace/skills
    depends_on:
      aura-secrets:
        condition: service_completed_successfully
      searxng:
        condition: service_started
      garage:
        condition: service_started
      qdrant:
        condition: service_started
      aura-llama-embed:
        condition: service_started

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./data/secrets/searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    depends_on:
      aura-secrets:
        condition: service_completed_successfully

  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    command: /garage server --single-node --default-bucket
    env_file:
      - path: ./data/secrets/garage-default.env
        required: false
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./data/secrets/garage.toml:/etc/garage.toml:ro
      - ./garage:/var/lib/garage
    depends_on:
      aura-secrets:
        condition: service_completed_successfully

  garage-webui:
    image: khairul169/garage-webui:1.1.0
    restart: unless-stopped
    profiles: ["garage-ui"]
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    ports:
      - "127.0.0.1:3909:3909"
    volumes:
      - ./data/secrets/garage.toml:/etc/garage.toml:ro
    depends_on:
      aura-secrets:
        condition: service_completed_successfully
      garage:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

  # Local embedding server. Serves data/embeddinggemma-300m-Q4_0.gguf via
  # llama.cpp's OpenAI-compatible /v1/embeddings endpoint. Inside the docker
  # network: http://aura-llama-embed:8080/v1. Aura's EMBEDDING_BASE_URL
  # points here by default — this IS the embedding backend, no fallback.
  # 2026-05-12 probe: 32ms median single-query latency on CPU mini-PC,
  # 768-dim native output, MRL-truncated to 256d client-side
  # (EMBEDDING_OUTPUT_DIM=256). Host port 8081 exposed for debug.
  aura-llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: >-
      -m /models/embeddinggemma-300m-Q4_0.gguf
      --embeddings --pooling mean
      --ctx-size 2048 --batch-size 2048 --ubatch-size 2048
      --threads 2 --threads-batch 4 --parallel 2
      --mlock --no-warmup
      --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:${LLAMA_EMBED_HOST_PORT:-8081}:8080"
    volumes:
      - ./data:/models:ro

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["test"]
    working_dir: /src
    command: ["sh", "-c", "go test $(go list ./... | grep -v '/web/node_modules/') -count=1"]
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined

volumes:
  searxng-cache:
  aura-wiki:
  aura-skills:
  qdrant-storage:
  go-mod-cache:
  go-build-cache:
