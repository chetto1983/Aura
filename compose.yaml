# Source: Docker Compose v5 + Postgres 17 docker hub + Neo4j 5.26 community docker
# docs + llama.cpp server docs (verified 2026-05-29).
# Aura Slice 0.5 lands postgres; Slice 0.7 appends neo4j + aura-llama-embed.
# Repo-root location per D-02 (NOT sandbox/compose.yaml; vestigial path superseded).
# All knobs come from .env (POSTGRES_*, NEO4J_*, AURA_EMBED_*); fail-fast if a
# required password is missing. All ports loopback-only (T-1.07-02/03).
name: aura

services:
  postgres:
    image: postgres:17.10-alpine3.23
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aura}
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aura-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ↓↓ Slice 0.7 — Neo4j Community + APOC + GDS ↓↓
  neo4j:
    image: neo4j:5.26.26-community
    container_name: aura-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD required in .env}
      # Healthcheck-only mirror: cypher-shell in the healthcheck needs the password
      # at runtime. NEO4J_AUTH is consumed by the entrypoint and not left in the
      # shell env, so expose the secret under a non-NEO4J_ name (Neo4j maps every
      # NEO4J_* var to a config key — this avoids an "unrecognized setting" warning).
      AURA_NEO4J_HC_PW: ${NEO4J_PASSWORD:?NEO4J_PASSWORD required in .env}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*,gds.*'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_dbms_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - aura-neo4j:/data
      - aura-neo4j-plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$AURA_NEO4J_HC_PW\" --database neo4j 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s   # APOC + GDS auto-download takes time on first boot

  # ↓↓ Slice 0.7 — embeddinggemma-300m OpenAI-compat sidecar ↓↓
  aura-llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: aura-llama-embed
    restart: unless-stopped
    command:
      - --hf-repo
      - ggml-org/embeddinggemma-300M-GGUF
      - --hf-file
      - embeddinggemma-300M-Q8_0.gguf
      - --embeddings
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - -t
      - "4"                                    # mini-PC CPU budget cap (feedback_minipc_cpu_budget)
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - aura-llama-embed:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s                        # first-boot HF model download

  # ↓↓ Slice 2a — hardened untrusted-code execution sidecar (CAP-01 SC#5) ↓↓
  # The full hardening floor (D-06/D-14). x86 production/dev adds the gVisor
  # runsc runtime via the compose.gvisor.yaml OVERLAY (D-04, default-on x86
  # through `make sandbox-up`); arm64 omits the overlay and falls back to runc +
  # this seccomp floor (Pitfall 5 — gVisor arm64 is non-GA). The base compose
  # deliberately sets NO runtime override here.
  #
  # NOTE: `userns-remap: default` is a daemon.json setting (D-15), NOT a
  # compose-service field — it maps container uid 0 -> an unprivileged host uid
  # and is asserted against the daemon by the 05-04 bench, not here.
  #
  # NOTE: the sandbox uses a non-masquerading bridge rather than
  # `network_mode: none`: the Go runner needs the loopback-published HTTP API
  # below, while the bridge has no NAT route for user-code egress.
  aura-sandbox:
    build: ./sandbox
    container_name: aura-sandbox
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - aura-sandbox-egressless
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./sandbox/seccomp.json"
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile: 64
    ports:
      - "127.0.0.1:18901:18901"
    healthcheck:
      # connect(2) is denied by seccomp for user-code egress containment, so the
      # container healthcheck validates the sidecar process instead of calling
      # its loopback HTTP endpoint from inside the sandbox.
      test: ["CMD-SHELL", "python3 -c \"import pathlib,sys; sys.exit(0 if b'/app/sidecar.py' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ↓↓ Slice 2b (Phase 8) — SESSION-CONTAINER NETWORK POSTURE (08-08, landmine #3) ↓↓
  # 2b session containers are NOT a compose service — the SessionManager (internal/
  # sandbox/sessions.go, D-04/D-05) starts them per-conversation via `docker run`
  # with the full 2a hardening floor replicated in the argv (Pitfall 6: those flags
  # are NOT inherited). The network posture is allowlist-gated:
  #   * EMPTY AURA_SANDBOX_NETWORK_ALLOW_HOSTS → the 2a egressless posture: the 2a
  #     seccomp profile (sandbox/seccomp.json, connect DENIED) + the default network,
  #     so user-code egress connect(2) dead-ends (identical to aura-sandbox above).
  #   * NON-EMPTY allowlist → the connect-allowing session seccomp variant
  #     (sandbox/seccomp-session.json — ADDS connect ONLY) + the non-masquerading
  #     `aura_aura-sandbox-egressless` bridge below + an HTTP(S)_PROXY env pointing at
  #     the host CONNECT forward proxy (internal/sandbox/network.go, 08-06) reachable
  #     at the BRIDGE GATEWAY IP (NOT container 127.0.0.1). Egress is contained
  #     HOST-SIDE by the proxy's deny-wins glob allowlist + resolve-then-pin, NOT by
  #     connect-denial.
  # This RE-ENABLES connect(2) for the egress case and therefore EXTENDS the
  # AR-05-01 deviation (.planning/phases/05-sandbox-2a-stateless/05-SECURITY.md):
  # the 2a register declared `connect` permanently removed. The live bridge-gateway
  # reachability spike (pip → pypi over the proxy) + the 08-SECURITY re-audit of this
  # extension land in 08-09 — do NOT consider the egress posture closed until then.
  #
  # ↓↓ Slice 5 (Phase 7) — SearXNG meta-search, NO host port (D-02/D-03/D-04) ↓↓
  # The web_search backend. Reached ONLY in-network as http://searxng:8080/search
  # (D-02): the deliberate absence of a `ports:` key (every other service publishes
  # a 127.0.0.1 host port) is the access control — SearXNG is unreachable from the
  # host while still egressing to the public internet via the aura-web bridge (D-03,
  # T-07-01). The image's Granian entrypoint binds :8080 (verified against the
  # pinned tag; the file's default 8888 is overridden by GRANIAN_PORT).
  searxng:
    image: searxng/searxng:2026.5.31-7159b8aed
    container_name: aura-searxng
    restart: unless-stopped
    # NO ports: — internal-only (D-03). Do NOT add a host port mapping.
    volumes:
      # Read-only so a compromised container cannot rewrite its own config (D-04,
      # T-07-02). The entrypoint leaves an existing target untouched (it only
      # generates one when absent), so the checked-in file stays authoritative.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - aura-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  aura-postgres:
  aura-neo4j:
  aura-neo4j-plugins:
  aura-llama-embed:

networks:
  aura-sandbox-egressless:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # Shared app network so SearXNG egresses to the public internet without a host
  # port (D-03). The Aura process joins this network to reach http://searxng:8080.
  aura-web:
    driver: bridge
