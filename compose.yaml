# Source: Docker Compose v5 + Postgres 18 docker hub + ArcadeDB 26.7 docs
# + llama.cpp server docs (verified 2026-06-29).
# Aura Slice 0.5 lands postgres; Slice 0.7 appends the embed sidecar. The graph
# plane is ArcadeDB (arcadedb + arcadedb-mcp), one database per identity.
# Repo-root location per D-02 (NOT sandbox/compose.yaml; vestigial path superseded).
# .env feeds Compose interpolation. Runtime knobs must be forwarded explicitly
# below; container-internal service URLs intentionally use Compose DNS rather
# than host loopback values from .env.
name: aura

services:
  aura:
    build:
      context: .
      dockerfile: docker/aura/Dockerfile
    image: ${AURA_IMAGE:-aura:local}
    pull_policy: never
    container_name: aura
    restart: unless-stopped
    # Tier di isolamento opzionale (PRD amendment #63): AURA_RUNTIME=runsc mette gVisor
    # sotto il container. Era un compose.gvisor.yaml di tre righe piu' un drop-in systemd
    # che riscriveva ExecStart per aggiungere un -f; come variabile e' la stessa cosa senza
    # un file e senza un comando da ricordare. Richiede provisioning dell'host PRIMA
    # (runsc registrato in /etc/docker/daemon.json + reload del daemon), altrimenti il
    # container non parte: e' native-Linux only, su Docker Desktop non esiste.
    runtime: ${AURA_RUNTIME:-runc}
    mem_limit: ${AURA_MEM_LIMIT:-768m}
    cpus: ${AURA_CPUS:-1.0}
    pids_limit: ${AURA_PIDS_LIMIT:-512}
    # Amendment #88: bootstrap the fixed /workspace layout (scripts/artifacts/.toolchain/
    # scratch) and the read-only skills symlink BEFORE the daemon starts, on every boot —
    # mkdir -p and ln -sfn are both idempotent, so this is safe across `docker compose up
    # -d --force-recreate aura` against the already-populated aura-workspace volume.
    entrypoint: ["sh", "-lc", "mkdir -p /workspace/scripts /workspace/artifacts /workspace/.toolchain /workspace/scratch && ln -sfn /var/lib/aura/exported-skills /workspace/skills && exec aura serve"]
    command: []
    depends_on:
      aura-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      aura-llama-embed:
        condition: service_healthy
      # Memory MCP is mounted INTO the agent loop at boot (recipe:memory, default-on) — unlike the
      # connect-only whatsapp/pim sidecars it is a hard runtime dependency, so it must be HEALTHY
      # before Aura starts. Otherwise the boot mount races the sidecar's own startup, fails with
      # "connection refused", and the agent comes up with ZERO memory tools until the next full
      # restart (the in-process mount has no boot-retry; reconnect-on-use only recovers an
      # already-mounted server). Memory is arcadedb-mcp now, not the retired agent-memory sidecar:
      # this gate moved with it, and the healthcheck it waits on was added at the same time.
      arcadedb-mcp:
        condition: service_healthy
      garage-bootstrap:
        condition: service_completed_successfully
      # Start the WhatsApp bridge with the stack (service_started, NOT service_healthy — Aura boot must never block on it; the connect routes fail-soft to 503).
      whatsapp:
        condition: service_started
      # Calendar/PIM sidecar comes up with the stack too (service_started — never block boot; the connect routes fail-soft to 503).
      aura-pim-mcp:
        condition: service_started
    environment:
      AURA_AGUI_BIND: 0.0.0.0:9080
      AURA_SETUP_BIND: 0.0.0.0:9081
      AURA_SETUP_TOKEN: ${AURA_ACCESS_TOKEN:?AURA_ACCESS_TOKEN required in .env}
      # WEB-02 GuardWebBind: the 0.0.0.0:9080 cockpit bind boots only when Authula
      # is configured or a reverse proxy is trusted.
      AURA_WEB_TRUST_PROXY: ${AURA_WEB_TRUST_PROXY:-false}
      AURA_WEB_AUTH_PROVIDER: ${AURA_WEB_AUTH_PROVIDER:-authula}
      AURA_AUTHULA_DATABASE_URL: ${AURA_AUTHULA_DATABASE_URL:-}
      AURA_AUTHULA_SECRET: ${AURA_AUTHULA_SECRET:?AURA_AUTHULA_SECRET required in .env}
      AURA_AUTHULA_RATE_LIMIT_MAX: ${AURA_AUTHULA_RATE_LIMIT_MAX:-30}
      AURA_AUTHULA_OPERATOR_IDENTITY: ${AURA_AUTHULA_OPERATOR_IDENTITY:-}
      AURA_DB_URL: postgres://${AURA_DB_APP_ROLE:-aura_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-aura}?sslmode=disable
      AURA_DB_MIGRATE_URL: postgres://${AURA_DB_MIGRATE_ROLE:-aura_migrate}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-aura}?sslmode=disable
      AURA_DB_BOOTSTRAP_URL: postgres://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-aura}?sslmode=disable
      # The cockpit graph reads the authenticated identity's database directly
      # through ArcadeDB's read-only Studio serializer. It derives the exact same
      # tenant credential as arcadedb-mcp; no root/admin credential enters Aura.
      ARCADEDB_URL: http://arcadedb:2480
      AURA_ARCADEDB_TENANT_SECRET: ${AURA_ARCADEDB_TENANT_SECRET:?AURA_ARCADEDB_TENANT_SECRET required in .env}
      AURA_CONFIG_DIR: /var/lib/aura
      AURA_RUN_DIR: /var/lib/aura/runs
      AURA_SKILLS_DIR: /var/lib/aura/skills
      AURA_SKILL_EXPORT_DIR: /var/lib/aura/exported-skills
      # Amendment #88: the fixed local working root every host-direct tool (shell_exec,
      # fs_*, send_file) and the per-turn runner workspace hint resolve against — same
      # path the strict-profile sandbox box mounts, backed by the aura-workspace volume
      # below (durable across `docker compose up -d --force-recreate aura`).
      AURA_WORKSPACE_DIR: ${AURA_WORKSPACE_DIR:-/workspace}
      AURA_BACKUP_DIR: /backups
      AURA_CONTEXT_PREVIEW_CAP_BYTES: ${AURA_CONTEXT_PREVIEW_CAP_BYTES:-30000}
      AURA_RUN_DIR_SWEEP_INTERVAL_SEC: ${AURA_RUN_DIR_SWEEP_INTERVAL_SEC:-3600}
      AURA_CONVERSATION_TURN_CAP_BYTES: ${AURA_CONVERSATION_TURN_CAP_BYTES:-65536}
      AURA_CONTEXT_TOOL_EVICT_AFTER_TURNS: ${AURA_CONTEXT_TOOL_EVICT_AFTER_TURNS:-10}
      AURA_HISTORY_HARD_CAP_TURNS: ${AURA_HISTORY_HARD_CAP_TURNS:-50}
      AURA_RUN_DIR_WARN_THRESHOLD_BYTES: ${AURA_RUN_DIR_WARN_THRESHOLD_BYTES:-1073741824}
      AURA_EMBED_BASE_URL: http://aura-llama-embed:8081
      AURA_EMBED_DIMENSIONS: ${AURA_EMBED_DIMENSIONS:-768}
      AURA_OTEL_EXPORTER: ${AURA_OTEL_EXPORTER:-none}
      AURA_OTEL_ENDPOINT: ${AURA_OTEL_ENDPOINT:-localhost:4317}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AURA_LLM_BASE_URL: ${AURA_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      AURA_LLM_MODEL: ${AURA_LLM_MODEL:-deepseek/deepseek-v4-flash:nitro}
      AURA_LLM_TEMPERATURE: ${AURA_LLM_TEMPERATURE:-0.7}
      AURA_LLM_MAX_TOKENS: ${AURA_LLM_MAX_TOKENS:-4096}
      AURA_LLM_ADAPTIVE_REASONING: ${AURA_LLM_ADAPTIVE_REASONING:-true}
      AURA_SHOW_REASONING: ${AURA_SHOW_REASONING:-true}
      # Declares this deployment fit to host more than one identity: while it is off the
      # onboarding saga refuses to provision a second one. Default off, because the skills
      # library, aura.settings, the MCP catalog and (under a non-strict AURA_PROFILE) the
      # host filesystem tools are shared deployment-wide (docs/runbooks/musr-rollout.md).
      AURA_MUSR_ISOLATION: ${AURA_MUSR_ISOLATION:-false}
      AURA_LLM_TOTAL_TIMEOUT_SEC: ${AURA_LLM_TOTAL_TIMEOUT_SEC:-120}
      AURA_LLM_CONNECT_TIMEOUT_SEC: ${AURA_LLM_CONNECT_TIMEOUT_SEC:-10}
      AURA_LLM_STREAM_IDLE_TIMEOUT_SEC: ${AURA_LLM_STREAM_IDLE_TIMEOUT_SEC:-60}
      AURA_MODEL_CONTEXT_WINDOW: ${AURA_MODEL_CONTEXT_WINDOW:-1000000}
      AURA_MODEL_MAX_OUTPUT_TOKENS: ${AURA_MODEL_MAX_OUTPUT_TOKENS:-32768}
      AURA_COMPLETION_GATE: ${AURA_COMPLETION_GATE:-true}
      AURA_COMPLETION_CRITIC_MODEL: ${AURA_COMPLETION_CRITIC_MODEL:-}
      SEARXNG_URL: http://searxng:8080/search
      AURA_WEB_DNS_PIN_TTL_SEC: ${AURA_WEB_DNS_PIN_TTL_SEC:-60}
      AURA_WEB_FETCH_MAX_BODY_BYTES: ${AURA_WEB_FETCH_MAX_BODY_BYTES:-5000000}
      AURA_WEB_CACHE_PERSISTENT: ${AURA_WEB_CACHE_PERSISTENT:-false}
      AURA_WEB_SEARCH_TIMEOUT_SEC: ${AURA_WEB_SEARCH_TIMEOUT_SEC:-20}
      AURA_WEB_FETCH_TIMEOUT_SEC: ${AURA_WEB_FETCH_TIMEOUT_SEC:-10}
      # Empty on purpose: the binary's compiled default governs (config.go
      # defaultWebUserAgent). A self-declaring bot UA is refused at the connection
      # layer by manufacturer sites and surfaced in production as a fetch timeout.
      AURA_WEB_USER_AGENT: ${AURA_WEB_USER_AGENT:-}
      AURA_MCP_CONFIG: ${AURA_MCP_CONFIG:-/var/lib/aura/mcp/servers.json}
      AURA_MCP_SERVERS_JSON: ${AURA_MCP_SERVERS_JSON:-}
      # Docker-daemon/host restarts ignore depends_on ordering, so Aura can boot while the
      # memory MCP sidecar is still waiting on its own store's healthcheck. The default
      # 10s mount budget loses that race and the registry freezes with ZERO memory tools until
      # the next aura restart (2026-07-22 incident). 180s budget + 40 attempts (5s backoff cap)
      # rides out the sidecar's cold start; the budget is only spent when a sidecar is down.
      AURA_MCP_MOUNT_TIMEOUT: ${AURA_MCP_MOUNT_TIMEOUT:-180}
      AURA_MCP_MOUNT_RETRY_ATTEMPTS: ${AURA_MCP_MOUNT_RETRY_ATTEMPTS:-40}
      AURA_SWARM_MAX_GOALS: ${AURA_SWARM_MAX_GOALS:-8}
      AURA_SWARM_CHILD_TIMEOUT_SEC: ${AURA_SWARM_CHILD_TIMEOUT_SEC:-120}
      AURA_SWARM_MAX_CONCURRENT: ${AURA_SWARM_MAX_CONCURRENT:-4}
      AURA_AGENT_JOB_MAX_DURATION_SEC: ${AURA_AGENT_JOB_MAX_DURATION_SEC:-600}
      AURA_SCHEDULER_TZ: ${AURA_SCHEDULER_TZ:-Europe/Rome}
      AURA_SCHEDULER_NOTIFY_DEFAULT: ${AURA_SCHEDULER_NOTIFY_DEFAULT:-stdout}
      AURA_SCHEDULER_NOTIFY_RECIPIENT: ${AURA_SCHEDULER_NOTIFY_RECIPIENT:-}
      AURA_SCHEDULER_QUIET_HOURS: ${AURA_SCHEDULER_QUIET_HOURS:-}
      AURA_SCHEDULER_TICK_SECONDS: ${AURA_SCHEDULER_TICK_SECONDS:-30}
      AURA_SCHEDULER_MAX_CONCURRENT_RUNS: ${AURA_SCHEDULER_MAX_CONCURRENT_RUNS:-4}
      AURA_SCHEDULER_NOTIFY_RETRY_ATTEMPTS: ${AURA_SCHEDULER_NOTIFY_RETRY_ATTEMPTS:-3}
      AURA_SCHEDULER_PREFER_ORIGIN_CHANNEL: ${AURA_SCHEDULER_PREFER_ORIGIN_CHANNEL:-true}
      # On-channel scheduled-task approval sweep (fix-plan 1.7 / Amendment #92). REMINDER_SEC<=0
      # hard-disables the backstop; GRACE_SEC delays the sweep's mint so the in-turn model relay
      # wins the fast path (no mint mid-model-turn → no duplicate prompt).
      AURA_SCHEDULER_APPROVAL_REMINDER_SEC: ${AURA_SCHEDULER_APPROVAL_REMINDER_SEC:-3600}
      AURA_SCHEDULER_APPROVAL_GRACE_SEC: ${AURA_SCHEDULER_APPROVAL_GRACE_SEC:-60}
      AURA_SKILL_BODY_CAP_BYTES: ${AURA_SKILL_BODY_CAP_BYTES:-32768}
      AURA_SKILL_MANIFEST_CAP_BYTES: ${AURA_SKILL_MANIFEST_CAP_BYTES:-8192}
      AURA_SKILL_SNIPPET_TTL_DAYS: ${AURA_SKILL_SNIPPET_TTL_DAYS:-90}
      AURA_SKILL_INJECTION_BLOCKLIST: ${AURA_SKILL_INJECTION_BLOCKLIST:-}
      AURA_AGUI_BUFFER_CAP: ${AURA_AGUI_BUFFER_CAP:-64}
      # Fix-plan 1.3 Tier B (PRD Amendment #90): detached-run registry + SSE resume.
      # Default-ON since amendment #90.1 (live E2E 10/10, 2026-07-23); set =false to roll
      # back to the pre-detach wire.
      AURA_AGUI_RUN_DETACH: ${AURA_AGUI_RUN_DETACH:-true}
      AURA_AGUI_RUN_BUFFER_EVENTS: ${AURA_AGUI_RUN_BUFFER_EVENTS:-2048}
      AURA_AGUI_RUN_LINGER_SEC: ${AURA_AGUI_RUN_LINGER_SEC:-180}
      AURA_AGUI_RUN_MAX_WALLCLOCK_SEC: ${AURA_AGUI_RUN_MAX_WALLCLOCK_SEC:-3600}
      AURA_AGUI_RUN_MAX_LIVE: ${AURA_AGUI_RUN_MAX_LIVE:-16}
      # Fix-plan 1.12 (PRD Amendment #91): bounded CoT persistence for display rehydration.
      AURA_REASONING_PERSIST_MAX_RUNES: ${AURA_REASONING_PERSIST_MAX_RUNES:-65536}
      AURA_OBJECTSTORE_BACKEND: ${AURA_OBJECTSTORE_BACKEND:-garage}
      AURA_OBJECTSTORE_ENDPOINT: ${AURA_OBJECTSTORE_ENDPOINT:-http://garage:3900}
      AURA_OBJECTSTORE_PUBLIC_ENDPOINT: ${AURA_OBJECTSTORE_PUBLIC_ENDPOINT:-http://127.0.0.1:3900}
      AURA_OBJECTSTORE_REGION: ${AURA_OBJECTSTORE_REGION:-garage}
      AURA_OBJECTSTORE_BUCKET: ${AURA_OBJECTSTORE_BUCKET:-aura-assets}
      AURA_OBJECTSTORE_ACCESS_KEY: ${AURA_OBJECTSTORE_ACCESS_KEY:?AURA_OBJECTSTORE_ACCESS_KEY required in .env}
      AURA_OBJECTSTORE_SECRET_KEY: ${AURA_OBJECTSTORE_SECRET_KEY:?AURA_OBJECTSTORE_SECRET_KEY required in .env}
      AURA_OBJECTSTORE_PATH_STYLE: ${AURA_OBJECTSTORE_PATH_STYLE:-true}
      # Garage Admin API v2 (Phase 36 D-08): the daemon's provisioning saga reaches the
      # internal-only admin endpoint over the compose network (never the host) with the
      # bearer token. Endpoint targets the in-compose service DNS name garage:3903.
      AURA_GARAGE_ADMIN_ENDPOINT: ${AURA_GARAGE_ADMIN_ENDPOINT:-http://garage:3903}
      AURA_GARAGE_ADMIN_TOKEN: ${AURA_GARAGE_ADMIN_TOKEN:?AURA_GARAGE_ADMIN_TOKEN required in .env}
      # config.gateGarageRPCSecret makes an empty GARAGE_RPC_SECRET a FATAL violation under
      # the strict tiers, and this service never received the variable — only the garage
      # service did. So `AURA_PROFILE=single_user_hardened` put the daemon straight into a
      # restart loop ("inter-node RPC secret must be set under single_user_hardened") on a
      # stack whose .env had the secret all along. Invisible until now for the same reason
      # AURA_PROFILE itself was: under the dev default the gate never runs.
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET required in .env}
      AURA_ASSET_MAX_DOCUMENT_BYTES: ${AURA_ASSET_MAX_DOCUMENT_BYTES:-104857600}
      AURA_ASSET_MAX_IMAGE_BYTES: ${AURA_ASSET_MAX_IMAGE_BYTES:-26214400}
      AURA_ASSET_MAX_AUDIO_BYTES: ${AURA_ASSET_MAX_AUDIO_BYTES:-104857600}
      AURA_ASSET_PRESIGN_TTL_SEC: ${AURA_ASSET_PRESIGN_TTL_SEC:-600}
      AURA_ASSET_PROCESSING_CONCURRENCY: ${AURA_ASSET_PROCESSING_CONCURRENCY:-2}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TELEGRAM_FILE_BASE_URL: ${TELEGRAM_FILE_BASE_URL:-}
      AURA_TELEGRAM_LOCAL_BOT_API: ${AURA_TELEGRAM_LOCAL_BOT_API:-false}
      AURA_SERVE_SHUTDOWN_GRACE_SEC: ${AURA_SERVE_SHUTDOWN_GRACE_SEC:-25}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      AURA_TELEGRAM_STATUS_THROTTLE_MS: ${AURA_TELEGRAM_STATUS_THROTTLE_MS:-1500}
      AURA_TELEGRAM_CONTENT_THROTTLE_MS: ${AURA_TELEGRAM_CONTENT_THROTTLE_MS:-500}
      AURA_TELEGRAM_CHAT_RATE_LIMIT_MS: ${AURA_TELEGRAM_CHAT_RATE_LIMIT_MS:-1000}
      AURA_REASONING_FIFO_RUNES: ${AURA_REASONING_FIFO_RUNES:-4096}
      AURA_VISION_CLOUD: ${AURA_VISION_CLOUD:-false}
      MULTIMODAL_BASE_URL: http://aura-ocr-vl:8082/v1
      MULTIMODAL_MODEL: ${MULTIMODAL_MODEL:-glm-ocr}
      MULTIMODAL_FALLBACK_MODEL: ${MULTIMODAL_FALLBACK_MODEL:-minimax/minimax-m3}
      STT_BASE_URL: http://aura-stt:9000/v1
      STT_MODEL: ${STT_MODEL:-large-v3-turbo}
      STT_LANGUAGE: ${STT_LANGUAGE:-it}
      TTS_BASE_URL: http://aura-tts:8880/v1
      TTS_VOICE: ${TTS_VOICE:-if_sara}
      TTS_FORMAT: ${TTS_FORMAT:-opus}
      MULTIMODAL_TIMEOUT_SEC: ${MULTIMODAL_TIMEOUT_SEC:-120}
      # Calendar/PIM connect proxy: the Go /api/connect/pim/admin/* proxy forwards to the
      # sidecar's token-gated admin API over the docker network, injecting this admin token.
      AURA_PIM_MCP_URL: http://aura-pim-mcp:8080
      AURA_PIM_MCP_ADMIN_TOKEN: ${AURA_PIM_MCP_ADMIN_TOKEN:?AURA_PIM_MCP_ADMIN_TOKEN required in .env}
      AURA_PROFILE_DIR: ${AURA_PROFILE_DIR:-/var/lib/aura/agents}
      AURA_PROFILE_CERTAINTY_N: ${AURA_PROFILE_CERTAINTY_N:-3}
      # ↓↓ Phase 37 (SBX-05, ADR 0037) — per-identity full-capability sandbox ↓↓
      # The daemon spawns one box (aura-box-<identity>) per identity DIRECTLY over the Docker
      # Engine API (moby client, client.FromEnv reads DOCKER_HOST). This is a NO-OP under
      # dev/local_trusted: buildSandboxRouter is Strict()-gated, so under any non-strict profile
      # the router is nil and the Docker client is NEVER constructed — DOCKER_HOST is unused.
      #
      # Docker API access (T-37-08-SOCKET, Open Q5): default EMPTY so the dev stack grants the
      # daemon NO socket. In production the operator brings up the socket-proxy sidecar
      # (`docker compose --profile sandbox up -d`) and points the daemon at it:
      #   AURA_SANDBOX_DOCKER_HOST=tcp://docker-socket-proxy:2375
      # The raw /var/run/docker.sock is mounted into the PROXY ONLY (never into aura, never into a
      # box — SBX-02); the proxy exposes only the container/exec/volume/network/image lifecycle
      # subset. A minimal single-user install MAY instead mount the socket straight into this
      # service — the accepted raw-socket fallback (ADR 0037 Residual A).
      DOCKER_HOST: ${AURA_SANDBOX_DOCKER_HOST:-}
      # Box + egress image refs (D-13). BOTH are LIVE — config.SandboxConfig reads them. AURA_SANDBOX_IMAGE
      # sources the box spec. AURA_SANDBOX_EGRESS_IMAGE sources config.SandboxConfig.EgressImage, which
      # buildSandboxRouter passes to usersandbox.WithEgress (37-10) — so the per-box egress sidecar (the
      # SBX-04 tenancy floor: DROP RFC1918 + 169.254.169.254 metadata + the shared-services bridge) is
      # created on every box under a strict profile. The default aura-egress:latest keeps the floor ON by
      # default (SC#4); operators SHOULD override both with digest-pinned registry refs in production.
      # Fail-CLOSED consequence: a strict host WITHOUT this egress image built/available refuses box
      # creation (ensureImage pull-fail -> Resolve error -> the tool denies) rather than running un-floored.
      AURA_SANDBOX_IMAGE: ${AURA_SANDBOX_IMAGE:-aura-sandbox:latest}
      AURA_SANDBOX_EGRESS_IMAGE: ${AURA_SANDBOX_EGRESS_IMAGE:-aura-egress:latest}
      # The master switch for everything described above, and it was NOT reachable from here:
      # AURA_PROFILE was never forwarded to this service, so a compose deployment ran the
      # `dev` default no matter what the operator put in .env — buildSandboxRouter is
      # Strict()-gated, so the box, the egress floor and the routed file tools were all
      # inert on the appliance while the two image knobs above sat there suggesting otherwise.
      # Kept defaulting to dev so no existing stack changes behaviour on upgrade; a production
      # appliance sets AURA_PROFILE=single_user_hardened in .env — and must have
      # AURA_SANDBOX_IMAGE built/pullable first, because a strict host with no box image
      # fails CLOSED (every routed tool denies) rather than silently running on the host.
      AURA_PROFILE: ${AURA_PROFILE:-dev}
      # The remaining AURA_SANDBOX_* knobs, same reason: config reads them, compose never
      # passed them, so per-box caps and the idle-suspend TTL could not be tuned at all.
      # IDLE_TTL_SEC=0 means NEVER suspend — the single-user posture, where the box stays
      # warm (a warm route is ~22ms against ~350ms for an auto-resume) and there is no
      # co-tenant to reclaim memory from.
      AURA_SANDBOX_IDLE_TTL_SEC: ${AURA_SANDBOX_IDLE_TTL_SEC:-1800}
      AURA_SANDBOX_CPU_LIMIT: ${AURA_SANDBOX_CPU_LIMIT:-2}
      AURA_SANDBOX_MEMORY_LIMIT: ${AURA_SANDBOX_MEMORY_LIMIT:-2147483648}
      AURA_SANDBOX_PIDS_LIMIT: ${AURA_SANDBOX_PIDS_LIMIT:-512}
      AURA_SANDBOX_EGRESS_ALLOWLIST: ${AURA_SANDBOX_EGRESS_ALLOWLIST:-}
    ports:
      - "127.0.0.1:${AURA_AGUI_PORT:-9080}:9080"
      - "127.0.0.1:${AURA_SETUP_PORT:-9081}:9081"
    networks:
      - default
      - aura-web
    volumes:
      - aura-home:/var/lib/aura
      - ${AURA_BACKUP_DIR:-./backups}:/backups
      # Amendment #88: the fixed /workspace working root (AURA_WORKSPACE_DIR), durable
      # across recreates — the entrypoint bootstrap above lays out its subdirs on boot.
      - aura-workspace:/workspace
      # Required by the STRICT profile only (AURA_MUSR_ISOLATION=true +
      # AURA_PROFILE=single_user_hardened). usersandbox.SandboxRouter then routes
      # shell_exec and every fs_* into a per-identity box, and buildSandboxRouter builds
      # that box through the Docker API. With no socket, client.New(FromEnv) has nothing
      # to dial, Route returns routed=true WITH an error, and the tools DENY rather than
      # falling back to the host — the fail-closed containment invariant (D-09/GATE-01)
      # behaving exactly as designed.
      #
      # Measured live 2026-08-03: multi-user was switched on without this line and the
      # agent reported the blocker itself — "shell_exec non può eseguire comandi,
      # dial unix /var/run/docker.sock: no such file or directory" — naming the box it
      # had tried to create, aura-box-<identity-uuid>. Routing worked; the runtime was
      # absent.
      #
      # The privilege is real and deliberate: the daemon socket is host-root-equivalent,
      # so anything that escapes this container owns the host. That is the price of
      # per-identity boxes, and it is why the non-strict single-principal profile — where
      # tools run host-direct in this container — must NOT mount it.
      - /var/run/docker.sock:/var/run/docker.sock
      # Warm package caches for the non-strict host-direct shell_exec path (which runs IN this
      # container, HOME=/root, not in a box): without these, /root/.npm|.cache/pip|.cache/uv live in
      # the ephemeral container layer and are wiped on every recreate, so npm/pip/uv re-download every
      # turn. These retained volumes make re-installs cache hits (no network). Same warm-cache intent
      # as the shared box volumes (translate.go) — kept per-service here since the box path is bypassed
      # under a non-strict profile.
      - aura-npm-cache-host:/root/.npm
      - aura-pip-cache-host:/root/.cache/pip
      - aura-uv-cache-host:/root/.cache/uv
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      # curl's 3s ceiling exceeds Aura's shared 2s readiness budget; Compose's 5s
      # timeout remains the outer bound for process startup and runtime loss checks.
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://127.0.0.1:9080/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  aura-migrate:
    build:
      context: .
      dockerfile: docker/aura/Dockerfile
    image: ${AURA_IMAGE:-aura:local}
    pull_policy: never
    container_name: aura-migrate
    restart: "no"
    # Postgres only: ArcadeDB's schema is idempotent DDL applied at connect, so there
    # is no graph half to migrate and this job depends on nothing but the database.
    entrypoint: ["sh", "-lc", "aura db migrate"]
    command: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AURA_DB_URL: postgres://${AURA_DB_APP_ROLE:-aura_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-aura}?sslmode=disable
      AURA_DB_MIGRATE_URL: postgres://${AURA_DB_MIGRATE_ROLE:-aura_migrate}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-aura}?sslmode=disable
      AURA_DB_BOOTSTRAP_URL: postgres://${POSTGRES_USER:-aura}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-aura}?sslmode=disable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      AURA_CONFIG_DIR: /var/lib/aura
    volumes:
      - aura-home:/var/lib/aura

  garage-bootstrap:
    build:
      context: .
      dockerfile: docker/aura/Dockerfile
    image: ${AURA_IMAGE:-aura:local}
    pull_policy: never
    container_name: aura-garage-bootstrap
    restart: "no"
    entrypoint: ["sh", "-lc", "aura-garage-bootstrap.sh && aura objectstore bootstrap"]
    command: []
    depends_on:
      garage:
        condition: service_started
      # objectstore bootstrap is an idempotent CLI mutation. Wait for the
      # registry migration before reserving its operation key.
      aura-migrate:
        condition: service_completed_successfully
    environment:
      AURA_DB_URL: postgres://${AURA_DB_APP_ROLE:-aura_app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}@postgres:5432/${POSTGRES_DB:-aura}?sslmode=disable
      AURA_OBJECTSTORE_BACKEND: ${AURA_OBJECTSTORE_BACKEND:-garage}
      AURA_OBJECTSTORE_ENDPOINT: ${AURA_OBJECTSTORE_ENDPOINT:-http://garage:3900}
      AURA_OBJECTSTORE_PUBLIC_ENDPOINT: ${AURA_OBJECTSTORE_PUBLIC_ENDPOINT:-http://127.0.0.1:3900}
      AURA_OBJECTSTORE_REGION: ${AURA_OBJECTSTORE_REGION:-garage}
      AURA_OBJECTSTORE_BUCKET: ${AURA_OBJECTSTORE_BUCKET:-aura-assets}
      AURA_OBJECTSTORE_ACCESS_KEY: ${AURA_OBJECTSTORE_ACCESS_KEY:?AURA_OBJECTSTORE_ACCESS_KEY required in .env}
      AURA_OBJECTSTORE_SECRET_KEY: ${AURA_OBJECTSTORE_SECRET_KEY:?AURA_OBJECTSTORE_SECRET_KEY required in .env}
      AURA_OBJECTSTORE_PATH_STYLE: ${AURA_OBJECTSTORE_PATH_STYLE:-true}
      AURA_GARAGE_KEY_NAME: ${AURA_GARAGE_KEY_NAME:-aura-assets-local}
      AURA_GARAGE_ZONE: ${AURA_GARAGE_ZONE:-dc1}
      AURA_GARAGE_CAPACITY: ${AURA_GARAGE_CAPACITY:-1G}
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET required in .env}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage

  # ↓↓ Phase 37 (SBX-05, ADR 0037) — narrowed Docker API access for the sandbox daemon ↓↓
  # tecnativa/docker-socket-proxy fronts /var/run/docker.sock so the aura daemon can spawn
  # per-identity boxes WITHOUT holding raw root-equivalent socket access (T-37-08-SOCKET,
  # Open Q5). The raw socket is mounted READ-ONLY into THIS proxy only — never into the aura
  # service, never into a box (SBX-02). The proxy enables only the container/exec/volume/
  # network/image lifecycle subset the DockerBackend needs and denies everything else (no
  # swarm, no secrets, no daemon auth). It binds :2375 on the INTERNAL compose network only —
  # there is deliberately NO host publish (a host-reachable Docker proxy is a privilege-
  # escalation surface). Gated behind `profiles: [sandbox]`, so the DEFAULT `docker compose up`
  # neither starts it nor changes the dev stack — enable with `docker compose --profile sandbox
  # up -d` under a strict profile and set AURA_SANDBOX_DOCKER_HOST=tcp://docker-socket-proxy:2375.
  docker-socket-proxy:
    image: ${AURA_DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.5.0}
    container_name: aura-docker-socket-proxy
    profiles: [sandbox]
    restart: unless-stopped
    environment:
      # Read scopes the DockerBackend needs to inspect boxes/images/volumes/networks.
      CONTAINERS: "1"
      IMAGES: "1"
      VOLUMES: "1"
      NETWORKS: "1"
      EXEC: "1"
      # POST allows the write verbs (create/start/stop/remove/exec) the box lifecycle uses.
      POST: "1"
      # Everything else stays default-deny (no swarm, secrets, configs, plugins, daemon auth).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2
    container_name: aura-caddy
    restart: unless-stopped
    depends_on:
      aura:
        condition: service_healthy
    environment:
      AURA_ACCESS_TOKEN: ${AURA_ACCESS_TOKEN:?AURA_ACCESS_TOKEN required in .env}
    ports:
      - "0.0.0.0:${AURA_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.4-alpine3.24}
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aura}
      AURA_BACKUP_DIR: /backups
    ports:
      - "${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aura-postgres:/var/lib/postgresql
      - ${AURA_BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura} -d ${POSTGRES_DB:-aura}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Industrial asset object storage foundation. The garage-bootstrap one-shot
  # service creates the local bucket/key/CORS before Aura starts; install.sh
  # generates the internal secrets consumed here.
  garage:
    image: ${AURA_GARAGE_IMAGE:-dxflrs/garage:v2.3.0}
    container_name: aura-garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET required in .env}
      # Admin API v2 bearer token (Phase 36 D-08). Supplied via env like GARAGE_RPC_SECRET
      # so it is never committed to garage.toml. The [admin] block binds :3903 on the
      # INTERNAL compose network only — there is deliberately NO 3903 host publish below
      # (Pitfall 3: a host-reachable admin port is a privilege-escalation surface).
      GARAGE_ADMIN_TOKEN: ${AURA_GARAGE_ADMIN_TOKEN:?AURA_GARAGE_ADMIN_TOKEN required in .env}
    ports:
      - "127.0.0.1:${AURA_GARAGE_PORT:-3900}:3900"
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage

  # ↓↓ Slice 0.7 — OpenAI-compat embedding sidecar ↓↓
  # The shipped local contract is ggml-org EmbeddingGemma-300M Q8_0 at 768d with
  # mean pooling; the service definition below owns those defaults. Appliance and CI
  # flows materialize that exact GGUF before startup. The base service is GPU-first;
  # compose.minipc.yaml and the CI cache overlay remove its NVIDIA reservation.
  # ↓↓ ArcadeDB — graph substrate for memory + documents ↓↓
  # This container's only definition used to live in the turing_AgentMemory_MCP compose,
  # which was deleted with its folder on 2026-07-31. It is Aura's now.
  # Retrieval is full-text + graph, with an optional dense leg over the sidecar
  # embedder (LSM_VECTOR + vector.fuse); see internal/arcadedb/memory_vector.go.
  arcadedb:
    image: arcadedata/arcadedb:26.7.3
    container_name: aura-arcadedb
    restart: unless-stopped
    mem_limit: 3g
    environment:
      ARCADEDB_OPTS_MEMORY: ${ARCADEDB_OPTS_MEMORY:--Xms2G -Xmx2G}
      # The EMPTY brackets are load-bearing, both of them (measured on 26.7.3, 2026-07-31):
      #   `…defaultDatabases=aura_memory`              boots clean, logs nothing, creates NOTHING.
      #   `…defaultDatabases=aura_memory[root:$pw]`    creates the database AND writes
      #       `"aura_memory":[null]` into root's server-users entry, which SHADOWS its own
      #       `"*":["admin"]` — root is then locked out of the one database it just made
      #       ("User 'root' is not allowed to update schema", 403, on the first DDL).
      #   `…defaultDatabases=aura_memory[]`            creates it and grants nothing extra,
      #       so root's wildcard admin still applies. This is the only correct form.
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_PASSWORD:?ARCADEDB_PASSWORD required in .env}
        -Darcadedb.server.defaultDatabases=${ARCADEDB_DATABASE:-aura_memory}[]
    ports:
      - "127.0.0.1:2480:2480"
    volumes:
      - aura-arcadedb:/home/arcadedb/databases
      # Memory is per-identity: every enrolled user owns a `mem_<uuid>` database, and
      # nothing outside ArcadeDB knows the full list. So the backup is ArcadeDB's own
      # AutoBackupSchedulerPlugin rather than a job of ours that would have to enumerate
      # tenants: dropping backup.json into config/ makes the `defaults` block apply to
      # EVERY database, which means a tenant created five minutes ago is already covered.
      # Backups are hot — non-stop, no write blocking (docs: how-to/operations/backup).
      #
      # backupDirectory is "./backups" and MUST stay relative and inside the server root:
      # the manual's own troubleshooting says an absolute path fails with permission
      # denied (how-to/operations/auto-backup, "Permission denied errors"). Archives land
      # as backups/<db>/<db>-backup-YYYYMMDD-HHMMSS.zip, so this volume holds one
      # subdirectory per identity and must be sized for the whole fleet, not one database.
      - ./docker/arcadedb/backup.json:/home/arcadedb/config/backup.json:ro
      - aura-arcadedb-backups:/home/arcadedb/backups
    healthcheck:
      # /api/v1/ready answers 204 unauthenticated; every other endpoint needs credentials,
      # so it is the only probe that does not bake the root password into the compose file.
      # The image has wget and nc, but no curl and no bash.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:2480/api/v1/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Aura's own MCP surface over ArcadeDB (cmd/arcadedb-mcp). It is NOT ArcadeDB's built-in
  # MCP server: that one ships 10 generic tools in 26.7.3 — no full_text_search, no
  # hybrid_search, no upsert_entity, whatever the docs page claims — and its `query` tool
  # takes no bind parameters, which makes it unsafe for user text.
  arcadedb-mcp:
    build:
      context: .
      dockerfile: docker/arcadedb-mcp/Dockerfile
    image: ${AURA_ARCADEDB_MCP_IMAGE:-aura-arcadedb-mcp:local}
    pull_policy: never
    container_name: aura-arcadedb-mcp
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      arcadedb:
        condition: service_healthy
    environment:
      ARCADEDB_URL: http://arcadedb:2480
      ARCADEDB_DATABASE: ${ARCADEDB_DATABASE:-aura_memory}
      # NOT root. root is the server superuser — it can drop any database and
      # rewrite security; the memory sidecar needs one database. ArcadeDB scopes a
      # user per database ("databases": {"aura_memory": ["admin"]}), and the server
      # enforces it: a user asking for another database gets a SecurityException,
      # not an empty result. Same shape as the Postgres aura_app/aura_migrate split.
      ARCADEDB_USER: ${ARCADEDB_APP_USER:-aura_memory}
      ARCADEDB_PASSWORD: ${ARCADEDB_APP_PASSWORD:?ARCADEDB_APP_PASSWORD required in .env}
      # DDL only. ArcadeDB refuses server commands to anyone but root, so creating
      # a new identity's database needs this and nothing else does. Same split as
      # AURA_DB_URL / AURA_DB_MIGRATE_URL.
      ARCADEDB_ADMIN_USER: root
      ARCADEDB_ADMIN_PASSWORD: ${ARCADEDB_PASSWORD:?ARCADEDB_PASSWORD required in .env}
      # Derivation key for per-identity credentials. Each identity gets its own
      # database AND its own user, whose password is HMAC(secret, database) — so
      # nothing per-tenant is stored, and a credential can only be minted for an
      # identity the sidecar was actually handed. Rotating this invalidates every
      # tenant credential, so it is a planned operation, not a restart.
      AURA_ARCADEDB_TENANT_SECRET: ${AURA_ARCADEDB_TENANT_SECRET:?AURA_ARCADEDB_TENANT_SECRET required in .env}
      # The dense leg of memory retrieval. An empty value disables it and leaves
      # retrieval lexical, which is a supported configuration and not a degraded
      # one — the search falls back per call, so a sidecar that is merely down
      # cannot take memory with it.
      AURA_EMBED_BASE_URL: ${AURA_MEMORY_EMBED_BASE_URL:-http://aura-llama-embed:8081}
      AURA_EMBED_MODEL: ${AURA_EMBED_MODEL:-}
    ports:
      - "127.0.0.1:8096:8096"
    healthcheck:
      # The `aura` service gates its boot on this: memory is mounted INTO the agent
      # loop at startup and the in-process mount has no boot-retry, so a sidecar that
      # is merely still starting means an agent with ZERO memory tools until the next
      # restart. /health is deliberately liveness-only (it does not touch ArcadeDB —
      # see cmd/arcadedb-mcp/main.go), so an ArcadeDB blip cannot restart this process.
      # BusyBox wget ships in the Alpine runtime, so the probe adds no interpreter
      # or package solely for health checking.
      test: ["CMD", "wget", "--spider", "-q", "-T", "3", "http://127.0.0.1:8096/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  aura-llama-embed:
    image: ${AURA_EMBED_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: aura-llama-embed
    restart: unless-stopped
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
    command:
      # A LOCAL path, not --hf-repo: the sidecar has no egress, so a first boot that
      # has to fetch a GGUF from HuggingFace fails with "Could not establish
      # connection" and restart-loops. The model is pre-fetched into the cache volume
      # (docker run --rm -v aura_aura-llama-embed:/cache alpine … curl -o /cache/<file>),
      # which an appliance install wants anyway.
      - -m
      - ${AURA_EMBED_MODEL_PATH:-/root/.cache/llama.cpp/embeddinggemma-300M-Q8_0.gguf}
      - --embeddings
      # Pooling is a property of the embedding model, not a house style, and the wrong
      # choice degrades similarity silently rather than failing. The default here must
      # therefore match the default MODEL one line above — "it travels with the model in
      # .env" was the old reasoning and it was wrong, because the model path is defaulted
      # HERE too: a deploy with an empty .env got EmbeddingGemma from compose and `last`
      # from compose, a pair that never existed. EmbeddingGemma-300M's own GGUF declares
      # gemma-embedding.pooling_type = 1, and llama.cpp's enum (include/llama.h:
      # NONE=0, MEAN=1, CLS=2, LAST=3, RANK=4) makes that MEAN — its architecture is a
      # mean-pooling layer over the token embeddings. Override in .env only together
      # with AURA_EMBED_MODEL_PATH.
      - --pooling
      - ${AURA_EMBED_POOLING:-mean}
      - --embd-normalize
      - "2"
      - -ngl
      - "${AURA_EMBED_NGL:-99}"                 # GPU product default: offload all layers
      - --port
      - "8081"
      - -t
      - "4"                                    # CPU thread cap for orchestration work; harmless under GPU offload
      # -c was never set, so llama.cpp used its 4096 default while -ub 2048 sat right next
      # to a comment saying chunks exceed 1024 tokens. A spreadsheet chunks into ~8 KB rows
      # (~2.1k tokens), which alone overruns -ub, and a batch of them overran -c: the
      # sidecar answered HTTP 400 "exceeds the available context size", the embed job
      # dead-lettered after 5 attempts, and the document stayed "ready" with zero
      # embeddings. Aura now caps a request by BYTES (defaultEmbeddingBatchBytes); these
      # two make sure the sidecar can accept what it sends, with room to spare.
      # -c is PER SLOT and llama.cpp defaults to 4 of them, so it multiplies. A first
      # attempt at 32768 asked for 131k tokens of KV, ~9 GB, which does not fit the 4 GB
      # A2000 — and because -ngl 99 is set explicitly, llama.cpp abandoned its auto-fit
      # ("n_gpu_layers already set by user to 99, abort") and ran on CPU at ~300 tok/s
      # instead of failing. One slot at 8192 is ~50 MB of KV, comfortably above the 6k
      # tokens the byte budget (defaultEmbeddingBatchBytes) can send in one request.
      - -np
      - "${AURA_EMBED_SLOTS:-1}"
      - -c
      - "${AURA_EMBED_CTX:-8192}"
      - -ub
      - "${AURA_EMBED_UBATCH:-4096}"           # >= the largest SINGLE chunk: embeddings need the whole sequence in one ubatch
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - aura-llama-embed:/root/.cache/llama.cpp
    # The GPU reservation lives HERE, not in an overlay. It used to be a separate
    # compose.gpu.yaml, and the day someone ran `docker compose up -d` without it the
    # CUDA image started anyway and silently fell back to CPU — "no usable GPU found" is
    # a warning, not an error, so nothing failed and embeddings just got ~8x slower.
    # A GPU-less host removes it via compose.minipc.yaml, which is an explicit act.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s                       # first-boot HF model download can exceed 4 minutes

  # WhatsApp MCP sibling — forked whatsmeow bridge + FastMCP HTTP front
  # (chetto1983/whatsapp-mcp @ aura/cockpit-connect): the agent mounts the MCP over
  # streamable-HTTP (8080, catalog recipe:whatsapp), and Aura's cockpit drives device
  # linking via the bridge management REST (/api/{status,qr,logout} on 8081). CI-built
  # + published to GHCR (public) by the fork's aura-publish-image workflow. Aura boot
  # never depends on this service being healthy.
  whatsapp:
    image: ${AURA_WHATSAPP_MCP_IMAGE:-ghcr.io/chetto1983/whatsapp-mcp:sidecar}
    pull_policy: ${AURA_WHATSAPP_MCP_PULL_POLICY:-missing}
    container_name: aura-whatsapp
    restart: unless-stopped
    environment:
      WHATSAPP_BRIDGE_PORT: "8081"
      WHATSAPP_API_URL: http://127.0.0.1:8081/api
    ports:
      - "127.0.0.1:${AURA_WHATSAPP_MCP_PORT:-8092}:8080"     # MCP-over-HTTP for the agent
      - "127.0.0.1:${AURA_WHATSAPP_BRIDGE_PORT:-8094}:8081"  # bridge mgmt REST for the cockpit connect proxy
    volumes:
      - aura-whatsapp-session:/app/whatsapp-bridge/store
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Local SearXNG backend. Aura reaches it through Compose DNS on aura-web via
  # SEARXNG_URL; the host reaches it through loopback for local doctor/smoke probes.
  # SearXNG needs outbound egress to query upstream engines; loopback publishing
  # keeps the service local without cutting off metasearch.
  searxng:
    image: searxng/searxng:2026.7.26-b060c780d
    container_name: aura-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET required in .env}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        : "$${SEARXNG_SECRET:?SEARXNG_SECRET required in .env}"
        sed "s/__AURA_SEARXNG_SECRET__/$${SEARXNG_SECRET}/g" /etc/searxng/settings.template.yml > /etc/searxng/settings.yml
        chown searxng:searxng /etc/searxng/settings.yml
        chmod 0644 /etc/searxng/settings.yml
        exec /usr/local/searxng/entrypoint.sh
    ports:
      - "127.0.0.1:${AURA_SEARXNG_PORT:-18080}:8080"
    volumes:
      # Read-only so a compromised container cannot rewrite its own config (D-04,
      # T-07-02). Compose renders only the installer-generated secret into the
      # in-container settings.yml at boot; the checked-in file stays a template.
      - ./searxng/settings.yml:/etc/searxng/settings.template.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    networks:
      - aura-web
    healthcheck:
      test: ["CMD-SHELL", "wget --header='X-Forwarded-For: 127.0.0.1' --header='X-Real-IP: 127.0.0.1' -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ↓↓ Slice 9c — multimodal CPU sidecars (Phase 13, UX-04) ↓↓
  # Three thin OpenAI-compat CPU sidecars. Aura talks to each over the
  # Docker network (the telegram voice/photo/tts/documents clients), never with Go
  # ML in-process. All loopback-published; operator-started (compose, not boot —
  # T-13-09-SC accept). With AURA_VISION_CLOUD=true the operator simply does not
  # start aura-ocr-vl (tier B, no-GPU → OpenRouter cloud vision). STT/TTS stay local
  # in both tiers. Endpoints/ports per 13-RESEARCH.md §7.

  # aura-stt — faster-whisper STT via hwdsl2/whisper-server (spike 027 VALIDATED:
  # large-v3-turbo int8 on CPU; OGG/Opus decoded inline via PyAV — no ffmpeg shim).
  # STT_BASE_URL=http://aura-stt:9000/v1, POST /audio/transcriptions (multipart).
  # NOTE: this image uses WHISPER_MODEL (single underscore) + listens on :9000 — NOT
  # fedirz/faster-whisper-server's WHISPER__MODEL/:8000 (which rejects large-v3-turbo
  # as an invalid model size; spike 027 picked hwdsl2 precisely because it supports
  # turbo natively and ingests Telegram OGG/Opus directly).
  aura-stt:
    # STT stays on CPU: it is ~2s on a downscaled/short clip (fast enough), and the
    # hwdsl2 :cuda image needs CUDA >= 12.9 (driver >= ~575) — this host's 573.91
    # tops out lower, so the GPU image fails to start. To run STT on GPU after a
    # driver update: AURA_STT_IMAGE=hwdsl2/whisper-server:cuda STT_DEVICE=cuda
    # STT_COMPUTE_TYPE=int8_float16 + add the nvidia deploy block (see aura-ocr-vl).
    image: ${AURA_STT_IMAGE:-hwdsl2/whisper-server:latest}
    container_name: aura-stt
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${STT_MODEL:-large-v3-turbo}
      WHISPER_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      WHISPER_DEVICE: ${STT_DEVICE:-cpu}
      # hwdsl2/whisper-server latest auto-generates auth on fresh volumes unless
      # this is explicitly empty. Aura talks to this loopback sidecar without an
      # Authorization header.
      WHISPER_API_KEY: ""
    ports:
      - "127.0.0.1:${AURA_STT_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || curl -sf http://localhost:9000/v1/models || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s                       # first-boot turbo model download (~1.6GB)

  # aura-tts — Kokoro-82M (voice if_sara) → opus voice note. TTS_BASE_URL=
  # http://aura-tts:8880/v1, POST /audio/speech response_format=opus.
  aura-tts:
    image: ${AURA_TTS_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:latest}
    container_name: aura-tts
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AURA_TTS_PORT:-8880}:8880"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # aura-ocr-vl — GLM-OCR Q8 (llama.cpp CPU vision). MULTIMODAL_BASE_URL=
  # http://aura-ocr-vl:8082/v1, POST /chat/completions with a base64 image_url.
  # NOT started when AURA_VISION_CLOUD=true (the cloud-vision tier B).
  aura-ocr-vl:
    image: ${AURA_OCR_VL_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: aura-ocr-vl
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
    # Offloaded by default to free ~2.35GB VRAM for the GPU embed sidecar. On-demand:
    # `docker compose --profile ocr up -d aura-ocr-vl`. Vision paths fail-soft when absent.
    profiles: [ocr]
    restart: unless-stopped
    command:
      - --hf-repo
      - ${AURA_OCR_VL_HF_REPO:-ggml-org/glm-ocr-GGUF}
      - --port
      - "8082"
      - -ngl
      - "${AURA_OCR_VL_NGL:-99}"               # offload all layers to GPU (CPU OCR took ~55s; GLM-OCR is ~1.4GB → fits 4GB)
      - -t
      - "4"                                    # mini-PC CPU budget cap (feedback_minipc_cpu_budget)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:${AURA_OCR_VL_PORT:-8082}:8082"
    volumes:
      - aura-ocr-vl:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s                        # first-boot HF model download

  # Aura PIM sidecar — forked calendar-mcp (chetto1983/aura-pim-mcp @ aura/pim-sidecar):
  # unified mail+calendar+contacts over MCP-over-HTTP (/) + a token-gated admin REST API
  # (/admin) the cockpit drives for per-deployment OAuth connect. Not vendored: the image is
  # CI-built + published to GHCR (public) by the fork's aura-publish-image workflow. Pin via
  # AURA_PIM_MCP_IMAGE (e.g. the immutable :<sha> tag) for reproducible appliance builds.
  # Aura's catalog points at the loopback publish; Aura boot never depends on this service.
  aura-pim-mcp:
    image: ${AURA_PIM_MCP_IMAGE:-ghcr.io/chetto1983/aura-pim-mcp:sidecar}
    pull_policy: ${AURA_PIM_MCP_PULL_POLICY:-missing}
    container_name: aura-pim-mcp
    restart: unless-stopped
    # First-boot seed: the .NET host binds IConfiguration to whichever appsettings.json
    # EXISTS at startup. With a fresh volume the data-dir file is absent, so it falls back
    # to the baked (empty) /app/appsettings.json — while account writes go to /app/data.
    # Result: created accounts never become visible (verified live: create→201 then "No
    # accounts found"). Seeding an empty data-dir config makes the WRITABLE file the
    # authoritative source (reloadOnChange then keeps created accounts live).
    entrypoint:
      - /bin/sh
      - -c
      - "test -s /app/data/appsettings.json || printf '{\"CalendarMcp\":{\"Accounts\":[]}}' > /app/data/appsettings.json; exec dotnet CalendarMcp.HttpServer.dll"
    environment:
      CALENDAR_MCP_ADMIN_TOKEN: ${AURA_PIM_MCP_ADMIN_TOKEN:?AURA_PIM_MCP_ADMIN_TOKEN required in .env}
      # The external base the sidecar uses to build the Google OAuth redirect URI
      # (<base>/admin/auth/google/callback) — register that EXACT URI in the Google "Web
      # application" client. Default targets the loopback host-publish (works for a user on
      # the same machine as the Docker host; Google permits http://localhost:<port>). For a
      # remote cockpit set AURA_PIM_EXTERNAL_BASE_URL to the Caddy-fronted public HTTPS host.
      # (Empty derives from request headers and drops the port → wrong URI, so we default it.)
      # NB: the server does Configuration.Sources.Clear() then AddEnvironmentVariables("CALENDAR_MCP_"),
      # so the var MUST carry that prefix; after the strip it maps to CalendarMcp:ExternalBaseUrl.
      CALENDAR_MCP_CalendarMcp__ExternalBaseUrl: ${AURA_PIM_EXTERNAL_BASE_URL:-http://localhost:8093}
    ports:
      - "127.0.0.1:${AURA_PIM_MCP_PORT:-8093}:8080"
    volumes:
      - aura-pim-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Optional LOCAL chat-LLM — run Aura fully offline on llama.cpp instead of OpenRouter.
  # Opt-in via profile, not via a fourth compose file:
  #   COMPOSE_PROFILES=localllm docker compose up -d
  # then point the daemon at it in .env (the profile can gate a SERVICE, not another
  # service's env, so this half stays explicit):
  #   AURA_LLM_BASE_URL=http://aura-llm:8084/v1
  #   AURA_LLM_MODEL=qwen3-8b
  # Host-side `go run ./cmd/aura` is unaffected unless you export the same two.
  aura-llm:
    profiles: [localllm]
    image: ${AURA_LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: aura-llm
    restart: unless-stopped
    environment:
      LLAMA_ARG_HOST: 0.0.0.0
      # llama.cpp --hf-repo downloads into the HF hub cache ($HF_HOME/hub), NOT
      # /root/.cache/llama.cpp. Point HF_HOME at the persisted volume below so the
      # ~6GB GGUF survives container recreates (otherwise every --force-recreate,
      # e.g. a context-size change, re-downloads the whole model).
      HF_HOME: /root/.cache/llama.cpp
    command:
      - --hf-repo
      - ${AURA_LLM_HF_REPO:-unsloth/Qwen3-8B-GGUF}
      - --hf-file
      - ${AURA_LLM_HF_FILE:-Qwen3-8B-UD-Q4_K_XL.gguf}
      - -a
      - ${AURA_LLM_ALIAS:-qwen3-8b}
      - --port
      - "8084"
      - -ngl
      - "${AURA_LLM_NGL:-99}"          # full GPU offload
      - -c
      - "${AURA_LLM_CTX:-131072}"       # 128K context — the stable ceiling on a 12GB
                                        # RTX 3060 for Qwythos-9B-v2 (Q4 weights + BF16
                                        # mmproj + q8_0 KV). MEASURED: 256K saturates VRAM
                                        # (132MB free), 1M needs ~16-20GB KV → OOM. The
                                        # 3:1 hybrid (Gated-DeltaNet SSM : full-attn) keeps
                                        # KV small, but 1M still exceeds this GPU. Bump
                                        # AURA_LLM_CTX on bigger VRAM (e.g. DGX Spark).
                                        # Native ctx is 16384; YaRN (below) scales up.
      - -np
      - "${AURA_LLM_PARALLEL:-1}"       # ONE slot so -c is the full context, not c/np
      - --rope-scaling
      - yarn                            # Qwythos card: >16384 up to 1M needs YaRN
      - --yarn-orig-ctx
      - "16384"
      - --flash-attn
      - "on"                            # required for quantized KV cache
      - --cache-type-k
      - "${AURA_LLM_KV_QUANT:-q8_0}"    # 8-bit KV cache (halves KV VRAM)
      - --cache-type-v
      - "${AURA_LLM_KV_QUANT:-q8_0}"
      - --jinja                         # model chat template → Qwen3 tool-calling
      - --reasoning-format
      - deepseek                        # surface Qwen3 <think> as reasoning_content (Aura accept-both #33)
      # VERIFIED: Aura's per-turn adaptive reasoning is an OpenRouter `reasoning:{}`
      # object llama.cpp ignores, so thinking policy lives HERE, server-side.
      - --reasoning
      - "${AURA_LLM_REASONING:-auto}"   # on|off|auto — auto = Qwen3 template default (thinks)
      - --reasoning-budget
      - "${AURA_LLM_REASONING_BUDGET:--1}"  # thinking token cap: -1 unrestricted, 0 off, N to bound latency
      - -t
      - "4"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "127.0.0.1:${AURA_LLM_PORT:-8084}:8084"
    volumes:
      - aura-llm:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 900s                # first-boot GGUF download (~5.5GB) can be slow

  # Optional local observability pack. Prometheus and Tempo join Aura's network
  # namespace so the loopback-only metrics listener and OTLP receiver remain
  # private. Grafana alone is published, and only on host loopback.
  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    profiles: [observability]
    restart: unless-stopped
    network_mode: "service:aura"
    depends_on:
      aura:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${AURA_PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${AURA_PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - aura-prometheus:/prometheus
    mem_limit: ${AURA_PROMETHEUS_MEM_LIMIT:-384m}
    cpus: ${AURA_PROMETHEUS_CPUS:-0.50}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/bin/wget", "--spider", "-q", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s

  tempo:
    image: grafana/tempo:2.9.4@sha256:3ecdaa1af90b3068e77e4fb4b11d9f26201c3a57d5740d34965a323173a4f1aa
    profiles: [observability]
    restart: unless-stopped
    # The distroless image has no init shell; root is required to initialize a
    # fresh Docker-managed volume before Tempo writes bounded local blocks.
    user: "0:0"
    network_mode: "service:aura"
    depends_on:
      aura:
        condition: service_healthy
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - aura-tempo:/var/tempo
    mem_limit: ${AURA_TEMPO_MEM_LIMIT:-512m}
    cpus: ${AURA_TEMPO_CPUS:-0.50}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/tempo", "-config.file=/etc/tempo/tempo.yml", "-config.verify=true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:12.3.9@sha256:d4f671be4c5ff415ff9e9e8fd3439db00341ec537411fd8392646c9463d66a7f
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    ports:
      - "127.0.0.1:${AURA_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - aura-grafana:/var/lib/grafana
    mem_limit: ${AURA_GRAFANA_MEM_LIMIT:-384m}
    cpus: ${AURA_GRAFANA_CPUS:-0.50}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  aura-arcadedb:
  # One subdirectory per identity database, tiered retention (7 daily / 4 weekly /
  # 6 monthly) — see the arcadedb service for why the scheduler owns this and we do not.
  aura-arcadedb-backups:
  aura-home:
  # Amendment #88: the fixed /workspace working root (scripts/artifacts/.toolchain/scratch
  # + the skills symlink), durable across `docker compose up -d --force-recreate aura`.
  aura-workspace:
  aura-postgres:
  aura-llama-embed:
  aura-llm:
  aura-whatsapp-session:
  caddy-data:
  aura-ocr-vl:
  aura-pim-data:
  aura-prometheus:
  aura-tempo:
  aura-grafana:
  garage-data:
  # Warm package caches for the non-strict host-direct shell_exec path (npm/pip/uv download caches
  # under HOME=/root inside the aura container) — retained across recreates so re-installs are cache hits.
  aura-npm-cache-host:
  aura-pip-cache-host:
  aura-uv-cache-host:

networks:
  # Local SearXNG bridge: host-loopback published; default Docker NAT egress
  # remains enabled so metasearch can reach upstream engines.
  aura-web:
    driver: bridge
