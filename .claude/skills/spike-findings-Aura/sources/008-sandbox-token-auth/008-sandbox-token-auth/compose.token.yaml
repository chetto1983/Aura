# Spike 008 override — runs sandbox-agent WITH a bearer token instead of
# --no-token. Proves the auth path before Phase-11/Phase-8 hardening wires it.
# The token is a throwaway spike value; production reads it from .env
# (AURA_SANDBOX_AGENT_TOKEN) and the healthcheck must carry it too.
# Usage:
#   docker compose -f compose.yaml -f .planning/spikes/008-sandbox-token-auth/compose.token.yaml up -d aura-sandbox-agent
# Restore:
#   docker compose -f compose.yaml up -d aura-sandbox-agent
services:
  aura-sandbox-agent:
    command: ["server", "--token", "spike008-secret", "--no-telemetry", "--host", "0.0.0.0", "--port", "2468"]
    healthcheck:
      # The /v1/health probe must now authenticate, else the container is
      # marked unhealthy and Aura's boot gating would refuse it.
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer spike008-secret' http://127.0.0.1:2468/v1/health >/dev/null"]
