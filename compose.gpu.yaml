# GPU override for the embed sidecar. The base compose.yaml remains CPU-safe for
# CI and installer hosts; layer this file when Docker should reserve NVIDIA
# devices for the local embedder:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d aura-llama-embed
services:
  aura-llama-embed:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
