# Compatibility GPU override for the embed sidecar. The main compose.yaml now
# requests NVIDIA GPUs by default; keeping this file preserves existing operator
# commands:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d aura-llama-embed
#
# The block intentionally mirrors compose.yaml. It is not required for normal
# product startup, but it remains safe to layer.
services:
  aura-llama-embed:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
