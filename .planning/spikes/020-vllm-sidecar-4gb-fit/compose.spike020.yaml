# Spike 020 — vLLM sidecar fit on RTX A2000 Laptop 4GB (Docker Desktop, nvidia runtime).
#
# Standalone compose project (NEVER merged into the production compose.yaml — D-15 mount
# decision comes after the verdict). Services are brought up SELECTIVELY per phase:
#
#   Phase A (vision fit):   docker compose -f compose.spike020.yaml -p spike020 up -d vllm-vision
#   Phase B (STT fit):      docker compose -f compose.spike020.yaml -p spike020 up -d vllm-stt
#   Phase C (dual resident): docker compose -f compose.spike020.yaml -p spike020 up -d vllm-vision-half vllm-stt-half
#   Teardown:               docker compose -f compose.spike020.yaml -p spike020 down
#
# HF model cache persists in D:\tmp\spike-020-hf (volatile by design, ~4GB).
# Image: v0.22.1-cu129 — the :latest default is CUDA 13.0 and the host driver (573.91)
# tops out at CUDA 12.x → nvidia-container-cli refuses it (finding, see README trail).

x-vllm-common: &vllm-common
  image: vllm/vllm-openai:v0.22.1-cu129
  ipc: host
  shm_size: "2gb"
  restart: "no"
  environment:
    # driver 573.91 reports CUDA 12.8; image wants >=12.9. Minor-version compat
    # (12.9-built on 12.8 driver) works for vLLM/PyTorch — bypass the strict check.
    - NVIDIA_DISABLE_REQUIRE=1
  # WSL fix: the image's cuda-12.9/compat libcuda shadows the WSL-injected one
  # (/usr/lib/x86_64-linux-gnu) → torch cuInit fails with "No CUDA GPUs are available"
  # while nvidia-smi (NVML) works. Drop the compat stub, re-ldconfig, exec vllm serve.
  entrypoint:
    - bash
    - -c
    - rm -f /usr/local/cuda-12.9/compat/libcuda.so* && ldconfig && exec vllm serve "$@"
    - --
  volumes:
    - /d/tmp/spike-020-hf:/root/.cache/huggingface
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Phase A: vision model alone, full GPU budget.
  # FP8 checkpoint → vLLM Marlin W8A16 fallback on Ampere (A2000 = sm_86, no native FP8).
  vllm-vision:
    <<: *vllm-common
    container_name: spike020-vllm-vision
    ports:
      - "18086:8000"
    command:
      - --model=Qwen/Qwen3-VL-2B-Instruct-FP8
      # 4GB math: weights 2.95GiB (FP8 Marlin W8A16) + ~0.8GiB CUDA/torch overhead
      # leave only fractions of a GiB for KV. 2048 ctx needs 0.22GiB KV — a 9c
      # voice/vision turn is short, so this is the real ceiling, not a crippling cap.
      - --max-model-len=2048
      - --gpu-memory-utilization=0.92
      - --max-num-seqs=1
      - --enforce-eager
      - '--limit-mm-per-prompt={"image": 1}'
      # Cap vision tokens: max-resolution profiling forward pass OOM-swaps on 4GB.
      # 1024*28*28 ≈ 0.8MP ceiling — correct prod config for a 2B VLM on this card.
      - '--mm-processor-kwargs={"max_pixels": 802816}'

  # Phase B: ASR model alone, full GPU budget. Exposes /v1/audio/transcriptions —
  # the exact endpoint contract PRD voice.go assumes.
  vllm-stt:
    <<: *vllm-common
    container_name: spike020-vllm-stt
    ports:
      - "18087:8000"
    command:
      - --model=openai/whisper-large-v3-turbo
      - --gpu-memory-utilization=0.78
      - --max-num-seqs=2
      - --enforce-eager

  # Phase C: both resident at once, GPU budget split. THE architectural question:
  # can 9c have STT+vision simultaneously on this card via vLLM?
  vllm-vision-half:
    <<: *vllm-common
    container_name: spike020-vllm-vision-half
    ports:
      - "18088:8000"
    command:
      - --model=Qwen/Qwen3-VL-2B-Instruct-FP8
      - --max-model-len=4096
      - --gpu-memory-utilization=0.37
      - --max-num-seqs=1
      - --enforce-eager
      - '--limit-mm-per-prompt={"image": 1}'

  vllm-stt-half:
    <<: *vllm-common
    container_name: spike020-vllm-stt-half
    ports:
      - "18089:8000"
    command:
      - --model=openai/whisper-large-v3-turbo
      - --gpu-memory-utilization=0.37
      - --max-num-seqs=1
      - --enforce-eager
