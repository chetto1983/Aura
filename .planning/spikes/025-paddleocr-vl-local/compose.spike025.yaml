# Spike 025 — PaddleOCR-VL-1.5 (0.9B GGUF, ~1.8GB) on llama.cpp CUDA server, RTX A2000 4GB.
#
# Operator pivot 2026-06-07: local 4GB vLLM can't reserve KV for a 2B multimodal →
# use a dedicated 0.9B OCR-VL model on the PRD baseline engine (llama.cpp). Vision/OCR
# half of 9c. Audio/STT half handled separately (whisper / 2026 audio model).
#
#   up:   docker compose -f compose.spike025.yaml -p spike025 up -d
#   down: docker compose -f compose.spike025.yaml -p spike025 down
#
# GGUFs live in D:\tmp\spike-025 (downloaded by the harvest step, volatile).

services:
  llama-ocr:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: spike025-llama-ocr
    ports:
      - "18090:8080"
    volumes:
      - /d/tmp/spike-025:/models:ro
    environment:
      - NVIDIA_DISABLE_REQUIRE=1
    # Same WSL libcuda shadow fix as spike 020: drop the image's cuda compat stub so the
    # WSL-injected libcuda wins, then exec llama-server. (llama.cpp is CUDA-tolerant and
    # mmaps the GGUF — none of vLLM's 3GB-RAM-load fragility.)
    entrypoint:
      - bash
      - -c
      - >-
        rm -f /usr/local/cuda*/compat/libcuda.so* 2>/dev/null; ldconfig;
        exec /app/llama-server
        -m /models/PaddleOCR-VL-1.5.gguf
        --mmproj /models/PaddleOCR-VL-1.5-mmproj.gguf
        --host 0.0.0.0 --port 8080
        --temp 0
        -ngl 99
        -c 8192
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
