# Spike 006 override — swaps the sandbox-agent image for the openpyxl-baked
# spike image AND keeps the spike-005 ro /skills mount (the capstone needs both).
# Usage:
#   docker build -t aura-sandbox-agent:spike006 .planning/spikes/006-xlsx-skill-dry-run
#   docker compose -f compose.yaml -f .planning/spikes/006-xlsx-skill-dry-run/compose.spike006.yaml up -d aura-sandbox-agent
# Restore:
#   docker compose -f compose.yaml up -d aura-sandbox-agent
services:
  aura-sandbox-agent:
    image: aura-sandbox-agent:spike006
    build: !reset null
    volumes:
      - "D:/Aura/.planning/spikes/005-skills-ro-mount/export:/skills:ro"
