<!DOCTYPE html>
<html lang="{{.Locale}}" data-theme="dark">
<head>
<meta charset="utf-8">
<title>{{index .T "title"}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg: oklch(0.16 0.03 250);
    --surface: oklch(0.21 0.035 250);
    --surface-2: oklch(0.18 0.035 250);
    --fg: oklch(0.96 0.01 250);
    --muted: oklch(0.7 0.02 250);
    --border: oklch(0.32 0.03 250);
    --primary: oklch(0.7 0.18 240);
    --primary-fg: oklch(0.16 0.03 250);
    --danger: oklch(0.7 0.2 25);
    --success: oklch(0.7 0.18 145);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 50% at 80% 0%, oklch(0.7 0.18 240 / 0.06), transparent),
      radial-gradient(ellipse 80% 50% at 20% 100%, oklch(0.55 0.18 290 / 0.05), transparent);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 96px;
  }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); margin: 0 0 32px; line-height: 1.5; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .card .hint { color: var(--muted); font-size: 13px; margin: 0 0 16px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; font-weight: 500; }
  input, select, textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 120ms ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px oklch(0.7 0.18 240 / 0.2);
  }
  input[type="password"], input.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row > div { min-width: 0; }
  button {
    background: var(--primary);
    color: var(--primary-fg);
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 120ms;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary {
    background: var(--surface-2);
    color: var(--fg);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .status { font-size: 13px; min-height: 18px; }
  .status.ok { color: var(--success); }
  .status.err { color: var(--danger); }
  .preset-desc { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.4; }
  .save-bar {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--bg), oklch(0.16 0.03 250 / 0.8));
    padding: 16px 0 8px;
    margin-top: 16px;
  }
  .footnote { color: var(--muted); font-size: 12px; margin-top: 8px; }
  details { margin-top: 16px; }
  details summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--muted);
    user-select: none;
  }
  details summary:hover { color: var(--fg); }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .logo svg { width: 40px; height: 40px; }
  .logo span { font-size: 13px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="30" fill="oklch(0.16 0.03 250)" stroke="var(--primary)" stroke-width="2"/>
      <path d="M20 44 L32 18 L44 44 M25 36 L39 36" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div>
      <div style="font-weight:700;font-size:16px;">Aura</div>
      <span>{{index .T "brandSub"}}</span>
    </div>
  </div>

  <h1>{{index .T "heading"}}</h1>
  <p class="lede">
    {{index .T "lede"}}
  </p>

  <form id="setup-form" method="POST" action="/save">
    <div class="card">
      <h2>{{index .T "telegramTitle"}}</h2>
      <p class="hint">{{index .T "telegramHint"}}</p>
      <label for="telegram_token">TELEGRAM_TOKEN</label>
      <input type="password" id="telegram_token" name="telegram_token" required autocomplete="off" placeholder="123456789:ABCdef..." class="mono">
    </div>

    <div class="card">
      <h2>{{index .T "modelTitle"}}</h2>
      <p class="hint">{{index .T "modelHint"}}</p>

      <label for="llm_preset">{{index .T "provider"}}</label>
      <select id="llm_preset" name="llm_preset">
        {{- range .Presets }}
        <option value="{{.ID}}">{{.Label}}</option>
        {{- end }}
      </select>
      <p class="preset-desc" id="preset-desc"></p>

      <div class="row">
        <div>
          <label for="llm_base_url">{{index .T "baseURL"}}</label>
          <input type="text" id="llm_base_url" name="llm_base_url" required class="mono">
        </div>
        <div>
          <label for="llm_model">{{index .T "model"}}</label>
          <input type="text" id="llm_model" name="llm_model" required class="mono" list="model-suggestions">
          <datalist id="model-suggestions"></datalist>
        </div>
      </div>

      <label for="llm_api_key" id="llm_api_key_label">{{index .T "apiKey"}}</label>
      <input type="password" id="llm_api_key" name="llm_api_key" autocomplete="off" class="mono" placeholder="{{index .T "apiKeyPlaceholder"}}">

      <div class="btn-row">
        <button type="button" class="secondary" id="btn-test">{{index .T "testConnection"}}</button>
        <span class="status" id="probe-status"></span>
      </div>
    </div>

    <details>
      <summary>{{index .T "optionalSummary"}}</summary>
      <div class="card" style="margin-top: 12px;">
        <p class="hint">{{index .T "optionalHint"}}</p>
        <label for="embedding_api_key">{{index .T "embeddingKey"}}</label>
        <input type="password" id="embedding_api_key" name="embedding_api_key" autocomplete="off" class="mono">
        <label for="mistral_api_key">{{index .T "ocrKey"}}</label>
        <input type="password" id="mistral_api_key" name="mistral_api_key" autocomplete="off" class="mono">
      </div>
    </details>

    <div class="save-bar">
      <div class="btn-row">
        <button type="submit" id="btn-save">{{index .T "save"}}</button>
        <span class="status" id="save-status"></span>
      </div>
      <p class="footnote">{{index .T "footnote"}}</p>
    </div>
  </form>
</div>

<script>
  const presets = {{.PresetsJSON}};
  const text = {{.TextJSON}};
  const presetDesc = document.getElementById('preset-desc');
  const baseURL = document.getElementById('llm_base_url');
  const model = document.getElementById('llm_model');
  const apiKey = document.getElementById('llm_api_key');
  const apiKeyLabel = document.getElementById('llm_api_key_label');
  const probeStatus = document.getElementById('probe-status');
  const saveStatus = document.getElementById('save-status');
  const modelSuggestions = document.getElementById('model-suggestions');

  function t(key, fallback) {
    return text[key] || fallback || key;
  }

  function applyPreset(id) {
    const p = presets.find(x => x.id === id);
    if (!p) return;
    if (p.base_url) baseURL.value = p.base_url;
    if (p.model) model.value = p.model;
    presetDesc.textContent = p.description;
    apiKey.required = p.needs_key;
    apiKey.placeholder = t('apiKeyPlaceholder', 'sk-...');
    apiKeyLabel.textContent = t('apiKey', 'API key');
  }

  document.getElementById('llm_preset').addEventListener('change', e => applyPreset(e.target.value));
  applyPreset(document.getElementById('llm_preset').value);

  document.getElementById('btn-test').addEventListener('click', async () => {
    probeStatus.textContent = t('testing', 'Testing...');
    probeStatus.className = 'status';
    const presetID = document.getElementById('llm_preset').value;
    const body = {
      preset: presetID,
      base_url: baseURL.value,
      api_key: apiKey.value,
    };
    try {
      const res = await fetch('/test', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.ok) {
        probeStatus.textContent = data.models && data.models.length > 0
          ? 'OK ' + t('connectedModels', 'Connected. {count} models available.').replace('{count}', data.models.length)
          : 'OK ' + t('connectedNoModels', 'Connected (model list not exposed).');
        probeStatus.className = 'status ok';
        modelSuggestions.innerHTML = '';
        if (data.models) {
          for (const m of data.models) {
            const opt = document.createElement('option');
            opt.value = m;
            modelSuggestions.appendChild(opt);
          }
        }
      } else {
        probeStatus.textContent = 'ERR ' + (data.error || t('failed', 'failed'));
        probeStatus.className = 'status err';
      }
    } catch (err) {
      probeStatus.textContent = 'ERR ' + err.message;
      probeStatus.className = 'status err';
    }
  });

  document.getElementById('setup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    saveStatus.textContent = t('saving', 'Saving...');
    saveStatus.className = 'status';
    const data = new FormData(e.target);
    const body = {};
    for (const [k, v] of data.entries()) body[k] = v;
    try {
      const res = await fetch('/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
      });
      const j = await res.json();
      if (j.ok) {
        saveStatus.textContent = 'OK ' + t('saved', 'Saved. Aura is starting now - open the dashboard...');
        saveStatus.className = 'status ok';
        setTimeout(() => { window.location.href = '/'; }, 2500);
      } else {
        saveStatus.textContent = 'ERR ' + (j.error || t('failed', 'failed'));
        saveStatus.className = 'status err';
        btn.disabled = false;
      }
    } catch (err) {
      saveStatus.textContent = 'ERR ' + err.message;
      saveStatus.className = 'status err';
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
