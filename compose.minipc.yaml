# Mini PC (appliance) — il delta su compose.yaml, che resta il file locale con GPU.
#
# COME SI USA, e perché non c'è nessun `-f` da ricordare. Nel .env del mini PC:
#
#   COMPOSE_FILE=compose.yaml:compose.minipc.yaml
#
# Da lì in poi lì si lancia `docker compose up -d` liscio, esattamente come in locale.
# Questo è il punto di tutto il file: gli overlay precedenti andavano passati a mano a
# ogni comando, e il giorno che ne dimenticavi uno non falliva niente — cambiava solo,
# in silenzio, dove finivano gli embedding o se la GPU veniva usata. Un `-f` dimenticato
# non deve poter essere una modalità di guasto.
#
# COSA CAMBIA rispetto al locale, e perché:
#
#   - niente GPU: l'N95 non ne ha una. Immagine non-CUDA e -ngl 0 arrivano da .env
#     (AURA_EMBED_IMAGE / AURA_EMBED_NGL), qui si toglie solo la riserva del device,
#     che è strutturale e non parametrizzabile.
#   - embedding LOCALE anche qui. Misurato: 21-44 ms in locale contro 3,9-43,3 s per
#     chiamata via OpenRouter, moltiplicato per le 27 ancore che il classificatore
#     embedda a ogni turno. Il cloud è per i modelli grossi, non per questo.
#   - STT, TTS e OCR/vision vanno in cloud e i tre container spariscono: sono i soli
#     che chiedono una GPU seria, e su questa macchina non girerebbero.
#   - ArcadeDB tiene il suo heap dal base (ARCADEDB_OPTS_MEMORY in .env): è una
#     variabile, non una riga di override, quindi qui non c'è niente da riscrivere.
services:
  # I tre servizi che sul mini PC vivono in cloud. Cancellati, non spenti: un
  # servizio dichiarato e mai avviato è una trappola: `docker compose up -d` liscio lo
  # tira su, e su questa macchina significa scaricare un'immagine CUDA da 5 GB in WiFi
  # per un container che poi non parte.
  aura-stt: !reset null
  aura-tts: !reset null
  # aura-ocr-vl non serve resettarlo: è già dietro `profiles: [ocr]` nel base.

  docker-socket-proxy:
    # Il proxy del socket Docker è la sandbox, e sul mini PC è parte del prodotto, non
    # un extra. Nel base sta dietro `profiles: [sandbox]` perché lì è opt-in; qui il
    # profilo si azzera così parte con `docker compose up -d` liscio, invece di
    # dipendere da un COMPOSE_PROFILES che qualcuno deve ricordarsi.
    profiles: !reset []

  aura-llama-embed:
    # Il default DEVE essere la build CPU, non ereditare quella CUDA dal base: un default
    # che funziona solo se qualcuno si ricorda una riga di .env non è un default. Con la
    # build CPU il `-ngl 99` che arriva dal base diventa un no-op dichiarato
    # ("--gpu-layers option will be ignored"), quindi non serve ricopiare tutto il command
    # solo per cambiare un numero.
    image: ${AURA_EMBED_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    # La riserva del device è strutturale, non un valore: su un host senza driver NVIDIA
    # il container non parte proprio, quindi qui va tolta e non parametrizzata.
    deploy: !reset null

  aura:
    depends_on:
      # service_started e non service_healthy: qui sono ausiliari, se markitdown o
      # searxng arrancano l'agente deve comunque salire.
      markitdown:
        condition: service_started
      searxng:
        condition: service_started
    environment:
      # Cablati nel base sui sidecar locali, quindi qui vanno riscritti per intero e
      # non basta una variabile.
      MULTIMODAL_BASE_URL: ${MULTIMODAL_BASE_URL:-https://openrouter.ai/api/v1}
      MULTIMODAL_MODEL: ${MULTIMODAL_MODEL:-google/gemini-3.5-flash-lite}
      MULTIMODAL_FALLBACK_MODEL: ${MULTIMODAL_FALLBACK_MODEL:-minimax/minimax-m3}
      AURA_VISION_CLOUD: "${AURA_VISION_CLOUD:-true}"
      AURA_STT_CLOUD_MODEL: ${AURA_STT_CLOUD_MODEL:-openai/whisper-large-v3-turbo}
      AURA_TTS_MODEL: ${AURA_TTS_MODEL:-hexgrad/kokoro-82m}
      # opus lo produce solo il kokoro locale, che qui non c'è.
      TTS_FORMAT: ${TTS_FORMAT:-mp3}

  markitdown:
    environment:
      AURA_OCR_BASE_URL: ${AURA_OCR_BASE_URL:-https://openrouter.ai/api/v1}
      AURA_OCR_MODEL: ${AURA_OCR_MODEL:-google/gemini-3.5-flash-lite}
      AURA_OCR_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY required in .env}
