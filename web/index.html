<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0E14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Aura</title>
    <script>
      (function () {
        try {
          var r = document.documentElement;
          r.setAttribute('data-theme', localStorage.getItem('aura.theme') || 'dark');
          r.setAttribute('data-density', localStorage.getItem('aura.density') || 'operator');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-density', 'operator');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Aura requires JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
