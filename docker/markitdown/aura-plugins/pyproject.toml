[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-markitdown-plugins"
version = "0.1.0"
description = "Aura per-row/per-heading markitdown converters for wiki subnode indexing"
requires-python = ">=3.11"
# No extra deps: openpyxl is already in markitdown[all]
dependencies = []

[project.entry-points."markitdown.plugin"]
aura = "aura:register"

[project.scripts]
aura-markitdown-mcp = "aura.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aura*"]
