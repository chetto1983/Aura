# Aura SearXNG — checked-in, mounted READ-ONLY at /etc/searxng/settings.yml (D-04).
# Phase 7 (Slice 5) web_search backend. This file overrides only the keys Aura
# needs; everything else (the full engine catalogue) is inherited via
# use_default_settings so this stays small and survives image upgrades.
#
# Source: searxng/searxng:2026.5.31-7159b8aed default settings.yml + docs
#   https://docs.searxng.org/admin/settings/settings_search.html
#   https://docs.searxng.org/admin/settings/settings_server.html
# verified against the pinned image entrypoint (Granian binds :8080) 2026-06-02.
use_default_settings: true

general:
  instance_name: "Aura SearXNG"
  # Internal-only instance: no public donation/contact surface.
  donation_url: false
  contact_url: false
  # Do not leak engine/timing internals to the (model-driven) caller.
  enable_metrics: false

search:
  # D-04 / RESEARCH Pitfall 5: web_search requests format=json. Without json in
  # this list SearXNG returns 403 for format=json. html stays for the browser/debug.
  formats:
    - html
    - json
  # Safesearch stays operator/config-level, never model-controlled (D-10).
  safe_search: 0
  autocomplete: ""

server:
  # NOTE: the container's Granian entrypoint binds :8080 via GRANIAN_PORT and
  # overrides this file's port/bind_address; SEARXNG_URL=http://searxng:8080/search.
  # secret_key MUST be set for a non-default instance; this instance has no host
  # port (D-03) so it is unreachable outside the Compose network. Operators may
  # override via ${SEARXNG_SECRET}.
  secret_key: "aura-searxng-internal-only-change-via-SEARXNG_SECRET"
  # Internal single-consumer instance — no bot limiter, no public-instance feature
  # surface. The lack of a published host port (D-03) is the actual access control.
  limiter: false
  public_instance: false
  image_proxy: false

ui:
  static_use_hash: true
