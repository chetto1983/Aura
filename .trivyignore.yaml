# Accepted Trivy findings for the weekly security scan (.github/workflows/security-scan.yml, spec
# docs/superpowers/specs/2026-10-24-weekly-security-scan-design.md, D2). Every entry has three
# parts:
# - a statement;
# - an expired_at at most 90 days out;
# - a purl with the exact version, so that the same advisory in another image, Aura's own above
#   all, is still reported.
# Measured with Trivy 0.70.0 on 2026-10-24 against kokoro's perl-base: the exact purl hides the
# finding, a purl with another version does not, and an expired_at in the past no longer hides
# anything.
#
# All entries below are third-party CRITICALs that only upstream can fix: each image is on its
# newest release. The operator approved the first two on 2026-10-24, and brotli on 2026-11-03
# (issue #212). Review each one by its expired_at.
vulnerabilities:
  # postgres:18.6-alpine3.24: gosu is built with Go 1.24.6.
  - id: CVE-2025-68121
    purls:
      - "pkg:golang/stdlib@v1.24.6"
    statement: "Go 1.24.6 in the postgres image's gosu binary, fixed upstream by a rebuild only"
    expired_at: 2027-01-22

  # arcadedata/arcadedb:26.11.1: netty-handler 4.1.136.Final, still inside arcadedb-ha-raft's
  # shaded jar as it was in 26.10.2.
  - id: CVE-2026-75595
    purls:
      - "pkg:maven/io.netty/netty-handler@4.1.136.Final"
    statement: "netty-handler shaded into ArcadeDB 26.11.1, the newest release; fixed upstream only"
    expired_at: 2027-01-22

  # postgres:18.6-alpine3.24: its Alpine base still ships brotli-libs 1.2.0-r1 (fixed in
  # 1.2.1-r0), and the tag was not rebuilt after 2026-10-26. ArcadeDB 26.11.1 no longer ships
  # brotli-libs, which ArcadeDB 26.10.2 also carried.
  - id: CVE-2026-111497
    purls:
      - "pkg:apk/alpine/brotli-libs@1.2.0-r1?arch=x86_64&distro=3.24.2"
      - "pkg:apk/alpine/brotli-libs@1.2.0-r1?arch=x86_64&distro=3.24.3"
    statement: "brotli-libs in the Alpine base of Postgres 18.6, the newest release; fixed upstream by a rebuild only"
    expired_at: 2027-02-01

  # Aura's own images, where the vulnerable code sits inside a binary or package only upstream
  # ships. Each entry also carries the path, so the same version elsewhere in an image is still
  # reported (measured with Trivy 0.70.0 on 2026-10-24: a copy of the same undici at another path
  # stays in the report). The operator approved the first on 2026-10-24, the rest on 2026-11-03
  # (issue #212).

  # aura and aura-sandbox: the undici npm bundles. npm 11.21.1, the newest 11.x, and 12.2.1, the
  # newest of all, both ship 6.29.0 (still so on 2026-11-03); the fix is 6.29.1.
  - id: CVE-2026-109869
    purls:
      - "pkg:npm/undici@6.29.0"
    paths:
      - "usr/lib/node_modules/npm/node_modules/undici/package.json"
    statement: "undici bundled inside npm 11.21.1; no npm release ships the fixed 6.29.1 yet"
    expired_at: 2027-01-22
  - id: CVE-2026-109383
    purls:
      - "pkg:npm/undici@6.29.0"
    paths:
      - "usr/lib/node_modules/npm/node_modules/undici/package.json"
    statement: "undici bundled inside npm 11.21.1; no npm release ships the fixed 6.29.1 yet"
    expired_at: 2027-02-01
  - id: CVE-2026-87018
    purls:
      - "pkg:npm/undici@6.29.0"
    paths:
      - "usr/lib/node_modules/npm/node_modules/undici/package.json"
    statement: "undici bundled inside npm 11.21.1; no npm release ships the fixed 6.29.1 yet"
    expired_at: 2027-02-01

  # aura-sandbox: tsc in the artifact template is TypeScript 7.0.2's native binary, which
  # Microsoft built with Go 1.26.4 and golang.org/x/text v0.38.0. 7.0.2 is the newest release
  # (7.1 is a beta) and create-vite's react-ts template asks for ~7.0.2. The compiler runs on the
  # model's own project inside its box, which is the boundary; it serves nothing over the network.
  - id: CVE-2026-56851
    purls:
      - "pkg:golang/golang.org/x/text@v0.38.0"
    paths: &tsc
      - "opt/aura-artifacts/template/node_modules/.pnpm/@typescript+typescript-linux-x64@7.0.2/node_modules/@typescript/typescript-linux-x64/lib/tsc"
    statement: "x/text compiled into TypeScript 7.0.2's tsc, the newest release; only Microsoft can rebuild it"
    expired_at: 2027-02-01
  - id: CVE-2026-56852
    purls:
      - "pkg:golang/golang.org/x/text@v0.38.0"
    paths: *tsc
    statement: "x/text compiled into TypeScript 7.0.2's tsc, the newest release; only Microsoft can rebuild it"
    expired_at: 2027-02-01
