# Local git hooks (https://lefthook.dev). Mirrors a fast subset of `make quality`
# so problems are caught at commit/push time, not in CI.
#
# Install once per clone:  lefthook install
#   (binary: `go install github.com/evilmartians/lefthook@latest`, or `make tools`)
# Bypass in an emergency:  git commit --no-verify   /   git push --no-verify
#
# Heavy gates (race, integration, coverage, mutation) intentionally stay in CI /
# `make quality-full` — hooks must be fast enough not to be bypassed habitually.

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      # Script (not inline) so the GOROOT/bin/gofmt resolution parses identically
      # under Windows Git Bash, WSL, and CI Linux.
      run: bash scripts/gofmt-staged.sh {staged_files}
      stage_fixed: true
    # Staged-file-driven, like gofmt above: the glob decides whether to run at all, and the
    # script narrows the scan to the packages this commit touches. `go vet ./...` used to run
    # here unconditionally, which meant a docs- or web-only commit paid for a whole-module
    # vet, and — in a worktree shared with a second session — a commit could be blocked by
    # THEIR in-progress file, which is how someone ends up reaching for `git stash` or
    # --no-verify. Narrowing does not isolate a package from a broken DEPENDENCY (vet
    # type-checks those too, and that failure is real), it removes the unrelated ones.
    # CI keeps the full sweep: `go vet $(bash scripts/go_packages.sh)` plus the tagged tiers.
    vet:
      glob: "*.go"
      run: bash scripts/vet-staged.sh {staged_files}
    # golangci-lint (dupl/gosec/govet/staticcheck/revive/…) runs here, not at pre-push, so a
    # lint regression surfaces at the commit that introduced it instead of after a range of
    # commits accumulates for a push (the caught issue is then one small diff, not a bisect).
    # Staged-file-driven like gofmt and vet above: whole PACKAGES, because the cross-file
    # analyses need them, but only the packages this commit touches. The full-module form
    # ran here until 2026-09-03, when it refused a compose-only commit over a gofmt finding
    # in cmd/arcadedb-mcp — a package that commit never touched, left dirty by a second
    # session in the same worktree. That is exactly the trap vet-staged.sh was written for.
    # CI keeps the full sweep.
    lint:
      glob: "*.go"
      run: bash scripts/lint-staged.sh {staged_files}
    # Staged-file-only ({staged_files}), unlike lint above: the 600-LOC cap is a
    # per-file property, so scanning the whole tree can only re-report violations
    # this commit did not introduce — while costing ~2min of `wc` spawns over ~2k
    # sources on Windows Git Bash. CI + `make file-size` still sweep the full tree.
    file-size:
      glob: "*.{go,ts,tsx}"
      run: bash scripts/check-file-size.sh {staged_files}
    # Frontend copy/paste detector (jscpd) — TS/TSX parity to the Go `dupl` linter.
    # Gated on web .ts/.tsx so a Go-only commit skips it; the script self-guards on a
    # missing web/node_modules. Config: web/.jscpd.json (fails on any non-test clone
    # >=100 tokens, matching .golangci.yml dupl threshold 100).
    dup:
      glob: "web/**/*.{ts,tsx}"
      run: bash scripts/check-dup.sh

pre-push:
  # The gates run on a clean checkout of the commit being pushed (scripts/pushed_tree.sh),
  # never on the working tree: two sessions share it, and one's uncommitted files failed
  # the other's push on 2026-09-23. `pushed-tree` reads the pushed refs from stdin (only
  # one job may have it) and prepares the checkout; piped stops the push if it cannot.
  # glob still filters on the pushed files, which lefthook computes in the repository.
  piped: true
  jobs:
    - name: pushed-tree
      use_stdin: true
      run: bash scripts/pushed_tree.sh prepare
    - name: gates
      group:
        parallel: true
        jobs:
          # NOTE: golangci-lint moved to pre-commit (above) so lint regressions surface at
          # their authoring commit, not here. build/deadcode stay at pre-push — they are fast
          # whole-module gates whose only job is a final "still compiles + no dead code"
          # check before the network.
          - name: build
            run: bash scripts/pushed_tree.sh bash -c 'go build $(bash scripts/go_packages.sh)'
          # No inner quotes, and no arguments: same hazard deadcode documents below. The cd,
          # the explicit --compile and the reasons for both live in the wrapper.
          - name: tagged-tier-compile
            run: bash scripts/pushed_tree.sh bash scripts/tagged_tier_pre_push.sh
          # The payload manifest pins the bytes the installer artifact ships. It is
          # regenerated BY HAND (`make payload-manifest`) on purpose: auto-writing it would
          # let a payload change slip through invisibly, and the whole point is that such a
          # change shows up in a diff someone reads. What should NOT be manual is
          # remembering — this gate also runs in CI (ci.yml), and finding out there means a
          # red build after the push. Here it costs 27 file hashes and tells you while you
          # can still fix it in one command.
          - name: payload-manifest
            run: bash scripts/pushed_tree.sh bash scripts/payload_manifest_gate.sh
          # Same shape, same reason as payload-manifest above: internal/db/sqlc/ is
          # generated from the migrations and queries, and a migration that drops a table
          # leaves a model behind without breaking a single compile. CI's sqlc-golden job
          # finds it after the push; measured 2026-09-06, that meant master went red on a
          # commit whose own tests passed. Self-guards on a missing sqlc binary — see the
          # script.
          - name: sqlc-sync
            glob: "internal/db/**"
            run: bash scripts/pushed_tree.sh bash scripts/sqlc_sync_gate.sh
          # No inner quotes: lefthook mangles double quotes nested in the single-quoted
          # `bash -c '…'` string, which failed the gate closed at ~0.2s without ever
          # running it. See scripts/deadcode_pre_push.sh.
          - name: deadcode
            run: bash scripts/pushed_tree.sh bash scripts/deadcode_pre_push.sh
          # Frontend dead-code detector (knip) — TS/TSX parity to the Go `deadcode` gate
          # above. Gated on web/** so a Go-only push skips it; self-guards on a missing
          # web/node_modules. Config: web/knip.json (unused files + unreachable value
          # exports + unused deps; type-only findings excluded — Go has no type concept).
          - name: web-deadcode
            glob: "web/**"
            run: bash scripts/pushed_tree.sh bash scripts/check-deadcode-web.sh
          # Frontend static gate — mirrors the CI web-lint job (eslint --max-warnings=0
          # + tsc + prettier --check). Gated on web/** so a Go-only push skips it; the
          # script self-guards on a missing web/node_modules. Heavy frontend gates
          # (vitest coverage, Stryker mutation, Playwright E2E) stay in CI.
          - name: web
            glob: "web/**"
            run: bash scripts/pushed_tree.sh bash scripts/web_quality_hook.sh
