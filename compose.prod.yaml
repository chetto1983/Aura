# compose.prod.yaml — production hardening overlay
# Usage:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# This overlay TIGHTENS the dev defaults without forking compose.yaml.
# Key changes vs dev:
#   - aura dashboard locked to localhost (SSH tunnel for operator access)
#   - all long-running services enforce restart: unless-stopped
#   - healthchecks added at 60 s intervals after warm-up
#
# See docs/RUNBOOK.md for the full deployment guide.

services:

  # ── aura (main binary) ──────────────────────────────────────────────────────
  aura:
    restart: unless-stopped
    environment:
      AURA_HEADLESS: "true"
    ports:
      # Production: dashboard bound to localhost only.
      # Operator access: ssh -L 8080:localhost:8080 <server>
      # The dev 18080 LAN binding is intentionally absent in this overlay.
      - "127.0.0.1:8080:8080"

  # ── searxng ─────────────────────────────────────────────────────────────────
  searxng:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── garage (S3-compatible object store) ─────────────────────────────────────
  garage:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "garage", "status"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ── qdrant (vector DB) ──────────────────────────────────────────────────────
  qdrant:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/healthz 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── llama-embed (embedding server) ──────────────────────────────────────────
  aura-llama-embed:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── markitdown (document converter sidecar) ─────────────────────────────────
  aura-markitdown:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/ 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
