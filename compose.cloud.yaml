# Mini-PC cloud-appliance override — Aura on a small, GPU-less, always-on box with
# EVERY inference backend in the cloud (OpenRouter). Layer it LAST, and do NOT
# combine with compose.gpu.yaml / compose.llm.yaml (those are workstation-only):
#
#   docker compose -f compose.yaml -f compose.cloud.yaml up -d aura caddy
#
# markitdown and searxng come up with it: this override declares them as dependencies of
# aura, so compose starts them transitively. They were NOT dependencies before, and neither
# is optional on an appliance — the result was a stack that reported itself entirely healthy
# and then failed the moment a feature reached one of them:
#
#   upload a document -> dial tcp: lookup markitdown on 127.0.0.11:53: server misbehaving
#   ask for a web search -> the same, for searxng
#
# Declaring the dependency removes the footgun instead of documenting it. `service_started`,
# NOT `service_healthy`: the base compose uses `healthy` for postgres/neo4j/agent-memory,
# which the daemon genuinely cannot serve a request without, while these two back individual
# features that already fail soft and retry. Gating the whole cockpit's boot on metasearch
# would trade a startup-ordering bug for an availability one.
#
# What this override does (all in ONE place — the unified cloud routing):
#   1. Routes all six modalities to OpenRouter on the running aura:local image
#      (chat/vision are already .env-driven; embed/rerank/stt/tts are plumbed here
#      because the base compose neither forwards their model knobs to the aura
#      service nor points their base URLs off the local sidecar DNS).
#   2. Removes the local inference sidecars from the dependency graph: the CUDA
#      embed sidecar (aura-llama-embed) cannot start on a GPU-less host, so its HARD
#      depends_on is reset on both aura and the memory MCP, and the memory MCP's
#      boot wait-loop is patched to stop blocking on it. The stt/tts/rerank/ocr sidecars
#      are still not dependencies and so never start here — deliberately: each is replaced
#      by a cloud endpoint above, unlike markitdown/searxng, which have no cloud twin.
#   3. Shrinks Neo4j's hardcoded heap/pagecache for a small box.
#   4. Every model id, base URL and dimension is ${VAR:-default}, so .env overrides any of
#      them without editing this file. The defaults are what an unconfigured appliance gets,
#      not a fixed policy — the values here were chosen by measurement and are expected to
#      be revised as models change.
#      ONE EXCEPTION, and it is deliberate: the two EMBEDDING base URLs have NO default and
#      the stack refuses to start without them. Every other leg is called once per request;
#      the reasoning classifier embeds 27 anchors before every single turn, one at a time,
#      so a cloud embedder costs ~50-75s per turn instead of a few hundred ms. That is too
#      expensive to be something you get by forgetting a `-f`. See the vars for numbers.
#
# Base-URL conventions are VERIFIED against the client code:
#   embed  → client appends "/v1/embeddings"  → base carries NO /v1  (…/api)
#   rerank → client appends "/v1/rerank"       → base carries NO /v1  (…/api)
#   stt/tts→ client appends "/audio/…"          → uses LLM.BaseURL WITH /v1 (auto)
# OpenRouter rejects opus for /audio/speech (mp3|pcm only) → TTS_FORMAT=mp3.
services:
  aura:
    depends_on:
      # The embed sidecar is NO LONGER dropped here. It used to be, because the base
      # compose pinned the CUDA image — but image and layer offload have been env knobs
      # for a while (AURA_EMBED_IMAGE + AURA_EMBED_NGL), so the same service runs on a
      # GPU-less box as the CPU build. Keeping it means this overlay no longer needs a
      # SECOND overlay to put it back, which is what made "drop one -f and every
      # embedding silently goes to the cloud" possible in the first place.
      # These two back document ingestion and web search. Neither was a dependency of
      # anything, so `up -d aura caddy` simply never started them and the feature failed at
      # the first hop with a DNS error against a service that was never asked to exist.
      # service_started, not service_healthy — see the header.
      markitdown:
        condition: service_started
      searxng:
        condition: service_started
    environment:
      # --- embeddings → the LOCAL sidecar, by default and on purpose.
      #
      # Embeddings are not like the other cloud legs: rerank fires once per search,
      # STT/TTS/vision only when asked, but the adaptive-reasoning classifier embeds 27
      # anchors before EVERY turn, one call at a time. Measured on the appliance:
      #
      #   OpenRouter (qwen3-embedding-8b)  3.9s - 43.3s per call, median ~27s
      #   local sidecar on CPU             21ms - 44ms
      #
      # Three orders of magnitude, times 27 per turn. A "ciao, come stai?" spent 76s in
      # the classifier and 2.7s talking to the model.
      #
      # This used to be a REQUIRED variable, because before that it defaulted to
      # OpenRouter and the default cost an afternoon of debugging. Required fixed the
      # wrong half of the problem: the real hazard was that the local sidecar lived in a
      # SEPARATE overlay you had to remember on every `up`. Now the sidecar is always
      # present, so the safe route can simply BE the default, and cloud embeddings are
      # something you opt into by writing the URL down:
      #
      #   AURA_EMBED_CLOUD_BASE_URL=https://openrouter.ai/api
      #   AURA_EMBED_MODEL=qwen/qwen3-embedding-8b
      #
      # The opt-in knob is deliberately NOT called AURA_EMBED_BASE_URL. That name is
      # already the HOST-CLI value in .env (http://127.0.0.1:8081), and inside this
      # container 127.0.0.1 is the container itself — so honouring it here would let a
      # perfectly correct .env line silently point the daemon at nothing. A separate name
      # cannot collide. Compose-internal DNS, no /v1 (the client appends /v1/embeddings).
      AURA_EMBED_BASE_URL: ${AURA_EMBED_CLOUD_BASE_URL:-http://aura-llama-embed:8081}
      AURA_EMBED_MODEL: ${AURA_EMBED_MODEL-}
      AURA_EMBED_DIMENSIONS: "${AURA_EMBED_DIMENSIONS:-1024}"
      # --- rerank → OpenRouter (Cohere rerank-4-pro) ---
      AURA_RERANK_BASE_URL: ${AURA_RERANK_BASE_URL:-https://openrouter.ai/api}
      AURA_RERANK_MODEL: ${AURA_RERANK_MODEL:-cohere/rerank-4-pro}
      # --- speech-to-text → OpenRouter (whisper-large-v3-turbo) ---
      AURA_STT_CLOUD_MODEL: ${AURA_STT_CLOUD_MODEL:-openai/whisper-large-v3-turbo}
      # --- text-to-speech → OpenRouter (Kokoro-82M; mp3, opus is rejected upstream) ---
      AURA_TTS_MODEL: ${AURA_TTS_MODEL:-hexgrad/kokoro-82m}
      TTS_FORMAT: ${TTS_FORMAT:-mp3}
      # --- vision → cloud (no local aura-ocr-vl) ---
      AURA_VISION_CLOUD: "${AURA_VISION_CLOUD:-true}"
      MULTIMODAL_FALLBACK_MODEL: ${MULTIMODAL_FALLBACK_MODEL:-minimax/minimax-m3}

  aura-agent-memory-mcp:
    environment:
      # Where the sidecar's OpenAI-compatible embedder points (D-28). It MUST agree with
      # AURA_EMBED_BASE_URL above: the two write into the SAME Neo4j vector index, so a
      # stack that embeds queries with one model and stored memories with another
      # retrieves noise while looking healthy. Defaulting both to the local sidecar is how
      # they stay in agreement without an operator remembering to move them together.
      #
      # This leg is why the split-overlay design leaked: it kept pointing at OpenRouter
      # even on runs where the aura service had been put back on the local sidecar.
      #
      # GOING CLOUD TAKES BOTH VARIABLES, and they are two because compose has no
      # ${VAR:+...} form to derive this one from the other (it differs only by the
      # trailing /v1). Set one without the other and the stack embeds queries with one
      # model and stored memories with another against the SAME index — it returns noise
      # and looks healthy. The DEFAULTS agree, which is the half that used to be wrong:
      #
      #   AURA_EMBED_CLOUD_BASE_URL=https://openrouter.ai/api
      #   AURA_MEMORY_EMBED_BASE_URL=https://openrouter.ai/api/v1
      OPENAI_BASE_URL: ${AURA_MEMORY_EMBED_BASE_URL:-http://aura-llama-embed:8081/v1}
      OPENAI_API_KEY: ${AURA_MEMORY_EMBED_API_KEY:-${OPENROUTER_API_KEY:-local-llama}}
      NAM_EMBEDDING: openai/${AURA_EMBED_MODEL:-qwen3-embedding-0.6b}
      # --- rerank → OpenRouter, SAME endpoint + model the aura service uses above ---
      # Without these three the sidecar keeps the base compose's http://aura-rerank:8085,
      # a service that never starts on a GPU-less box: the client fail-softs to identity
      # order and memory recall degrades to pure embedding order — silently, one
      # suppressed log line, looking alive while returning noise (on this embedder an
      # unrelated query scores 0.87-0.89 against every stored preference, against a 0.70
      # threshold). Reranking is where recall becomes discriminating, so it must follow
      # the rest of the stack into the cloud, not be dropped by omission.
      AURA_RERANK_BASE_URL: ${AURA_MEMORY_RERANK_BASE_URL:-https://openrouter.ai/api}
      AURA_RERANK_MODEL: ${AURA_MEMORY_RERANK_MODEL:-cohere/rerank-4-pro}
      AURA_RERANK_API_KEY: ${AURA_MEMORY_RERANK_API_KEY:-${OPENROUTER_API_KEY:?OPENROUTER_API_KEY required in .env}}
    # NO command override here any more. It existed only to delete the
    # aura-llama-embed:8081 wait target, because this overlay used to delete the sidecar
    # itself and the base loop would then block 240s and SystemExit into a crash-loop.
    # The sidecar now always runs, so the base command is correct as written — and a
    # duplicated 30-line boot script that had to stay "byte-identical except one tuple"
    # is exactly the kind of copy that drifts. The embedding width it passes comes from
    # AURA_EMBED_DIMENSIONS, which is set above.

  # Document extraction. markitdown is NOT a dependency of aura, so `up -d aura caddy`
  # leaves it down and an upload dies at extraction with
  # `dial tcp: lookup markitdown on 127.0.0.11:53` — the daemon is healthy, the object
  # store accepted the file, and the pipeline breaks on the next hop. Start it explicitly
  # (see the header) — this block only fixes where its OCR points.
  markitdown:
    environment:
      # Same omission the rerank knobs had: the base compose points OCR at the local
      # aura-ocr-vl sidecar, which cannot run GPU-less and never starts here. The client
      # fail-softs to TEXT-ONLY extraction, so a scanned PDF or a photo ingests as an empty
      # document — silently, with no error anywhere.
      AURA_OCR_BASE_URL: ${AURA_OCR_BASE_URL:-https://openrouter.ai/api/v1}
      # NOT the MULTIMODAL_FALLBACK_MODEL the chat path uses. An OCR misread becomes the
      # document's text, and every chunk, embedding and citation downstream inherits it —
      # so this model is chosen on measured extraction accuracy, not on price.
      #
      # Measured on a synthetic invoice (8 critical fields: number, company, town, 3
      # amounts, VAT, total) in three states — clean, realistically scanned (slight skew,
      # mild blur, light speckle), and deliberately wrecked (half resolution, heavy blur
      # and noise). Fields recovered / latency / cost per page:
      #
      #   gemini-3.5-flash-lite   8/8  8/8  3/8   1.3-1.9s   $0.00065
      #   gemini-2.5-flash        8/8  8/8  1/8   2.0-2.4s   $0.00088
      #   xiaomi/mimo-v2.5:nitro  8/8   -   0/8    15-29s    $0.00043
      #
      # flash-lite wins on every axis, so there is no trade to weigh. mimo is the cheapest
      # per call ONLY on easy pages and is rejected on the one that matters: on the wrecked
      # scan it did not garble the invoice, it produced a DIFFERENT document (a capacitor
      # datasheet). Both gemini variants degrade the safe way — correct layout, wrong
      # digits — and a garbled page is recoverable, an invented one enters the graph as
      # fact. It is also a reasoning model: ~1000 thinking tokens per page erase its price
      # advantage and cost 10-20x the latency, for a task where reasoning buys nothing.
      AURA_OCR_MODEL: ${AURA_OCR_MODEL:-google/gemini-3.5-flash-lite}
      AURA_OCR_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY required in .env}

  neo4j:
    environment:
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
