# Local CPU embeddings on a GPU-less appliance — layer AFTER compose.cloud.yaml:
#
#   docker compose -f compose.yaml -f compose.cloud.yaml -f compose.local-embed.yaml up -d aura caddy
#
# WHY this exists, when compose.cloud.yaml just moved embeddings to OpenRouter: "GPU-less"
# and "everything in the cloud" are not the same decision, and for embeddings the second one
# is wrong. Measured on the reference appliance (4 cores, no GPU, internet over WiFi):
#
#   embedding via OpenRouter (qwen3-embedding-8b)   3.9s - 43.3s   (median ~27s)
#   embedding local on CPU (embeddinggemma-300m)    21ms - 44ms
#
# Three orders of magnitude, and the cloud number is not a model problem — the same call from
# a wired host answered in ~2s, and `:nitro` made it worse, not better. It is the appliance's
# uplink. An embedding is a small, hot, latency-critical call made many times per interaction,
# so it is exactly the wrong thing to put behind a slow link; the chat model, which is far too
# big to run here, is exactly the right thing. Hence: LLM/vision/STT/TTS stay cloud, embeddings
# come home.
#
# The concrete failure that forced this: first-run profile submission maps the form onto up to
# nine sequential memory writes under ONE 60s budget, and each write embeds. At ~27s per
# embedding the third write had already spent the budget, so onboarding died with a 502 and the
# wizard span forever on "Salvataggio profilo...". At 21-44ms the same nine writes are noise.
#
# Model: embeddinggemma-300m (Google, QAT Q4_0 GGUF) — 768 native dimensions, which is what the
# seven HNSW indexes in this deployment are already built for, so nothing is re-indexed. Mean
# pooling is the model's own; -ngl 0 keeps it off any GPU that may appear later.
#
# NOTE ON SWITCHING MODELS: vectors from different embedders are not comparable. Anything
# already embedded by the previous model keeps scoring against the new queries as noise. On a
# fresh appliance that is nothing; on a populated one, re-embed before flipping this on.
services:
  aura-llama-embed:
    # The CUDA image cannot start without a GPU; the CPU build of the same server can.
    image: ${AURA_EMBED_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    command:
      - --hf-repo
      - ${AURA_EMBED_HF_REPO:-lmstudio-community/embeddinggemma-300m-qat-GGUF}
      - --hf-file
      - ${AURA_EMBED_HF_FILE:-embeddinggemma-300m-qat-Q4_0.gguf}
      - --embeddings
      - --pooling
      - mean
      - --embd-normalize
      - "2"
      - -ngl
      - "0"
      - --port
      - "8081"
      - -t
      - "${AURA_EMBED_THREADS:-4}"
      - -ub
      - "2048"

  aura:
    depends_on:
      # compose.cloud.yaml drops this dependency because the CUDA sidecar could never come up.
      # With the CPU build it can, and the daemon should wait for it: an embed-less boot leaves
      # tool_search free-text ranking erroring until it recovers.
      aura-llama-embed:
        condition: service_healthy
    environment:
      # Back to the sidecar. The client appends /v1/embeddings, so the base carries no /v1.
      AURA_EMBED_BASE_URL: http://aura-llama-embed:8081
      # EMPTY on purpose: Config.EmbedRoute treats an unset model as "local sidecar, default
      # model, no auth". Leaving the cloud model name here would keep routing to OpenRouter
      # with the shared key even though the base URL is local.
      AURA_EMBED_MODEL: ""
      AURA_EMBED_DIMENSIONS: "768"

  aura-agent-memory-mcp:
    depends_on:
      aura-llama-embed:
        condition: service_healthy
    environment:
      OPENAI_BASE_URL: http://aura-llama-embed:8081/v1
      OPENAI_API_KEY: local-llama
      NAM_EMBEDDING: openai/embeddinggemma-300m
